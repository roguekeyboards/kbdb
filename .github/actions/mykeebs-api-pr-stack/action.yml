name: mykeebs-api PR stack setup
description: >
  Computes the per-PR CloudFormation stack name and assumes the mykeebs-api-ci
  OIDC-federated deploy role. Shared by ci.yml's functional-test job and
  teardown.yml so both workflows compute the same stack name and
  authenticate the same way.

outputs:
  stack-name:
    description: The per-PR CloudFormation stack name (mykeebs-api-pr-<PR number>).
    value: ${{ steps.compute.outputs.stack-name }}

runs:
  using: composite
  steps:
    - name: Compute stack name
      id: compute
      shell: bash
      run: echo "stack-name=mykeebs-api-pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"

    - name: Configure AWS credentials (CI account, OIDC)
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: arn:aws:iam::475976462467:role/mykeebs-api-github-actions-deploy
        aws-region: us-east-2
        role-session-name: mykeebs-api-pr-${{ github.event.pull_request.number }}
