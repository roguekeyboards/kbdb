name: Warm Cache

on:
  push:
    branches: [main]

concurrency:
  group: warm-cache
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  warm:
    name: Warm mise cache (${{ matrix.runner }})
    strategy:
      matrix:
        # ci.yml's arm64 functional job and x64 jobs have separate keys.
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
