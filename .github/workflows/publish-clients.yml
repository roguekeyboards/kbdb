name: Publish Clients

on:
  release:
    types: [published]

concurrency:
  group: publish-clients-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish-ts-client:
    name: Publish TS Client
    runs-on: ubuntu-latest
    env:
      CLIENT_GEN_OUT_DIR: ts-client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Generate client
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          CLIENT_GEN_VERSION="${RELEASE_TAG#v}" scripts/client-gen.sh

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24 # Active LTS; 24 doesn't enter LTS until Oct 2026
          registry-url: https://npm.pkg.github.com
          scope: "@rogueserenity"

      - name: Set publish registry
        run: npm pkg set publishConfig.registry=https://npm.pkg.github.com
        working-directory: ${{ env.CLIENT_GEN_OUT_DIR }}

      - name: Install and build
        run: npm install
        working-directory: ${{ env.CLIENT_GEN_OUT_DIR }}

      - name: Publish to GitHub Packages
        run: npm publish
        working-directory: ${{ env.CLIENT_GEN_OUT_DIR }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # brand/dist is committed (check-generated and brand's tests keep it in
  # step with its sources), so this only stamps the release version and
  # publishes it - no generation step.
  publish-brand:
    name: Publish Brand
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24 # Active LTS; 24 doesn't enter LTS until Oct 2026
          registry-url: https://npm.pkg.github.com
          scope: "@rogueserenity"

      - name: Stamp version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: npm version "${RELEASE_TAG#v}" --no-git-tag-version
        working-directory: brand

      - name: Publish to GitHub Packages
        run: npm publish
        working-directory: brand
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
