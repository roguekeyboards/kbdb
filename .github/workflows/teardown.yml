name: Teardown

on:
  pull_request:
    types: [closed]

permissions:
  id-token: write
  contents: read

jobs:
  teardown:
    name: Teardown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mykeebs-api PR stack (OIDC auth + stack name)
        id: pr-stack
        uses: ./.github/actions/mykeebs-api-pr-stack

      - name: Empty ImagesBucket
        run: |
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "${{ steps.pr-stack.outputs.stack-name }}" \
            --query "Stacks[0].Outputs[?OutputKey=='ImagesBucketName'].OutputValue" \
            --output text 2>/dev/null || true)
          if [ -n "$BUCKET" ] && [ "$BUCKET" != "None" ]; then
            aws s3 rm "s3://$BUCKET" --recursive
          fi

      # The JWKS bucket outlives every stack, so deleting the stack
      # doesn't clean this up on its own.
      - name: Empty this PR's JWKS prefix
        run: |
          if [ -n "${{ vars.JWKS_BUCKET_NAME }}" ]; then
            aws s3 rm "s3://${{ vars.JWKS_BUCKET_NAME }}/jwks/mykeebs-api-pr-${{ github.event.pull_request.number }}/" --recursive
          fi

      - name: Delete stack
        run: |
          aws cloudformation delete-stack --stack-name "${{ steps.pr-stack.outputs.stack-name }}"
          aws cloudformation wait stack-delete-complete --stack-name "${{ steps.pr-stack.outputs.stack-name }}"
