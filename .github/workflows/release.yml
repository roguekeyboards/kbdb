name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      # A release created with the default GITHUB_TOKEN doesn't trigger
      # other workflows (GitHub's anti-loop restriction on Actions-bot
      # events) - publish-clients.yml's `on: release: published` would
      # never fire. An App token isn't subject to that restriction. Must
      # run before checkout so checkout's own git credentials (used by
      # semantic-release's `git push` of the version tag) are the App
      # token's too, not the default GITHUB_TOKEN's.
      - name: Generate App Token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.RS_TOKEN_APP_ID }}
          private-key: ${{ secrets.RS_TOKEN_APP_PK }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Run semantic-release
        uses: cycjimmy/semantic-release-action@9e1f8a3ef91f1097285028e799a5fb8bb90e8899 # v8.1.0
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
