name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  ECR_REPOSITORY_URI: 475976462467.dkr.ecr.us-east-2.amazonaws.com/kbdb-api

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Lint
        run: mise run lint

  check-generated:
    name: Check Generated Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Check generated files are up to date
        run: mise run check-generated

  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Unit tests
        run: mise run test

  functional-test:
    name: Functional Test
    # Native arm64, matching ApiFunction's real deployed architecture
    # (template.yaml's Architectures: [arm64]) - avoids QEMU-emulated
    # cross-compilation, which failed outright under sam build's Docker
    # build ("exec format error") and would in any case be slower/burn
    # more billed minutes per run than a native arm64 runner for the same
    # per-minute rate (Linux runners aren't multiplier-penalized by arch).
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up kbdb PR stack (OIDC auth + stack name)
        id: pr-stack
        uses: ./.github/actions/kbdb-pr-stack

      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      # functions/api/Dockerfile pulls its base images from public.ecr.aws
      # (Lambda provided runtime, aws-lambda-adapter) - anonymous pulls from
      # shared GitHub-hosted runner IPs hit "toomanyrequests: Rate exceeded"
      # in practice; authenticating (even with no special permissions beyond
      # ecr-public:GetAuthorizationToken) raises the effective rate limit
      # since it's tied to the calling identity, not just source IP.
      - name: Log in to Amazon ECR Public
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        with:
          registry-type: public

      - name: sam build
        run: sam build --config-env ci

      # The JWKS/discovery JSON go to the public kbdb-jwks bucket for the
      # deployed authorizer to fetch; the signing key stays on the runner. The
      # region-specific S3 host is the issuer - API Gateway's authorizer won't
      # follow the generic host's 307 redirect - and the S3 keys mirror it 1:1.
      - name: Generate OIDC signing material
        id: oidc
        run: |
          PR="${{ github.event.pull_request.number }}"
          BUCKET="${{ vars.JWKS_BUCKET_NAME }}"
          PREFIX="jwks/kbdb-pr-${PR}"
          ISSUER="https://${BUCKET}.s3.us-east-2.amazonaws.com/${PREFIX}"
          OIDC_DIR="${RUNNER_TEMP}/oidc"
          KEY_PATH="${OIDC_DIR}/signing-key.pem"
          go run github.com/rogueserenity/oidc-testkit/cmd/oidc-testkit-gen@v1.0.0 \
            --issuer "$ISSUER" --out-dir "$OIDC_DIR" --key-out "$KEY_PATH" >/dev/null
          aws s3 cp "$OIDC_DIR/openid-configuration" \
            "s3://${BUCKET}/${PREFIX}/.well-known/openid-configuration" \
            --content-type application/json
          aws s3 cp "$OIDC_DIR/jwks.json" \
            "s3://${BUCKET}/${PREFIX}/jwks.json" \
            --content-type application/json
          {
            echo "issuer=$ISSUER"
            echo "audience=client_local_kbdb"
            echo "key-path=$KEY_PATH"
          } >> "$GITHUB_OUTPUT"

      - name: sam deploy
        run: |
          sam deploy \
            --config-env ci \
            --stack-name "${{ steps.pr-stack.outputs.stack-name }}" \
            --image-repositories "ApiFunction=${ECR_REPOSITORY_URI}" \
            --image-repositories "ModerateFunction=${ECR_REPOSITORY_URI}" \
            --parameter-overrides \
              "OidcIssuerBaseUrl=${{ steps.oidc.outputs.issuer }}" \
              "OidcAudience=${{ steps.oidc.outputs.audience }}" \
              "IdpConsentPublicToken=public-token-test-local-kbdb" \
              "CorsAllowOrigins=http://localhost:5173" \
              "LogoutReturnOrigins=http://localhost:5173" \
              "DailyUploadLimit=1000000" \
            --tags "kbdb:pr=pr-${{ github.event.pull_request.number }}" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

      - name: Read stack outputs
        id: stack-outputs
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name "${{ steps.pr-stack.outputs.stack-name }}" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text)
          SWITCH_TABLE_NAME=$(aws cloudformation describe-stacks \
            --stack-name "${{ steps.pr-stack.outputs.stack-name }}" \
            --query "Stacks[0].Outputs[?OutputKey=='SwitchTableName'].OutputValue" \
            --output text)
          KEYBOARD_TABLE_NAME=$(aws cloudformation describe-stacks \
            --stack-name "${{ steps.pr-stack.outputs.stack-name }}" \
            --query "Stacks[0].Outputs[?OutputKey=='KeyboardTableName'].OutputValue" \
            --output text)
          KEYCAP_SET_TABLE_NAME=$(aws cloudformation describe-stacks \
            --stack-name "${{ steps.pr-stack.outputs.stack-name }}" \
            --query "Stacks[0].Outputs[?OutputKey=='KeycapSetTableName'].OutputValue" \
            --output text)
          BUILD_TABLE_NAME=$(aws cloudformation describe-stacks \
            --stack-name "${{ steps.pr-stack.outputs.stack-name }}" \
            --query "Stacks[0].Outputs[?OutputKey=='BuildTableName'].OutputValue" \
            --output text)
          PROFILE_TABLE_NAME=$(aws cloudformation describe-stacks \
            --stack-name "${{ steps.pr-stack.outputs.stack-name }}" \
            --query "Stacks[0].Outputs[?OutputKey=='ProfileTableName'].OutputValue" \
            --output text)
          PROFILE_USERNAME_TABLE_NAME=$(aws cloudformation describe-stacks \
            --stack-name "${{ steps.pr-stack.outputs.stack-name }}" \
            --query "Stacks[0].Outputs[?OutputKey=='ProfileUsernameTableName'].OutputValue" \
            --output text)
          UPLOAD_COUNTER_TABLE_NAME=$(aws cloudformation describe-stacks \
            --stack-name "${{ steps.pr-stack.outputs.stack-name }}" \
            --query "Stacks[0].Outputs[?OutputKey=='UploadCounterTableName'].OutputValue" \
            --output text)
          {
            echo "api-url=$API_URL"
            echo "switch-table-name=$SWITCH_TABLE_NAME"
            echo "keyboard-table-name=$KEYBOARD_TABLE_NAME"
            echo "keycap-set-table-name=$KEYCAP_SET_TABLE_NAME"
            echo "build-table-name=$BUILD_TABLE_NAME"
            echo "profile-table-name=$PROFILE_TABLE_NAME"
            echo "profile-username-table-name=$PROFILE_USERNAME_TABLE_NAME"
            echo "upload-counter-table-name=$UPLOAD_COUNTER_TABLE_NAME"
          } >> "$GITHUB_OUTPUT"

      - name: Run functional tests
        env:
          KBDB_API_BASE_URL: ${{ steps.stack-outputs.outputs.api-url }}
          KBDB_OIDC_ISSUER: ${{ steps.oidc.outputs.issuer }}
          KBDB_OIDC_AUDIENCE: ${{ steps.oidc.outputs.audience }}
          KBDB_OIDC_SIGNING_KEY_PATH: ${{ steps.oidc.outputs.key-path }}
          KBDB_SWITCH_TABLE_NAME: ${{ steps.stack-outputs.outputs.switch-table-name }}
          KBDB_KEYBOARD_TABLE_NAME: ${{ steps.stack-outputs.outputs.keyboard-table-name }}
          KBDB_KEYCAP_SET_TABLE_NAME: ${{ steps.stack-outputs.outputs.keycap-set-table-name }}
          KBDB_BUILD_TABLE_NAME: ${{ steps.stack-outputs.outputs.build-table-name }}
          KBDB_PROFILE_TABLE_NAME: ${{ steps.stack-outputs.outputs.profile-table-name }}
          KBDB_PROFILE_USERNAME_TABLE_NAME: ${{ steps.stack-outputs.outputs.profile-username-table-name }}
          KBDB_UPLOAD_COUNTER_TABLE_NAME: ${{ steps.stack-outputs.outputs.upload-counter-table-name }}
          # Explicitly empty (not omitted) - func-test.sh only falls back to
          # its LocalStack default for a genuinely unset variable.
          KBDB_DYNAMODB_ENDPOINT_URL: ""
        run: mise run func-test
