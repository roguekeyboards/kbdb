name: Renovate

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
  issues:
    types: [edited]

permissions:
  contents: read

jobs:
  renovate:
    if: github.event_name != 'issues' || github.event.issue.title == 'Dependency Dashboard'
    runs-on: ubuntu-latest
    steps:
      - name: Generate App Token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.RS_TOKEN_APP_ID }}
          private-key: ${{ secrets.RS_TOKEN_APP_PK }}

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@a63d9a7bc606f7336fd20b47f2f32259a35e6213 # v46.3.9
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_PLATFORM_COMMIT: enabled
        with:
          token: ${{ steps.app-token.outputs.token }}
