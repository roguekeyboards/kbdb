name: Renovate

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
  issues:
    types: [edited]

permissions:
  contents: read

jobs:
  renovate:
    if: github.event_name != 'issues' || github.event.issue.title == 'Dependency Dashboard'
    runs-on: ubuntu-latest
    steps:
      - name: Generate App Token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.TOKEN_APP_CLIENT_ID }}
          private-key: ${{ secrets.TOKEN_APP_PK }}

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@43b963bf5dd5e57f1f95c59765a018d782870211 # v46.3.11
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_PLATFORM_COMMIT: enabled
          # renovate.json's postUpgradeTasks for the consent page's IdP SDK.
          RENOVATE_ALLOWED_COMMANDS: '["^scripts/idp-sdk\\.sh$"]'
        with:
          token: ${{ steps.app-token.outputs.token }}
