AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  kbdb - keyboard database. Infrastructure for the kbdb API: a Lambda
  function fronted by an HTTP API with a native OIDC JWT authorizer, DynamoDB
  tables, an S3 bucket for images with an event-driven moderation function,
  and a budget cost tripwire.

Globals:
  Function:
    Timeout: 10
    MemorySize: 128
    # bootstrap/stack-boundary.yaml, deployed to every account before any
    # stack. PresignSigningRole sets the same boundary.
    PermissionsBoundary: !Sub arn:aws:iam::${AWS::AccountId}:policy/kbdb-stack-boundary

Parameters:
  OidcIssuerBaseUrl:
    Type: String
    Description: >-
      This deployment's OIDC issuer base URL, scheme included - e.g. the
      issuer base URL of your hosted IdP project, or the floci-local
      https://... URL for local dev (see scripts/func-setup.sh). A full URL
      rather than a bare domain, so a caller is never tied to one scheme.
  OidcAudience:
    Type: String
    Description: >-
      The expected aud claim on every access token for this environment
      (REST and MCP alike) - used as the native JWT authorizer's audience.
      Typically the IdP project ID: many IdPs (Stytch among them) put it in
      aud for every token regardless of client type, so one value covers
      both the REST and MCP flows.
  IdpConsentPublicToken:
    Type: String
    Description: >-
      This deployment's IdP browser-SDK public token, rendered into the GET
      /authorize consent page (see internal/consent). Safe to embed
      client-side by design.
  LogoutReturnOrigins:
    Type: String
    Description: >-
      Comma-separated browser origins (each scheme + host + port, e.g.
      http://localhost:5173,https://jay.mykeebs.dev) GET /logout is allowed
      to redirect back to via its return_to param - see internal/consent.
      Typically mykeebs-web's dev server and/or its deployed counterpart.
      Kept as a plain string (not CommaDelimitedList) since it's only ever
      passed straight through to LOGOUT_RETURN_ORIGINS below.
  CustomDomainName:
    Type: String
    Default: ''
    Description: >-
      Optional custom domain for this stack's HttpApi, e.g.
      api.jay.mykeebs.dev. Left empty (the default), no custom domain is
      configured and the stack is only reachable at its default
      execute-api.amazonaws.com URL - func-setup, CI, and any dev stack
      not opting in are unaffected.
  CustomDomainCertificateArn:
    Type: String
    Default: ''
    Description: >-
      ACM certificate ARN for CustomDomainName, same region as this stack.
      Provisioned out-of-band (DNS validation against Cloudflare, not
      Route53, needs an imperative request/validate loop that doesn't fit
      CloudFormation's declarative model) - not created by this template.
      Required if CustomDomainName is set, ignored otherwise.
  CorsAllowOrigins:
    Type: CommaDelimitedList
    Description: >-
      Comma-separated browser origins (each scheme + host + port, e.g.
      http://localhost:5173,https://jay.mykeebs.dev) allowed to call this
      HttpApi cross-origin - typically a local frontend dev server and/or
      its deployed counterpart.

  DailyUploadLimit:
    Type: Number
    Default: 500
    MinValue: 0
    Description: >-
      Image upload URLs issued per UTC day across every user. Each upload can
      trigger a paid moderation call, so this bounds that cost. Once reached,
      upload-URL requests get 429 until the next UTC day.
  RejectedImageExpirationDays:
    Type: Number
    Default: 30
    MinValue: 1
    Description: >-
      Days a rejected image's file is kept (for reviewing a false positive)
      before the bucket's lifecycle rule deletes it.
  ModerationCalibration:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >-
      'true' has the moderation function log every label Rekognition sees,
      at any confidence, for tuning internal/moderation's thresholds.
      Decisions are unchanged.
  AlarmEmail:
    Type: String
    Default: ''
    Description: >-
      Address the alarm topic emails (confirm the subscription by hand
      once). It also gets a notice for every account delete, to remove the
      user from the identity provider by hand (internal/deletenotice).
      Empty, the default, creates no topic, no alarms and no notices.
  BudgetEmail:
    Type: String
    Default: aws-budget@rogueserenity.dev
    Description: Address CostBudget emails at 80% and 100% of the budget.
  ProtectData:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >-
      'true' turns on deletion protection and point-in-time recovery for
      every table holding user data. For prod; dev and CI stacks are torn
      down all the time, so it's off by default.
  ThrottleRateLimit:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[0-9]+(\.[0-9]+)?$'
    Description: >-
      Steady-state requests per second for each HttpApi route (each route
      has its own limit; ApiReservedConcurrency caps the API as a whole).
      Throttled requests aren't billed. Set together with
      ThrottleBurstLimit; empty, the default, leaves the account-level limit
      (so parallel functional tests aren't throttled).
  ThrottleBurstLimit:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[0-9]+$'
    Description: >-
      Burst capacity for each HttpApi route. See ThrottleRateLimit.
  ApiReservedConcurrency:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[0-9]+$'
    Description: >-
      Most ApiFunction invocations running at once, across every route, which
      bounds API cost however requests are spread over routes. Reserved out
      of the account's Lambda concurrency, which must keep 10 unreserved.
      Empty, the default, leaves the function unreserved.

Rules:
  ThrottleSetTogether:
    Assertions:
      - Assert: !Or
          - !And
            - !Equals [!Ref ThrottleRateLimit, '']
            - !Equals [!Ref ThrottleBurstLimit, '']
          - !And
            - !Not [!Equals [!Ref ThrottleRateLimit, '']]
            - !Not [!Equals [!Ref ThrottleBurstLimit, '']]
        AssertDescription: Set ThrottleRateLimit and ThrottleBurstLimit together, or neither.

Conditions:
  HasCustomDomain: !Not [!Equals [!Ref CustomDomainName, '']]
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, '']]
  HasDataProtection: !Equals [!Ref ProtectData, 'true']
  HasThrottle: !Not [!Equals [!Ref ThrottleRateLimit, '']]
  HasApiReservedConcurrency: !Not [!Equals [!Ref ApiReservedConcurrency, '']]

Resources:
  # Holds user-uploaded images (build photos, keycap kit renders). Private -
  # access only via presigned URLs minted by ApiFunction after an ownership/
  # sharing check. Stack-scoped (no per-bucket cost, keeps
  # environments isolated).
  ImagesBucket:
    Type: AWS::S3::Bucket
    # S3 checks it may invoke the function when the notification is set.
    DependsOn: ModerateFunctionS3Permission
    Properties:
      # AccountId+StackName suffix: S3 bucket names are globally unique, and
      # multiple kbdb-pr-<N> stacks share the kbdb-ci account.
      BucketName: !Sub kbdb-images-${AWS::AccountId}-${AWS::StackName}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      # Lets browsers preflight the presigned-URL PUT upload. Authz is the
      # presigned URL itself, not CORS.
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: ["*"]
            AllowedMethods: [PUT]
            AllowedHeaders: ["*"]
            ExposedHeaders: [ETag]
            MaxAge: 3000
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Function: !GetAtt ModerateFunction.Arn
      # The moderation function tags each image it rejects.
      LifecycleConfiguration:
        Rules:
          - Id: expire-rejected-images
            Status: Enabled
            TagFilters:
              - Key: moderation
                Value: rejected
            ExpirationInDays: !Ref RejectedImageExpirationDays

  # ApiFunction assumes this role solely to sign presigned GET URLs. A
  # presigned URL dies with the credentials that signed it, and Lambda's own
  # execution-role credentials arrive via env vars that carry no expiry - the
  # SDK reports CanExpire=false, so the signer can't bound the URL to them and
  # was emitting URLs that outlived their token (S3 answers ExpiredToken).
  # Assuming a role instead returns an explicit Expiration, so the URL's
  # lifetime is one we set via DurationSeconds and can report accurately.
  # GetObject only: this role signs reads, it never writes or deletes.
  PresignSigningRole:
    Type: AWS::IAM::Role
    Properties:
      PermissionsBoundary: !Sub arn:aws:iam::${AWS::AccountId}:policy/kbdb-stack-boundary
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !GetAtt ApiFunctionRole.Arn
            Action: sts:AssumeRole
      # 3600, not higher: ApiFunction assumes this role from Lambda's own
      # assumed execution role, which is role chaining - STS rejects any
      # DurationSeconds over 1h for that, so a larger ceiling here would be
      # misleading.
      MaxSessionDuration: 3600
      Policies:
        - PolicyName: presign-get
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${ImagesBucket.Arn}/*"

  # Standalone rather than inline on ApiFunction: the function's role is
  # PresignSigningRole's trusted principal, so an inline grant would make each
  # role's definition depend on the other's ARN. A separate policy resource
  # references both and is depended on by neither.
  PresignAssumeRolePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: presign-assume-role
      Roles:
        - !Ref ApiFunctionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: sts:AssumeRole
            Resource: !GetAtt PresignSigningRole.Arn

  # User-owned switches. user_id (the owner's IdP subject claim) is the
  # partition key, id the sort key - every real access pattern is scoped to
  # an already-known user_id (see README's DynamoDB rationale), so no GSI is
  # needed; visibility filtering happens as a Query filter expression, not
  # an index.
  SwitchTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: !If [HasDataProtection, true, !Ref AWS::NoValue]
      PointInTimeRecoverySpecification: !If
        - HasDataProtection
        - PointInTimeRecoveryEnabled: true
        - !Ref AWS::NoValue
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
        - AttributeName: id
          KeyType: RANGE

  # User-owned keyboards. Same key schema/rationale as SwitchTable above.
  KeyboardTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: !If [HasDataProtection, true, !Ref AWS::NoValue]
      PointInTimeRecoverySpecification: !If
        - HasDataProtection
        - PointInTimeRecoveryEnabled: true
        - !Ref AWS::NoValue
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
        - AttributeName: id
          KeyType: RANGE

  # User-owned keycap sets. Same key schema/rationale as SwitchTable above.
  KeycapSetTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: !If [HasDataProtection, true, !Ref AWS::NoValue]
      PointInTimeRecoverySpecification: !If
        - HasDataProtection
        - PointInTimeRecoveryEnabled: true
        - !Ref AWS::NoValue
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
        - AttributeName: id
          KeyType: RANGE

  # user_id/id access patterns follow SwitchTable's rationale above, with
  # one exception: BuildRefIndex answers "which builds reference entity X"
  # (e.g. before deleting a Keyboard/Switch/KeycapSet still in use - see
  # issue #172), where the known key is a *referenced entity's* id, not a
  # Build's own id. Builds also carry synthetic "refMarker" items (one per
  # Keyboard/Switch/KeycapKit reference, distinguished by a "REF#..." id
  # rather than a real build id) alongside real Build items, so the GSI has
  # something to index - see internal/repository/dynamo/build_ref.go.
  BuildTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: !If [HasDataProtection, true, !Ref AWS::NoValue]
      PointInTimeRecoverySpecification: !If
        - HasDataProtection
        - PointInTimeRecoveryEnabled: true
        - !Ref AWS::NoValue
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: id
          AttributeType: S
        - AttributeName: ref_id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
        - AttributeName: id
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: BuildRefIndex
          KeySchema:
            - AttributeName: user_id
              KeyType: HASH
            - AttributeName: ref_id
              KeyType: RANGE
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes:
              - build_id

  # User-owned profiles. Unlike every other entity table this has NO sort
  # key: a user has exactly one profile, so user_id (the IdP subject) alone
  # is the primary key. (The lookup table is likewise not user_id/id-keyed,
  # but this is the first *entity* table that isn't.)
  #
  # Two GlobalSecondaryIndexes back the /v1/profiles directory. Both are
  # SPARSE and both partition on a constant value ("1"):
  #   - DiscoverableUsernameIndex: discoverable_pk -> username. Answers
  #     "list all discoverable profiles" (Query with no sort-key condition)
  #     and "search by username prefix" (begins_with).
  #   - DiscoverableDiscordIndex: discord_pk -> discord_username. Answers
  #     "search by Discord handle prefix". discord_username is validated
  #     lowercase-only (internal/profilevalidate), so it doubles as its own
  #     sort key with no separate lowercased copy needed.
  # The discoverable_pk / discord_pk attributes are written by the app ONLY
  # when discoverable is true (discord_pk additionally requires a
  # discord_username), so non-discoverable profiles are simply absent from
  # the indexes - no filter expression needed - and each index stays small.
  #
  # A constant partition key means each index is a single hot partition.
  # Ceilings: ~1,000 discoverable-profile writes/sec (one-partition WCU) and
  # ~10 GB (~20M profiles). Reads are bounded Query + pagination and stay
  # fine well past that; this is a personal-collection directory, nowhere
  # near those limits. Escape hatch if it ever matters: shard the constant
  # PK into "1".."N" (hash of user_id) and scatter-gather in ListPublic.
  ProfileTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: !If [HasDataProtection, true, !Ref AWS::NoValue]
      PointInTimeRecoverySpecification: !If
        - HasDataProtection
        - PointInTimeRecoveryEnabled: true
        - !Ref AWS::NoValue
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: discoverable_pk
          AttributeType: S
        - AttributeName: username
          AttributeType: S
        - AttributeName: discord_pk
          AttributeType: S
        - AttributeName: discord_username
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: DiscoverableUsernameIndex
          KeySchema:
            - AttributeName: discoverable_pk
              KeyType: HASH
            - AttributeName: username
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: DiscoverableDiscordIndex
          KeySchema:
            - AttributeName: discord_pk
              KeyType: HASH
            - AttributeName: discord_username
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # Enforces Profile.username uniqueness - a GSI can't. Holds one
  # { username -> user_id } claim item per profile, written in the same
  # TransactWriteItems as the ProfileTable item (conditional on
  # attribute_not_exists). Deliberate cost: a second table and 2x write cost
  # on profile create/rename.
  ProfileUsernameTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: !If [HasDataProtection, true, !Ref AWS::NoValue]
      PointInTimeRecoverySpecification: !If
        - HasDataProtection
        - PointInTimeRecoveryEnabled: true
        - !Ref AWS::NoValue
      AttributeDefinitions:
        - AttributeName: username
          AttributeType: S
      KeySchema:
        - AttributeName: username
          KeyType: HASH

  # One item per UTC day counting issued image upload URLs - see
  # internal/uploadlimit. The TTL drops each day's item once it's over.
  UploadCounterTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: day
          AttributeType: S
      KeySchema:
        - AttributeName: day
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  # Matches ApiFunction's explicit FunctionName below so Lambda writes here
  # instead of auto-creating an unmanaged, never-expiring log group.
  ApiFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/kbdb-api-${AWS::StackName}
      RetentionInDays: 14

  # Added after kbdb#371's unexplained 401s left nothing to diagnose once
  # the per-PR stack tore down.
  HttpApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/apigateway/kbdb-api-${AWS::StackName}
      RetentionInDays: 14

  # Longer than RejectedImageExpirationDays's default, so a rejection's
  # decision line is still here for as long as its file can be reviewed. 60,
  # not 30 (which would race the file's expiry) or 31 (not a valid value).
  ModerateFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/kbdb-moderate-${AWS::StackName}
      RetentionInDays: 60

  # Events the moderation function still failed after Lambda's retries,
  # kept for a manual re-drive. 14 days is SQS's maximum.
  ModerationDLQ:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600

  # Invoked by ImagesBucket for every uploaded image; marks it approved or
  # rejected - see internal/moderation. Packaged as a container image like
  # ApiFunction, without the web adapter. No ReservedConcurrentExecutions:
  # setting it to 0 by hand is the pause switch, and a deploy mustn't undo
  # a pause.
  ModerateFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub kbdb-moderate-${AWS::StackName}
      PackageType: Image
      Architectures:
        - arm64
      # Decoding and re-encoding a WebP needs more than the default.
      MemorySize: 512
      Timeout: 30
      Environment:
        Variables:
          SWITCH_TABLE_NAME: !Ref SwitchTable
          KEYBOARD_TABLE_NAME: !Ref KeyboardTable
          KEYCAP_SET_TABLE_NAME: !Ref KeycapSetTable
          BUILD_TABLE_NAME: !Ref BuildTable
          PROFILE_TABLE_NAME: !Ref ProfileTable
          PROFILE_USERNAME_TABLE_NAME: !Ref ProfileUsernameTable
          MODERATION_CALIBRATION: !Ref ModerationCalibration
      # The bucket is named by string, not !GetAtt: ImagesBucket already
      # depends on this function through its notification.
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObjectTagging
              Resource: !Sub "arn:aws:s3:::kbdb-images-${AWS::AccountId}-${AWS::StackName}/*"
            - Effect: Allow
              Action: rekognition:DetectModerationLabels
              Resource: "*"
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource:
                - !GetAtt SwitchTable.Arn
                - !GetAtt KeyboardTable.Arn
                - !GetAtt KeycapSetTable.Arn
                - !GetAtt BuildTable.Arn
                - !GetAtt ProfileTable.Arn
      # Two retries, then the DLQ. Events throttled by a pause keep retrying
      # for up to 6 hours, so a short pause catches up on its own.
      EventInvokeConfig:
        MaximumRetryAttempts: 2
        MaximumEventAgeInSeconds: 21600
        DestinationConfig:
          OnFailure:
            Type: SQS
            Destination: !GetAtt ModerationDLQ.Arn
    Metadata:
      Dockerfile: functions/moderate/Dockerfile
      DockerContext: .
      DockerTag: latest

  ModerateFunctionS3Permission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt ModerateFunction.Arn
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub "arn:aws:s3:::kbdb-images-${AWS::AccountId}-${AWS::StackName}"

  AlarmTopic:
    Type: AWS::SNS::Topic
    Condition: HasAlarmEmail
    Properties:
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlarmEmail

  # Any event in the DLQ is an image left pending until it's re-driven.
  ModerationDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlarmEmail
    Properties:
      AlarmDescription: Moderation events failed every retry and are waiting in the DLQ
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt ModerationDLQ.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  ModerateFunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlarmEmail
    Properties:
      AlarmDescription: The moderation function returned errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ModerateFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  ApiFunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlarmEmail
    Properties:
      AlarmDescription: The API function returned errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ApiFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  HttpApi5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlarmEmail
    Properties:
      AlarmDescription: The HTTP API returned 5xx responses
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: !Ref HttpApi
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  # The account delete notice is how the operator learns to remove a user
  # from the identity provider; if it fails to send, this is the backstop.
  # The pattern matches internal/accountdelete.NoticeFailed, and the log line
  # carries the user ID (owner_id). The API logs are kept 14 days.
  AccountDeleteNoticeFailedFilter:
    Type: AWS::Logs::MetricFilter
    Condition: HasAlarmEmail
    Properties:
      LogGroupName: !Ref ApiFunctionLogGroup
      FilterPattern: '"account delete notice failed"'
      MetricTransformations:
        - MetricNamespace: kbdb
          MetricName: !Sub AccountDeleteNoticeFailed-${AWS::StackName}
          MetricValue: '1'

  AccountDeleteNoticeFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlarmEmail
    Properties:
      AlarmDescription: >-
        An account delete notice failed to send. Find "account delete notice
        failed" in the API function's logs and remove that owner_id from the
        identity provider by hand.
      Namespace: kbdb
      MetricName: !Sub AccountDeleteNoticeFailed-${AWS::StackName}
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  # Single Lambda function for all routes (REST entities + MCP), not split
  # by protocol or by entity - see plan rationale. Packaged as a container
  # image (aws-lambda-web-adapter sidecar) rather than a zip - see
  # functions/api/Dockerfile.
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub kbdb-api-${AWS::StackName}
      PackageType: Image
      ReservedConcurrentExecutions: !If
        - HasApiReservedConcurrency
        - !Ref ApiReservedConcurrency
        - !Ref AWS::NoValue
      Architectures:
        - arm64
      Environment:
        Variables:
          OIDC_ISSUER_URL: !Ref OidcIssuerBaseUrl
          OIDC_AUDIENCE: !Ref OidcAudience
          IDP_CONSENT_PUBLIC_TOKEN: !Ref IdpConsentPublicToken
          LOGOUT_RETURN_ORIGINS: !Ref LogoutReturnOrigins
          IMAGES_BUCKET_NAME: !Ref ImagesBucket
          PRESIGN_ROLE_ARN: !GetAtt PresignSigningRole.Arn
          SWITCH_TABLE_NAME: !Ref SwitchTable
          KEYBOARD_TABLE_NAME: !Ref KeyboardTable
          KEYCAP_SET_TABLE_NAME: !Ref KeycapSetTable
          BUILD_TABLE_NAME: !Ref BuildTable
          PROFILE_TABLE_NAME: !Ref ProfileTable
          PROFILE_USERNAME_TABLE_NAME: !Ref ProfileUsernameTable
          UPLOAD_COUNTER_TABLE_NAME: !Ref UploadCounterTable
          DAILY_UPLOAD_LIMIT: !Ref DailyUploadLimit
          ACCOUNT_DELETE_TOPIC_ARN: !If [HasAlarmEmail, !Ref AlarmTopic, '']
          # Empty in real deployments; sam local's --env-vars override
          # (env.local.json) can only override a var declared here.
          DYNAMODB_ENDPOINT_URL: ""
          S3_ENDPOINT_URL: ""
          # Not 8080: sam local start-api's Runtime Interface Emulator already
          # binds that port in-container. Must match functions/api/main.go's
          # port const.
          AWS_LWA_PORT: "8000"
      # Hand-written, not SAM's S3CrudPolicy/DynamoDBReadPolicy (those grant
      # extra actions we don't need). Presigned URLs inherit this role's
      # permissions, so Put/Get cover upload/download; Delete is for the
      # DELETE-image endpoints. ListBucket and BatchWriteItem are for an
      # account delete (internal/accountdelete), which removes a user's
      # images by key prefix and their items by partition.
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
                - s3:DeleteObject
              Resource: !Sub "${ImagesBucket.Arn}/*"
            - Effect: Allow
              Action: s3:ListBucket
              Resource: !GetAtt ImagesBucket.Arn
            - !If
              - HasAlarmEmail
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref AlarmTopic
              - !Ref AWS::NoValue
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:BatchWriteItem
              Resource: !GetAtt SwitchTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:BatchWriteItem
              Resource: !GetAtt KeyboardTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:BatchWriteItem
              Resource: !GetAtt KeycapSetTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:TransactWriteItems
                - dynamodb:BatchWriteItem
              Resource: !GetAtt BuildTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource: !Sub "${BuildTable.Arn}/index/BuildRefIndex"
            # Profile writes touch both tables in one TransactWriteItems, so
            # both get the transaction set; the profile item itself is also
            # mutated in place via UpdateItem (same-username Update, avatar
            # path), hence dynamodb:UpdateItem on ProfileTable only.
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:TransactWriteItems
              Resource: !GetAtt ProfileTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:DeleteItem
                - dynamodb:TransactWriteItems
              Resource: !GetAtt ProfileUsernameTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
              Resource: !GetAtt UploadCounterTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource:
                - !Sub "${ProfileTable.Arn}/index/DiscoverableUsernameIndex"
                - !Sub "${ProfileTable.Arn}/index/DiscoverableDiscordIndex"
    Metadata:
      # DockerContext is the repo root, not functions/api/, so the build has
      # access to the whole Go module (internal/ packages, go.mod/go.sum) -
      # the Dockerfile itself still lives in functions/api/.
      Dockerfile: functions/api/Dockerfile
      DockerContext: .
      DockerTag: latest

  # One permission for every route in HttpApi's definition, instead of SAM's
  # one per route event, which outgrew Lambda's 20 KB resource policy limit.
  ApiFunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ApiFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      # Routes and the JWT authorizer, generated from api/openapi.yaml by
      # `mise run gen` - see internal/gatewayroutes.
      DefinitionBody:
        Fn::Transform:
          Name: AWS::Include
          Parameters:
            Location: api/gateway.gen.yaml
      DefaultRouteSettings: !If
        - HasThrottle
        - ThrottlingRateLimit: !Ref ThrottleRateLimit
          ThrottlingBurstLimit: !Ref ThrottleBurstLimit
        - !Ref AWS::NoValue
      AccessLogSettings:
        DestinationArn: !GetAtt HttpApiAccessLogGroup.Arn
        Format: >-
          {"requestId":"$context.requestId","ip":"$context.identity.sourceIp","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","routeKey":"$context.routeKey","status":"$context.status","authorizerError":"$context.authorizer.error","integrationErrorMessage":"$context.integrationErrorMessage","responseLatency":"$context.responseLatency"}
      # API Gateway auto-generates OPTIONS routes for CORS preflight and
      # exempts them from the JWT authorizer - without this, browser
      # preflight requests 404 (no OPTIONS route exists) before the
      # authorizer is ever reached, blocking every browser-based caller.
      CorsConfiguration:
        AllowOrigins: !Ref CorsAllowOrigins
        AllowHeaders:
          - authorization
          - content-type
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS

  # Raw CFN, not SAM's HttpApi.Properties.Domain shorthand - that shorthand
  # is expanded by the SAM transform itself (macro-time), which can't see
  # through an Fn::If the way plain CloudFormation resources can (confirmed
  # via a real "Custom Domains only works if both DomainName and
  # CertificateArn are provided" transform error when conditionally
  # omitting it). DNS validation and the api.<name> CNAME both live in
  # Cloudflare, not Route53, so nothing here talks to Route53.
  ApiCustomDomain:
    Type: AWS::ApiGatewayV2::DomainName
    Condition: HasCustomDomain
    Properties:
      DomainName: !Ref CustomDomainName
      DomainNameConfigurations:
        - CertificateArn: !Ref CustomDomainCertificateArn
          EndpointType: REGIONAL

  # No ApiMappingKey (empty path prefix) - internal/router's routes
  # (/v1/..., /mcp) should map straight through with no extra segment.
  ApiCustomDomainMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Condition: HasCustomDomain
    Properties:
      ApiId: !Ref HttpApi
      DomainName: !Ref ApiCustomDomain
      Stage: !Ref HttpApiApiGatewayDefaultStage

  CostBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: 10
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail

Outputs:
  ApiUrl:
    Description: Base URL of the HTTP API
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
  ApiCustomDomainTarget:
    Description: >-
      Only present when CustomDomainName is set. Cloudflare CNAME target for
      the custom domain (api.mykeebs.info, api.<name>.mykeebs.dev) - point a
      DNS-only (not proxied) CNAME record at this value.
    Condition: HasCustomDomain
    Value: !GetAtt ApiCustomDomain.RegionalDomainName
  ImagesBucketName:
    Description: S3 bucket holding user-uploaded images (build photos, keycap kit renders)
    Value: !Ref ImagesBucket
  SwitchTableName:
    Description: DynamoDB table backing GET /users/{userId}/switches
    Value: !Ref SwitchTable
  KeyboardTableName:
    Description: DynamoDB table backing GET /users/{userId}/keyboards
    Value: !Ref KeyboardTable
  KeycapSetTableName:
    Description: DynamoDB table backing GET /users/{userId}/keycap-sets
    Value: !Ref KeycapSetTable
  BuildTableName:
    Description: DynamoDB table backing GET /users/{userId}/builds
    Value: !Ref BuildTable
  ProfileTableName:
    Description: DynamoDB table backing GET /v1/profile/{identifier} and /v1/profiles
    Value: !Ref ProfileTable
  ProfileUsernameTableName:
    Description: DynamoDB table enforcing Profile.username uniqueness
    Value: !Ref ProfileUsernameTable
  UploadCounterTableName:
    Description: DynamoDB table counting image upload URLs issued per UTC day
    Value: !Ref UploadCounterTable
  ModerateFunctionArn:
    Description: The moderation function ImagesBucket invokes for each upload
    Value: !GetAtt ModerateFunction.Arn
  ModerationDLQUrl:
    Description: Moderation events that failed every retry
    Value: !Ref ModerationDLQ
