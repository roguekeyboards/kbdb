AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  kbdb - keyboard database. Infrastructure for the kbdb API: a single
  Lambda function fronted by an HTTP API with a native OIDC JWT authorizer,
  DynamoDB tables, an S3 bucket for images, and a budget cost tripwire.

Globals:
  Function:
    Timeout: 10
    MemorySize: 128

Parameters:
  OidcIssuerBaseUrl:
    Type: String
    Description: >-
      This deployment's OIDC issuer base URL, scheme included - e.g. the
      issuer base URL of your hosted IdP project, or the floci-local
      https://... URL for local dev (see scripts/func-setup.sh). A full URL
      rather than a bare domain, so a caller is never tied to one scheme.
  OidcAudience:
    Type: String
    Description: >-
      The expected aud claim on every access token for this environment
      (REST and MCP alike) - used as the native JWT authorizer's audience.
      Typically the IdP project ID: many IdPs (Stytch among them) put it in
      aud for every token regardless of client type, so one value covers
      both the REST and MCP flows.
  IdpConsentPublicToken:
    Type: String
    Description: >-
      This deployment's IdP browser-SDK public token, rendered into the GET
      /authorize consent page (see internal/consent). Safe to embed
      client-side by design.
  LogoutReturnOrigins:
    Type: String
    Description: >-
      Comma-separated browser origins (each scheme + host + port, e.g.
      http://localhost:5173,https://jay.mykeebs.dev) GET /logout is allowed
      to redirect back to via its return_to param - see internal/consent.
      Typically mykeebs-web's dev server and/or its deployed counterpart.
      Kept as a plain string (not CommaDelimitedList) since it's only ever
      passed straight through to LOGOUT_RETURN_ORIGINS below.
  CustomDomainName:
    Type: String
    Default: ''
    Description: >-
      Optional custom domain for this stack's HttpApi, e.g.
      api.jay.mykeebs.dev. Left empty (the default), no custom domain is
      configured and the stack is only reachable at its default
      execute-api.amazonaws.com URL - func-setup, CI, and any dev stack
      not opting in are unaffected.
  CustomDomainCertificateArn:
    Type: String
    Default: ''
    Description: >-
      ACM certificate ARN for CustomDomainName, same region as this stack.
      Provisioned out-of-band (DNS validation against Cloudflare, not
      Route53, needs an imperative request/validate loop that doesn't fit
      CloudFormation's declarative model) - not created by this template.
      Required if CustomDomainName is set, ignored otherwise.
  CorsAllowOrigins:
    Type: CommaDelimitedList
    Description: >-
      Comma-separated browser origins (each scheme + host + port, e.g.
      http://localhost:5173,https://jay.mykeebs.dev) allowed to call this
      HttpApi cross-origin - typically a local frontend dev server and/or
      its deployed counterpart.

  DailyUploadLimit:
    Type: Number
    Default: 500
    MinValue: 0
    Description: >-
      Image upload URLs issued per UTC day across every user. Each upload can
      trigger a paid moderation call, so this bounds that cost. Once reached,
      upload-URL requests get 429 until the next UTC day.

Conditions:
  HasCustomDomain: !Not [!Equals [!Ref CustomDomainName, '']]

Resources:
  # Holds user-uploaded images (build photos, keycap kit renders). Private -
  # access only via presigned URLs minted by ApiFunction after an ownership/
  # sharing check. Stack-scoped (no per-bucket cost, keeps
  # environments isolated).
  ImagesBucket:
    Type: AWS::S3::Bucket
    Properties:
      # AccountId+StackName suffix: S3 bucket names are globally unique, and
      # multiple kbdb-pr-<N> stacks share the kbdb-ci account.
      BucketName: !Sub kbdb-images-${AWS::AccountId}-${AWS::StackName}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      # Lets browsers preflight the presigned-URL PUT upload. Authz is the
      # presigned URL itself, not CORS.
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: ["*"]
            AllowedMethods: [PUT]
            AllowedHeaders: ["*"]
            ExposedHeaders: [ETag]
            MaxAge: 3000

  # ApiFunction assumes this role solely to sign presigned GET URLs. A
  # presigned URL dies with the credentials that signed it, and Lambda's own
  # execution-role credentials arrive via env vars that carry no expiry - the
  # SDK reports CanExpire=false, so the signer can't bound the URL to them and
  # was emitting URLs that outlived their token (S3 answers ExpiredToken).
  # Assuming a role instead returns an explicit Expiration, so the URL's
  # lifetime is one we set via DurationSeconds and can report accurately.
  # GetObject only: this role signs reads, it never writes or deletes.
  PresignSigningRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !GetAtt ApiFunctionRole.Arn
            Action: sts:AssumeRole
      # 3600, not higher: ApiFunction assumes this role from Lambda's own
      # assumed execution role, which is role chaining - STS rejects any
      # DurationSeconds over 1h for that, so a larger ceiling here would be
      # misleading.
      MaxSessionDuration: 3600
      Policies:
        - PolicyName: presign-get
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${ImagesBucket.Arn}/*"

  # Standalone rather than inline on ApiFunction: the function's role is
  # PresignSigningRole's trusted principal, so an inline grant would make each
  # role's definition depend on the other's ARN. A separate policy resource
  # references both and is depended on by neither.
  PresignAssumeRolePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: presign-assume-role
      Roles:
        - !Ref ApiFunctionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: sts:AssumeRole
            Resource: !GetAtt PresignSigningRole.Arn

  # User-owned switches. user_id (the owner's IdP subject claim) is the
  # partition key, id the sort key - every real access pattern is scoped to
  # an already-known user_id (see README's DynamoDB rationale), so no GSI is
  # needed; visibility filtering happens as a Query filter expression, not
  # an index. scripts/func-setup.sh hand-creates an equivalent table against
  # LocalStack (sam local start-api doesn't run a real CloudFormation
  # deploy) - keep that script's schema in sync with this resource.
  SwitchTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
        - AttributeName: id
          KeyType: RANGE

  # User-owned keyboards. Same key schema/rationale as SwitchTable above.
  # scripts/func-setup.sh hand-creates an equivalent table against
  # LocalStack - keep that script's schema in sync with this resource.
  KeyboardTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
        - AttributeName: id
          KeyType: RANGE

  # User-owned keycap sets. Same key schema/rationale as SwitchTable above.
  # scripts/func-setup.sh hand-creates an equivalent table against
  # LocalStack - keep that script's schema in sync with this resource.
  KeycapSetTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
        - AttributeName: id
          KeyType: RANGE

  # user_id/id access patterns follow SwitchTable's rationale above, with
  # one exception: BuildRefIndex answers "which builds reference entity X"
  # (e.g. before deleting a Keyboard/Switch/KeycapSet still in use - see
  # issue #172), where the known key is a *referenced entity's* id, not a
  # Build's own id. Builds also carry synthetic "refMarker" items (one per
  # Keyboard/Switch/KeycapKit reference, distinguished by a "REF#..." id
  # rather than a real build id) alongside real Build items, so the GSI has
  # something to index - see internal/repository/dynamo/build_ref.go.
  # scripts/func-setup.sh hand-creates an equivalent table+index against
  # LocalStack - keep that script's schema in sync with this resource.
  BuildTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: id
          AttributeType: S
        - AttributeName: ref_id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
        - AttributeName: id
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: BuildRefIndex
          KeySchema:
            - AttributeName: user_id
              KeyType: HASH
            - AttributeName: ref_id
              KeyType: RANGE
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes:
              - build_id

  # User-owned profiles. Unlike every other entity table this has NO sort
  # key: a user has exactly one profile, so user_id (the IdP subject) alone
  # is the primary key. (The lookup table is likewise not user_id/id-keyed,
  # but this is the first *entity* table that isn't.)
  #
  # Two GlobalSecondaryIndexes back the /v1/profiles directory. Both are
  # SPARSE and both partition on a constant value ("1"):
  #   - DiscoverableUsernameIndex: discoverable_pk -> username. Answers
  #     "list all discoverable profiles" (Query with no sort-key condition)
  #     and "search by username prefix" (begins_with).
  #   - DiscoverableDiscordIndex: discord_pk -> discord_username. Answers
  #     "search by Discord handle prefix". discord_username is validated
  #     lowercase-only (internal/profilevalidate), so it doubles as its own
  #     sort key with no separate lowercased copy needed.
  # The discoverable_pk / discord_pk attributes are written by the app ONLY
  # when discoverable is true (discord_pk additionally requires a
  # discord_username), so non-discoverable profiles are simply absent from
  # the indexes - no filter expression needed - and each index stays small.
  #
  # A constant partition key means each index is a single hot partition.
  # Ceilings: ~1,000 discoverable-profile writes/sec (one-partition WCU) and
  # ~10 GB (~20M profiles). Reads are bounded Query + pagination and stay
  # fine well past that; this is a personal-collection directory, nowhere
  # near those limits. Escape hatch if it ever matters: shard the constant
  # PK into "1".."N" (hash of user_id) and scatter-gather in ListPublic.
  ProfileTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: discoverable_pk
          AttributeType: S
        - AttributeName: username
          AttributeType: S
        - AttributeName: discord_pk
          AttributeType: S
        - AttributeName: discord_username
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: DiscoverableUsernameIndex
          KeySchema:
            - AttributeName: discoverable_pk
              KeyType: HASH
            - AttributeName: username
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: DiscoverableDiscordIndex
          KeySchema:
            - AttributeName: discord_pk
              KeyType: HASH
            - AttributeName: discord_username
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # Enforces Profile.username uniqueness - a GSI can't. Holds one
  # { username -> user_id } claim item per profile, written in the same
  # TransactWriteItems as the ProfileTable item (conditional on
  # attribute_not_exists). Deliberate cost: a second table and 2x write cost
  # on profile create/rename.
  ProfileUsernameTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: username
          AttributeType: S
      KeySchema:
        - AttributeName: username
          KeyType: HASH

  # One item per UTC day counting issued image upload URLs - see
  # internal/uploadlimit. The TTL drops each day's item once it's over.
  UploadCounterTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: day
          AttributeType: S
      KeySchema:
        - AttributeName: day
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  # Matches ApiFunction's explicit FunctionName below so Lambda writes here
  # instead of auto-creating an unmanaged, never-expiring log group.
  ApiFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/kbdb-api-${AWS::StackName}
      RetentionInDays: 14

  # Added after kbdb#371's unexplained 401s left nothing to diagnose once
  # the per-PR stack tore down.
  HttpApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/apigateway/kbdb-api-${AWS::StackName}
      RetentionInDays: 14

  # Single Lambda function for all routes (REST entities + MCP), not split
  # by protocol or by entity - see plan rationale. Packaged as a container
  # image (aws-lambda-web-adapter sidecar) rather than a zip - see
  # functions/api/Dockerfile.
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub kbdb-api-${AWS::StackName}
      PackageType: Image
      Architectures:
        - arm64
      Environment:
        Variables:
          OIDC_ISSUER_URL: !Ref OidcIssuerBaseUrl
          OIDC_AUDIENCE: !Ref OidcAudience
          IDP_CONSENT_PUBLIC_TOKEN: !Ref IdpConsentPublicToken
          LOGOUT_RETURN_ORIGINS: !Ref LogoutReturnOrigins
          IMAGES_BUCKET_NAME: !Ref ImagesBucket
          PRESIGN_ROLE_ARN: !GetAtt PresignSigningRole.Arn
          SWITCH_TABLE_NAME: !Ref SwitchTable
          KEYBOARD_TABLE_NAME: !Ref KeyboardTable
          KEYCAP_SET_TABLE_NAME: !Ref KeycapSetTable
          BUILD_TABLE_NAME: !Ref BuildTable
          PROFILE_TABLE_NAME: !Ref ProfileTable
          PROFILE_USERNAME_TABLE_NAME: !Ref ProfileUsernameTable
          UPLOAD_COUNTER_TABLE_NAME: !Ref UploadCounterTable
          DAILY_UPLOAD_LIMIT: !Ref DailyUploadLimit
          # Empty in real deployments; sam local's --env-vars override
          # (env.local.json) can only override a var declared here.
          DYNAMODB_ENDPOINT_URL: ""
          S3_ENDPOINT_URL: ""
          # Not 8080: sam local start-api's Runtime Interface Emulator already
          # binds that port in-container. Must match functions/api/main.go's
          # port const.
          AWS_LWA_PORT: "8000"
      # Hand-written, not SAM's S3CrudPolicy/DynamoDBReadPolicy (those grant
      # extra actions we don't need). Presigned URLs inherit this role's
      # permissions, so Put/Get cover upload/download; Delete is for the
      # DELETE-image endpoints.
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
                - s3:DeleteObject
              Resource: !Sub "${ImagesBucket.Arn}/*"
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
              Resource: !GetAtt SwitchTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
              Resource: !GetAtt KeyboardTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
              Resource: !GetAtt KeycapSetTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:TransactWriteItems
              Resource: !GetAtt BuildTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource: !Sub "${BuildTable.Arn}/index/BuildRefIndex"
            # Profile writes touch both tables in one TransactWriteItems, so
            # both get the transaction set; the profile item itself is also
            # mutated in place via UpdateItem (same-username Update, avatar
            # path), hence dynamodb:UpdateItem on ProfileTable only.
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:TransactWriteItems
              Resource: !GetAtt ProfileTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:DeleteItem
                - dynamodb:TransactWriteItems
              Resource: !GetAtt ProfileUsernameTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
              Resource: !GetAtt UploadCounterTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource:
                - !Sub "${ProfileTable.Arn}/index/DiscoverableUsernameIndex"
                - !Sub "${ProfileTable.Arn}/index/DiscoverableDiscordIndex"
      Events:
        # No auth: security: [] in api/openapi.yaml. Lookup categories are
        # static, deploy-time data (internal/lookup) - GET only, no write
        # routes.
        LookupsEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/lookups
            Method: get
            Auth:
              Authorizer: NONE
        # No auth: security: [] in api/openapi.yaml.
        GetLookupEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/lookups/{category}
            Method: get
            Auth:
              Authorizer: NONE
        # Auth: NONE at the gateway (security: [{}, BearerAuth] in
        # api/openapi.yaml - anonymous callers may read discoverable
        # profiles); the app applies the discoverable-or-owner rule itself
        # via middleware.OptionalAuth and internal/profileread.
        GetProfileEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/profile/{identifier}
            Method: get
            Auth:
              Authorizer: NONE
        # Same path as GetProfileEvent, POST only. Default OidcAuthorizer
        # applies (security: [BearerAuth] in api/openapi.yaml, no anonymous
        # override, unlike the GET) - {identifier} must be the caller's own
        # subject, checked at the app layer by authz.IsOwner.
        CreateProfileEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/profile/{identifier}
            Method: post
        # Same path/auth as CreateProfileEvent, PUT only - a full replace of
        # the caller's own profile; {identifier} must be their own subject
        # (authz.IsOwner at the app layer).
        UpdateProfileEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/profile/{identifier}
            Method: put
        # Same path/auth as CreateProfileEvent, DELETE only - a leaf delete
        # of the caller's own profile; {identifier} must be their own
        # subject (authz.IsOwner at the app layer). Idempotent.
        DeleteProfileEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/profile/{identifier}
            Method: delete
        # The public directory. Auth: NONE at the gateway (security: [{},
        # BearerAuth] in api/openapi.yaml - anonymous callers allowed); the
        # app returns only discoverable profiles, so there is no per-caller
        # visibility rule. Backed by the ProfileTable directory GSIs.
        ListProfilesEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/profiles
            Method: get
            Auth:
              Authorizer: NONE
        # Avatar upload/removal. Default OidcAuthorizer applies (no anonymous
        # override) - {identifier} must be the caller's own subject, checked
        # at the app layer by authz.IsOwner. The avatar objects reuse the
        # existing ImagesBucket IAM statement (${ImagesBucket.Arn}/*).
        SetProfileImageEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/profile/{identifier}/image
            Method: post
        DeleteProfileImageEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/profile/{identifier}/image
            Method: delete
        # Auth: NONE at the gateway (security: [{}, BearerAuth] in
        # api/openapi.yaml - anonymous callers are allowed); the app enforces
        # per-item visibility itself via middleware.OptionalAuth and
        # internal/authz.ReadableVisibilities.
        ListSwitchesEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/users/{userId}/switches
            Method: get
            Auth:
              Authorizer: NONE
        # Auth: NONE at the gateway - same rationale as ListSwitchesEvent.
        GetSwitchEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/users/{userId}/switches/{switchId}
            Method: get
            Auth:
              Authorizer: NONE
        # Default OidcAuthorizer applies (security: [BearerAuth] in
        # api/openapi.yaml, no anonymous override, unlike the GET routes) -
        # ownership is checked at the app layer by authz.IsOwner.
        CreateSwitchEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/users/{userId}/switches
            Method: post
        # Default OidcAuthorizer applies - same rationale as
        # CreateSwitchEvent.
        UpdateSwitchEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/users/{userId}/switches/{switchId}
            Method: put
        # Default OidcAuthorizer applies - same rationale as
        # CreateSwitchEvent.
        DeleteSwitchEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/users/{userId}/switches/{switchId}
            Method: delete
        # Default OidcAuthorizer applies - same rationale as
        # CreateSwitchEvent.
        SetSwitchImageEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/users/{userId}/switches/{switchId}/image
            Method: post
        # Default OidcAuthorizer applies - same rationale as
        # CreateSwitchEvent.
        DeleteSwitchImageEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/users/{userId}/switches/{switchId}/image
            Method: delete
        # Auth: NONE at the gateway (security: [{}, BearerAuth] in
        # api/openapi.yaml - anonymous callers are allowed); the app enforces
        # per-item visibility itself via middleware.OptionalAuth and
        # internal/authz.ReadableVisibilities.
        ListKeyboardsEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/users/{userId}/keyboards
            Method: get
            Auth:
              Authorizer: NONE
        # Auth: NONE at the gateway - same rationale as ListKeyboardsEvent.
        GetKeyboardEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/users/{userId}/keyboards/{keyboardId}
            Method: get
            Auth:
              Authorizer: NONE
        # Default OidcAuthorizer applies (security: [BearerAuth] in
        # api/openapi.yaml, no anonymous override, unlike the GET routes) -
        # ownership is checked at the app layer by authz.IsOwner.
        CreateKeyboardEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/users/{userId}/keyboards
            Method: post
        # Default OidcAuthorizer applies - same rationale as
        # CreateKeyboardEvent.
        UpdateKeyboardEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/users/{userId}/keyboards/{keyboardId}
            Method: put
        # Default OidcAuthorizer applies - same rationale as
        # CreateKeyboardEvent.
        DeleteKeyboardEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/users/{userId}/keyboards/{keyboardId}
            Method: delete
        # Default OidcAuthorizer applies - same rationale as
        # CreateKeyboardEvent.
        AddKeyboardImageEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/users/{userId}/keyboards/{keyboardId}/images
            Method: post
        # Default OidcAuthorizer applies - same rationale as
        # CreateKeyboardEvent.
        DeleteKeyboardImageEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/users/{userId}/keyboards/{keyboardId}/images/{imageId}
            Method: delete
        # Default OidcAuthorizer applies - same rationale as
        # CreateKeyboardEvent.
        CreateKeyboardPlateEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/users/{userId}/keyboards/{keyboardId}/plates
            Method: post
        # Default OidcAuthorizer applies - same rationale as
        # CreateKeyboardEvent.
        UpdateKeyboardPlateEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/users/{userId}/keyboards/{keyboardId}/plates/{plateId}
            Method: put
        # Default OidcAuthorizer applies - same rationale as
        # CreateKeyboardEvent.
        DeleteKeyboardPlateEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/users/{userId}/keyboards/{keyboardId}/plates/{plateId}
            Method: delete
        # Default OidcAuthorizer applies - same rationale as
        # CreateKeyboardEvent.
        CreateKeyboardPCBEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/users/{userId}/keyboards/{keyboardId}/pcbs
            Method: post
        # Default OidcAuthorizer applies - same rationale as
        # CreateKeyboardEvent.
        UpdateKeyboardPCBEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/users/{userId}/keyboards/{keyboardId}/pcbs/{pcbId}
            Method: put
        # Default OidcAuthorizer applies - same rationale as
        # CreateKeyboardEvent.
        DeleteKeyboardPCBEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/users/{userId}/keyboards/{keyboardId}/pcbs/{pcbId}
            Method: delete
        # Auth: NONE at the gateway - same rationale as ListKeyboardsEvent.
        ListKeycapSetsEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/users/{userId}/keycap-sets
            Method: get
            Auth:
              Authorizer: NONE
        # Auth: NONE at the gateway - same rationale as ListKeyboardsEvent.
        GetKeycapSetEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/users/{userId}/keycap-sets/{keycapSetId}
            Method: get
            Auth:
              Authorizer: NONE
        # Default OidcAuthorizer applies - same rationale as
        # CreateKeyboardEvent.
        CreateKeycapSetEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/users/{userId}/keycap-sets
            Method: post
        # Default OidcAuthorizer applies - same rationale as
        # CreateKeyboardEvent.
        UpdateKeycapSetEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/users/{userId}/keycap-sets/{keycapSetId}
            Method: put
        # Default OidcAuthorizer applies - same rationale as
        # CreateKeyboardEvent.
        DeleteKeycapSetEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/users/{userId}/keycap-sets/{keycapSetId}
            Method: delete
        # Default OidcAuthorizer applies - same rationale as
        # CreateKeyboardEvent.
        CreateKeycapKitEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/users/{userId}/keycap-sets/{keycapSetId}/kits
            Method: post
        # Default OidcAuthorizer applies - same rationale as
        # CreateKeyboardEvent.
        UpdateKeycapKitEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/users/{userId}/keycap-sets/{keycapSetId}/kits/{kitId}
            Method: put
        DeleteKeycapKitEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/users/{userId}/keycap-sets/{keycapSetId}/kits/{kitId}
            Method: delete
        SetKeycapKitImageEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/users/{userId}/keycap-sets/{keycapSetId}/kits/{kitId}/image
            Method: post
        DeleteKeycapKitImageEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/users/{userId}/keycap-sets/{keycapSetId}/kits/{kitId}/image
            Method: delete
        # Auth: NONE at the gateway - same rationale as ListKeyboardsEvent.
        ListBuildsEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/users/{userId}/builds
            Method: get
            Auth:
              Authorizer: NONE
        # Default OidcAuthorizer applies - same rationale as
        # CreateKeyboardEvent.
        CreateBuildEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/users/{userId}/builds
            Method: post
        # Auth: NONE at the gateway - same rationale as ListKeyboardsEvent.
        GetBuildEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/users/{userId}/builds/{buildId}
            Method: get
            Auth:
              Authorizer: NONE
        # Default OidcAuthorizer applies - same rationale as
        # CreateKeyboardEvent.
        UpdateBuildEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/users/{userId}/builds/{buildId}
            Method: put
        # Default OidcAuthorizer applies - same rationale as
        # CreateKeyboardEvent.
        DeleteBuildEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/users/{userId}/builds/{buildId}
            Method: delete
        # Default OidcAuthorizer applies - same rationale as
        # CreateKeyboardEvent.
        AddBuildImageEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/users/{userId}/builds/{buildId}/images
            Method: post
        # Default OidcAuthorizer applies - same rationale as
        # CreateKeyboardEvent.
        DeleteBuildImageEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/users/{userId}/builds/{buildId}/images/{imageId}
            Method: delete
        # No auth at the gateway: /mcp verifies tokens itself
        # (middleware.RequireAuth) so a 401 can carry the WWW-Authenticate
        # header the MCP spec requires - API Gateway's own rejection can't
        # include that header (see RequireAuth's doc comment).
        McpEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /mcp
            Method: any
            Auth:
              Authorizer: NONE
        # No auth: this metadata exists so an unauthenticated client can
        # discover where to authenticate - gating it behind auth is
        # self-defeating.
        McpMetadataEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /.well-known/oauth-protected-resource
            Method: get
            Auth:
              Authorizer: NONE
        # No auth: same rationale as McpMetadataEvent.
        McpMetadataMcpEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /.well-known/oauth-protected-resource/mcp
            Method: get
            Auth:
              Authorizer: NONE
        # No auth: same rationale as McpMetadataEvent. Method: any so a
        # non-GET request reaches the handler's own 405 instead of a 404.
        AuthorizeEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /authorize
            Method: any
            Auth:
              Authorizer: NONE
        # No auth: same rationale as McpMetadataEvent. Method: any so a
        # non-GET request reaches the handler's own 405 instead of a 404.
        LogoutEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /logout
            Method: any
            Auth:
              Authorizer: NONE
    Metadata:
      # DockerContext is the repo root, not functions/api/, so the build has
      # access to the whole Go module (internal/ packages, go.mod/go.sum) -
      # the Dockerfile itself still lives in functions/api/.
      Dockerfile: functions/api/Dockerfile
      DockerContext: .
      DockerTag: latest

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Auth:
        Authorizers:
          OidcAuthorizer:
            JwtConfiguration:
              issuer: !Ref OidcIssuerBaseUrl
              audience:
                - !Ref OidcAudience
            IdentitySource: $request.header.Authorization
        DefaultAuthorizer: OidcAuthorizer
      AccessLogSettings:
        DestinationArn: !GetAtt HttpApiAccessLogGroup.Arn
        Format: >-
          {"requestId":"$context.requestId","ip":"$context.identity.sourceIp","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","routeKey":"$context.routeKey","status":"$context.status","authorizerError":"$context.authorizer.error","integrationErrorMessage":"$context.integrationErrorMessage","responseLatency":"$context.responseLatency"}
      # API Gateway auto-generates OPTIONS routes for CORS preflight and
      # exempts them from DefaultAuthorizer above - without this, browser
      # preflight requests 404 (no OPTIONS route exists) before the
      # authorizer is ever reached, blocking every browser-based caller.
      CorsConfiguration:
        AllowOrigins: !Ref CorsAllowOrigins
        AllowHeaders:
          - authorization
          - content-type
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS

  # Raw CFN, not SAM's HttpApi.Properties.Domain shorthand - that shorthand
  # is expanded by the SAM transform itself (macro-time), which can't see
  # through an Fn::If the way plain CloudFormation resources can (confirmed
  # via a real "Custom Domains only works if both DomainName and
  # CertificateArn are provided" transform error when conditionally
  # omitting it). DNS validation and the api.<name> CNAME both live in
  # Cloudflare, not Route53, so nothing here talks to Route53.
  ApiCustomDomain:
    Type: AWS::ApiGatewayV2::DomainName
    Condition: HasCustomDomain
    Properties:
      DomainName: !Ref CustomDomainName
      DomainNameConfigurations:
        - CertificateArn: !Ref CustomDomainCertificateArn
          EndpointType: REGIONAL

  # No ApiMappingKey (empty path prefix) - internal/router's routes
  # (/v1/..., /mcp) should map straight through with no extra segment.
  ApiCustomDomainMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Condition: HasCustomDomain
    Properties:
      ApiId: !Ref HttpApi
      DomainName: !Ref ApiCustomDomain
      Stage: !Ref HttpApiApiGatewayDefaultStage

  CostBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: 10
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
          Subscribers:
            - SubscriptionType: EMAIL
              Address: aws-budget@rogueserenity.dev
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
          Subscribers:
            - SubscriptionType: EMAIL
              Address: aws-budget@rogueserenity.dev

Outputs:
  ApiUrl:
    Description: Base URL of the HTTP API
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
  ApiCustomDomainTarget:
    Description: >-
      Only present when CustomDomainName is set. Cloudflare CNAME target for
      the custom domain (api.<name>.mykeebs.dev, etc.) - point a DNS-only
      (not proxied) CNAME record at this value.
    Condition: HasCustomDomain
    Value: !GetAtt ApiCustomDomain.RegionalDomainName
  ImagesBucketName:
    Description: S3 bucket holding user-uploaded images (build photos, keycap kit renders)
    Value: !Ref ImagesBucket
  SwitchTableName:
    Description: DynamoDB table backing GET /users/{userId}/switches
    Value: !Ref SwitchTable
  KeyboardTableName:
    Description: DynamoDB table backing GET /users/{userId}/keyboards
    Value: !Ref KeyboardTable
  KeycapSetTableName:
    Description: DynamoDB table backing GET /users/{userId}/keycap-sets
    Value: !Ref KeycapSetTable
  BuildTableName:
    Description: DynamoDB table backing GET /users/{userId}/builds
    Value: !Ref BuildTable
  ProfileTableName:
    Description: DynamoDB table backing GET /v1/profile/{identifier} and /v1/profiles
    Value: !Ref ProfileTable
  ProfileUsernameTableName:
    Description: DynamoDB table enforcing Profile.username uniqueness
    Value: !Ref ProfileUsernameTable
  UploadCounterTableName:
    Description: DynamoDB table counting image upload URLs issued per UTC day
    Value: !Ref UploadCounterTable
