<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>mykeebs — {{template "title"}}</title>
<link rel="icon" type="image/svg+xml" href="{{.Favicon}}" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Inter:wght@400;500;600&display=swap');
  {{.Tokens}}
  body {
    font-family: var(--font-body);
    line-height: 1.6;
    max-width: 680px;
    margin: 4rem auto;
    padding: 0 1rem;
    background: var(--bg);
    color: var(--text);
  }
  .logo { margin-bottom: 2rem; }
  .logo svg { display: block; height: 40px; width: auto; }
  h1, h2 { font-family: var(--font-display); font-weight: 600; line-height: 1.3; }
  h1 { font-size: 1.75rem; margin-bottom: 0.25rem; }
  h2 { font-size: 1.125rem; margin-top: 2rem; }
  .updated { color: var(--text-muted); margin-top: 0; }
  a { color: var(--accent); text-underline-offset: 2px; }
  a:hover { color: var(--accent-strong); }
  footer { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid var(--border); font-size: 0.875rem; color: var(--text-muted); }
  footer a { color: var(--text-muted); }
</style>
</head>
<body>
  <header class="logo">{{.Logo}}</header>
  <main>
    <h1>{{template "title"}}</h1>
    {{template "content"}}
  </main>
  <footer><a href="/privacy">Privacy Policy</a> · <a href="/terms">Terms of Service</a></footer>
</body>
</html>
