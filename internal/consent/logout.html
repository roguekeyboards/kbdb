<!DOCTYPE html>
<!--
  IdP-specific, like authorize.html: embeds the deployment's IdP browser SDK
  (currently Stytch's @stytch/vanilla-js) to revoke the session on this origin.
-->
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>mykeebs — Sign out</title>
<link rel="icon" type="image/svg+xml" href="{{.Brand.Favicon}}" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
  {{.Brand.Tokens}}
  body {
    font-family: var(--font-body);
    max-width: 480px;
    margin: 4rem auto;
    padding: 0 1rem;
    background: var(--bg);
    color: var(--text);
  }
  .logo { margin-bottom: 2rem; }
  .logo svg { display: block; height: 40px; width: auto; }
</style>
</head>
<body>
  <header class="logo">{{.Brand.Logo}}</header>
  <p id="status">Signing out…</p>

  <script type="module">
    import { StytchClient } from 'https://esm.sh/@stytch/vanilla-js@6.2.0';

    const PUBLIC_TOKEN = {{.IDPConsentPublicToken}};
    const RETURN_TO = {{.ReturnTo}};

    const idpClient = new StytchClient(PUBLIC_TOKEN, {
      customBaseUrl: {{.OIDCIssuerBaseURL}},
    });

    idpClient.session.revoke().catch(() => {}).finally(() => {
      window.location.assign(RETURN_TO);
    });
  </script>
</body>
</html>
