<!DOCTYPE html>
<!--
  This page and logout.html are the only IdP-specific code in kbdb: they
  embed the deployment's IdP browser SDK (currently Stytch's @stytch/vanilla-js)
  by its own symbol and custom-element names. Swapping IdPs means rewriting
  these two files; nothing else in the codebase references the IdP by name.
-->
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>mykeebs — Sign in</title>
<link rel="icon" type="image/svg+xml" href="{{.Brand.Favicon}}" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');
  {{.Brand.Tokens}}
  stytch-login, stytch-identity-provider { display: block; min-height: 400px; min-width: 300px; }
  body {
    font-family: var(--font-body);
    max-width: 480px;
    margin: 4rem auto;
    padding: 0 1rem;
    background: var(--bg);
    color: var(--text);
  }
  .logo { margin-bottom: 2rem; }
  .logo svg { display: block; height: 40px; width: auto; }
  /* Reads as a link, acts as a button. Kept below the consent card's visual
     weight (muted-foreground) so it's findable when wanted, ignorable when not. */
  #switch-account {
    display: block;
    margin: -0.5rem 0 1.5rem;
    padding: 0;
    border: 0;
    background: none;
    font: inherit;
    font-size: 0.875rem;
    color: var(--text-muted);
    text-decoration: underline;
    text-underline-offset: 2px;
    cursor: pointer;
  }
  #switch-account[hidden] { display: none; }
  #switch-account:hover { color: var(--text); }
  #switch-account:disabled { cursor: default; opacity: 0.6; }
  #switch-account:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #status .who { color: var(--accent); }
  .legal { margin-top: 2rem; font-size: 0.875rem; color: var(--text-muted); }
  .legal a { color: var(--text-muted); text-underline-offset: 2px; }
  .legal a:hover { color: var(--text); }
</style>
</head>
<body>
  <header class="logo">{{.Brand.Logo}}</header>
  <h3 id="status">Loading…</h3>
  <button type="button" id="switch-account" hidden>Not you? Use a different account</button>
  <stytch-login id="login-el"></stytch-login>
  <stytch-identity-provider id="idp-el"></stytch-identity-provider>
  <footer class="legal"><a href="/privacy">Privacy Policy</a> · <a href="/terms">Terms of Service</a></footer>

  <script type="module">
    import { StytchClient, StytchIdentityProvider, StytchUI, Products, OAuthProviders } from 'https://esm.sh/@stytch/vanilla-js@6.2.0';

    const PUBLIC_TOKEN = {{.IDPConsentPublicToken}};
    // customBaseUrl keeps the OIDC "iss" matching the discovery domain.
    const idpClient = new StytchClient(PUBLIC_TOKEN, {
      customBaseUrl: {{.OIDCIssuerBaseURL}},
    });

    customElements.define('stytch-login', StytchUI);
    customElements.define('stytch-identity-provider', StytchIdentityProvider);

    // Stytch takes literal values, so read the brand tokens back from the page's CSS.
    const rootStyle = getComputedStyle(document.documentElement);
    const token = (name) => rootStyle.getPropertyValue('--' + name).trim();
    const presentation = {
      theme: {
        'font-family': token('font-body'),
        'font-family-mono': token('font-display'),
        'rounded-base': '6px',
        'color-scheme': 'dark',
        background: token('bg'),
        foreground: token('text'),
        primary: token('accent'),
        'primary-foreground': token('accent-ink'),
        secondary: token('surface'),
        'secondary-foreground': token('text'),
        muted: token('bg-raised'),
        'muted-foreground': token('text-muted'),
        accent: token('accent'),
        'accent-foreground': token('accent-ink'),
        border: token('border'),
        input: token('border'),
        ring: token('accent'),
        destructive: token('danger'),
        'destructive-foreground': token('bg'),
        warning: token('warning'),
        success: token('success'),
      },
      options: {},
    };

    // identityLabel picks the most human-recognizable string the IdP session
    // carries. There's no kbdb username here (that lives behind the API, which
    // the caller hasn't been authorized for yet), and a Discord login carries
    // only a numeric provider_subject - so this falls back to naming the
    // provider, and to nothing if even that's absent.
    function identityLabel(user) {
      if (!user) return null;
      const name = [user.name?.first_name, user.name?.last_name].filter(Boolean).join(' ').trim();
      if (name) return name;
      const email = user.emails?.find((e) => e.email)?.email;
      if (email) return email;
      const provider = user.providers?.[0]?.provider_type;
      if (provider) return provider.charAt(0).toUpperCase() + provider.slice(1) + ' account';
      return null;
    }

    function showSignedIn() {
      const who = identityLabel(idpClient.user.getSync());
      const statusEl = document.getElementById('status');
      const switchEl = document.getElementById('switch-account');

      if (who) {
        statusEl.textContent = 'Signed in as ';
        const whoEl = document.createElement('span');
        whoEl.className = 'who';
        whoEl.textContent = who;
        statusEl.appendChild(whoEl);
        switchEl.textContent = 'Not you? Use a different account';
      } else {
        statusEl.textContent = 'Signed in';
        switchEl.textContent = 'Use a different account';
      }

      switchEl.hidden = false;
      switchEl.onclick = async () => {
        switchEl.disabled = true;
        switchEl.textContent = 'Signing out…';
        // revoke is best-effort - a reload clears the in-page session either way,
        // and on reload session.getSync() is null so the login widget shows.
        try { await idpClient.session.revoke(); } catch (e) { console.warn('session.revoke failed', e); }
        window.location.reload();
      };

      document.getElementById('login-el').style.display = 'none';
      const idp = document.getElementById('idp-el');
      idp.style.display = 'block';
      idp.render({ client: idpClient, presentation });
    }

    async function render() {
      try {
        // Discord's redirect back overwrites our OAuth query params with
        // the IdP's own (?token=...) - save/restore via localStorage.
        let params = new URLSearchParams(window.location.search);

        if (params.has('client_id')) {
          localStorage.setItem('kbdb_oauth_qs', window.location.search);
        } else if (params.has('token')) {
          await idpClient.authenticateByUrl({ session_duration_minutes: 60 });
          const savedQs = localStorage.getItem('kbdb_oauth_qs');
          if (savedQs) {
            window.history.replaceState({}, '', window.location.pathname + savedQs);
            params = new URLSearchParams(savedQs);
          }
        }

        // getSync() is a local cache read - re-verify against the server so
        // a session revoked from mykeebs-web's origin is actually caught.
        let loggedIn = false;
        if (idpClient.session.getSync() != null) {
          try {
            await idpClient.session.authenticate({ session_duration_minutes: 60 });
            loggedIn = true;
          } catch {
            loggedIn = false;
          }
        }

        if (loggedIn) {
          showSignedIn();
        } else {
          document.getElementById('status').textContent = 'Sign in to continue';
          document.getElementById('idp-el').style.display = 'none';
          const login = document.getElementById('login-el');
          login.style.display = 'block';
          const bareRedirectUrl = window.location.origin + window.location.pathname;
          login.render({
            client: idpClient,
            config: {
              products: [Products.oauth],
              oauthOptions: {
                providers: [{ type: OAuthProviders.Discord }],
                loginRedirectURL: bareRedirectUrl,
                signupRedirectURL: bareRedirectUrl,
              },
            },
            presentation,
            styles: {
              container: { width: '100%' },
            },
          });
        }
      } catch (e) {
        document.getElementById('status').textContent = 'Error: ' + e.message;
        console.error(e);
      }
    }

    window.addEventListener('DOMContentLoaded', render);
  </script>
</body>
</html>
