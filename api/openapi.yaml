      operationId: deleteKeycapKitImage
      description: >
        userId must be the caller's own subject; removing a kit's image on
        another user's keycap set always returns 404.
      responses:
        "204":
          description: Deleted.
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        default:
          $ref: "#/components/responses/ProblemResponse"

