          $ref: "#/components/responses/ProblemResponse"

  /v1/lookups/{category}:
    parameters:
      - name: category
        in: path
        required: true
        schema:
          type: string
        example: vendor
    get:
      tags: [lookups]
      summary: Get one lookup category's approved values
      operationId: getLookup
      security: []
      description: >
        Returns 404 if category isn't one of the names returned by GET
        /lookups.
      responses:
        "200":
          description: The requested lookup category.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lookup"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        default:
          $ref: "#/components/responses/ProblemResponse"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: An IdP-issued OIDC JWT (Authorization Bearer <token>).

  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
      description: >
        The IdP subject of the item's owner — the `sub` claim of an access
        token, and the `user_id` field of a profile. If this matches the
        authenticated caller's own subject, the request is against their own
        collection. If it names a different user, the request is against
        that user's collection: reads return only the items the caller can
        read under each item's visibility (and a 404, not a 403, for a
        specific item the caller can't read, so its existence isn't
        revealed); writes (create/update/delete) always fail with a 404 in
        this case, since a caller can never modify another user's items. Not a PII/security
        concern to expose in a URL — an IdP subject is an opaque identifier,
        not derived from email or any other identifying attribute.
    KeyboardId:
      name: keyboardId
      in: path
      required: true
      schema:
        type: string
      description: Server-generated identifier for the keyboard.
    SwitchId:
      name: switchId
      in: path
      required: true
      schema:
        type: string
      description: Server-generated identifier for the switch.
    KeycapSetId:
      name: keycapSetId
      in: path
      required: true
      schema:
        type: string
      description: Server-generated identifier for the keycap set.
    BuildId:
      name: buildId
      in: path
      required: true
      schema:
        type: string
      description: Server-generated identifier for the build.
    ProfileIdentifier:
      name: identifier
      in: path
      required: true
      schema:
        type: string
      description: >
        Either a profile owner's IdP subject or their username. Resolution
        tries the IdP subject first and falls back to a username lookup, so
        a username that happened to match a subject string would be shadowed
        (in practice the two value spaces do not overlap).
    BuildKeyboardIdFilter:
      name: keyboard_id
      in: query
      schema:
        type: string
      description: If set, only return builds whose keyboard field is this keyboard's id.
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Maximum number of items to return.
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
      description: Opaque pagination cursor from a previous response's next_cursor.

  responses:
    ProblemResponse:
      description: An error, formatted per RFC 9457 (Problem Details for HTTP APIs).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFoundResponse:
      description: The requested resource does not exist, or does not belong to the authenticated user.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UploadsUnavailableResponse:
      description: >
        Image uploads aren't available at the moment, so no upload URL was
        issued. Try again later.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ConflictResponse:
      description: >
        The resource was modified by a concurrent request while this one
        was in flight, and retries were exhausted. Safe to retry the request
        as-is.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Problem:
      type: object
      description: RFC 9457 Problem Details.
      properties:
        type:
          type: string
          format: uri
          example: https://mykeebs.info/errors/validation-error
        title:
          type: string
          example: Validation Error
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        invalid_params:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              reason:
                type: string
              allowed_values:
                type: array
                items:
                  type: string
        blocking_build_ids:
          type: array
          description: >
            Present on a 409 response caused by the item still being
            referenced by one or more builds. Lists the ids of the blocking
            builds.
          items:
            type: string
      required: [type, title, status]

    CascadeDeleteResult:
      type: object
      description: >
        Returned by a delete call made with on_delete=cascade, listing the
        ids of every build that was deleted alongside the requested item.
      properties:
        deleted_build_ids:
          type: array
          items:
            type: string
      required: [deleted_build_ids]

    Money:
      type: number
      format: double
      description: A non-negative amount. Its currency is given by the sibling currency field.
      minimum: 0
      maximum: 100000000000000
      example: 123.45

    Currency:
      type: string
      example: USD
      description: >
        An ISO 4217 currency code, from the item owner's
        preferences.currency. Display-only: kbdb stores no currency with a
        price and does no conversion.

    Visibility:
      type: string
      enum: [public, authenticated, private]
      description: >
        Who can read this item via its GET routes (create/update/delete
        always require the caller to be the item's owner, regardless of
        visibility). "public": readable with no authentication at all.
        "authenticated": readable by any signed-in user, but not
        anonymous callers. "private": readable only by the owner. There
        is no per-user allowlist/sharing mechanism beyond these three
        tiers — visibility is not scoped to specific other users.

    PurchaseInput:
      type: object
      description: >
        Full purchase-lifecycle tracking, used by keyboards and keycap set
        kits (which get separate order/delivery dates and status).
      additionalProperties: false
      properties:
        vendor:
          type: string
          description: Open vocabulary — validated against the "vendor" lookup at request time.
        price:
          $ref: "#/components/schemas/Money"
        order_date:
          type: string
          format: date
        delivery_date:
          type: string
          format: date
        order_status:
          type: string
          description: Open vocabulary — validated against the "order_status" lookup at request time.

    Purchase:
      type: object
      description: >
        The read form of PurchaseInput.
      properties:
        vendor:
          type: string
        price:
          $ref: "#/components/schemas/Money"
        currency:
          $ref: "#/components/schemas/Currency"
          description: >
            The owner's display currency, for labelling price.
            Present exactly when price is.
        order_date:
          type: string
          format: date
        delivery_date:
          type: string
          format: date
        order_status:
          type: string

    MaterialColor:
      type: object
      description: A physical part described by material and color.
      additionalProperties: false
      properties:
        material:
          type: string
          description: Open vocabulary — validated against the relevant *_material lookup at request time.
        color:
          type: string
          description: Free text.

    KeyboardDesign:
      type: object
      additionalProperties: false
      properties:
        top_case:
          $ref: "#/components/schemas/MaterialColor"
        bottom_case:
          $ref: "#/components/schemas/MaterialColor"
        weight:
          $ref: "#/components/schemas/MaterialColor"

    KeyboardPlateInput:
      type: object
      required: [material]
      additionalProperties: false
      properties:
        material:
          type: string
          description: Open vocabulary — validated against the "keyboard_plate_material" lookup at request time.
        color:
          type: string
          description: Free text.
        thickness:
          type: number
          format: double
          description: Thickness in mm.
          example: 1.5
        purchase:
          $ref: "#/components/schemas/PurchaseInput"
          description: >
            Omit for a plate that came with the keyboard at no extra cost.
            Its price counts toward the keyboard's total_cost, and toward
            a build's total_cost when the build uses this plate.

    KeyboardPlate:
      type: object
      required: [id, material]
      properties:
        id:
          type: string
          description: Server-generated when the plate is added, unique within the keyboard. Builds reference the plate by it.
        material:
          type: string
        color:
          type: string
        thickness:
          type: number
          format: double
          description: Thickness in mm.
        purchase:
          $ref: "#/components/schemas/Purchase"

    KeyboardPCBInput:
      type: object
      additionalProperties: false
      properties:
        thickness:
          type: number
          format: double
          description: Thickness in mm.
          example: 1.6
        firmware:
          type: string
          description: Open vocabulary — validated against the "keyboard_pcb_firmware" lookup at request time.
        assembly:
          type: string
          description: Open vocabulary — validated against the "keyboard_pcb_assembly_type" lookup at request time.
        connectivity:
          type: string
          description: Open vocabulary — validated against the "keyboard_pcb_connectivity_type" lookup at request time.
        purchase:
          $ref: "#/components/schemas/PurchaseInput"
          description: >
            Omit for a PCB that came with the keyboard at no extra cost.
            Its price counts toward the keyboard's total_cost, and toward
            a build's total_cost when the build uses this PCB.

    KeyboardPCB:
      type: object
      required: [id]
      properties:
        id:
          type: string
          description: Server-generated when the PCB is added, unique within the keyboard. Builds reference the PCB by it.
        thickness:
          type: number
          format: double
          description: Thickness in mm.
        firmware:
          type: string
        assembly:
          type: string
        connectivity:
          type: string
        purchase:
          $ref: "#/components/schemas/Purchase"

    KeyboardInput:
      type: object
      required: [brand, name, visibility]
      additionalProperties: false
      properties:
        brand:
          type: string
          minLength: 1
          pattern: "\\S"
        name:
          type: string
          minLength: 1
          pattern: "\\S"
        size:
          type: string
          description: Open vocabulary — validated against the "keyboard_size" lookup at request time.
        layout:
          type: string
          description: >
            Open vocabulary — validated against the "keyboard_layout" lookup at
            request time, including that the chosen layout is valid for
            the keyboard's size.
        design:
          $ref: "#/components/schemas/KeyboardDesign"
        purchase:
          $ref: "#/components/schemas/PurchaseInput"
          description: >
            The keyboard's own purchase. Its price is the base price,
            excluding any plate or PCB that carries its own purchase.
        notes:
          type: string
        visibility:
          $ref: "#/components/schemas/Visibility"

    ImageUploadRequest:
      type: object
      description: >
        Request body for every image-upload endpoint (keyboard, switch,
        profile avatar, keycap kit, build). The upload is two-step: this
        call allocates a slot and returns a presigned S3 PUT URL, then the
        client PUTs the bytes to that URL with a matching Content-Type and
        exactly size_bytes of body. Images must be WebP, at most 2560px on
        their longest side and at most 1.5 MB; convert and resize anything
        else before uploading. An upload that isn't really a WebP, or is
        over 2560px, is rejected in moderation.
      required: [content_type, size_bytes]
      additionalProperties: false
      properties:
        content_type:
          type: string
          example: image/webp
          description: Open vocabulary — validated against the "image_content_type" lookup at request time.
        size_bytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 1572864
          example: 524288
          description: >
            The exact size of the image in bytes. Images are capped at
            1.5 MB (1,572,864 bytes). The presigned URL is signed for this
            size, so S3 rejects a PUT whose body is any other length.

    ImageStatus:
      type: string
      enum: [pending, approved, rejected]
      description: >
        Where an image stands in moderation, shown only to its owner. A new
        upload is pending until it's checked, then approved or rejected.
        A pending image can still be downloaded by its owner; a rejected
        one has no URL and still counts toward the item's image limit
        until it's deleted.

    KeyboardImage:
      type: object
      description: >
        Its owner sees every image with its status; anyone else sees only
        approved images.
      required: [image_id]
      properties:
        image_id:
          type: string
          description: Server-generated identifier for this image, unique within the keyboard.
        url:
          type: string
          format: uri
          description: >
            A signed URL for the image, valid for 12 to 24 hours and
            unchanged for up to 12. Don't persist it; fetch the item again
            for a new one once it expires. Absent when the image was
            rejected.
        status:
          $ref: "#/components/schemas/ImageStatus"
        rejection_reason:
          type: string
          description: >
            Only on a rejected image, and only for its owner: the moderation
            label that rejected it; `not_webp` when the file isn't a WebP;
            `too_large` when its longest side is over 2560px; or
            `unprocessable` when the file couldn't be checked at all.

    KeyboardImageUpload:
      type: object
      required: [image_id, upload_url]
      properties:
        image_id:
          type: string
          description: Server-generated identifier for the newly-created image.
        upload_url:
          type: string
          format: uri
          description: >
            Presigned S3 PUT URL. Short-lived — upload promptly.

    Keyboard:
      type: object
      required: [id, brand, name]
      properties:
        id:
          type: string
        brand:
          type: string
        name:
          type: string
        size:
          type: string
        layout:
          type: string
        design:
          $ref: "#/components/schemas/KeyboardDesign"
        plates:
          type: array
          items:
            $ref: "#/components/schemas/KeyboardPlate"
          description: >
            In the order they were added. Managed via the dedicated plate
            endpoints, not via PUT on the keyboard itself — see
            POST/PUT/DELETE .../keyboards/{keyboardId}/plates[/{plateId}].
        pcbs:
          type: array
          items:
            $ref: "#/components/schemas/KeyboardPCB"
          description: >
            In the order they were added. Managed via the dedicated PCB
            endpoints, not via PUT on the keyboard itself — see
            POST/PUT/DELETE .../keyboards/{keyboardId}/pcbs[/{pcbId}].
        purchase:
          $ref: "#/components/schemas/Purchase"
          description: >
            The keyboard's own purchase. Its price is the base price,
            excluding any plate or PCB that carries its own purchase.
        notes:
          type: string
        visibility:
          $ref: "#/components/schemas/Visibility"
          description: >
            Who can read this keyboard. Only ever present for the
            keyboard's owner - no preference can expose it to another
            caller.
        images:
          type: array
          items:
            $ref: "#/components/schemas/KeyboardImage"
          description: >
            Managed via the dedicated image endpoints below, not via
            PUT on the keyboard itself — see POST/DELETE
            .../keyboards/{keyboardId}/images[/{imageId}].
        total_cost:
          $ref: "#/components/schemas/Money"
          description: >
            The base price plus the price of every plate and PCB. Parts
            with no known price are excluded rather than treated as zero,
            so this may undercount.
        currency:
          $ref: "#/components/schemas/Currency"
          description: >
            The owner's display currency, for labelling total_cost.
            Present exactly when total_cost is.

    KeyboardListPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Keyboard"
        next_cursor:
          type: string
          description: Pass as cursor to fetch the next page. Omitted on the last page.

    SwitchMaterial:
      type: object
      additionalProperties: false
      properties:
        top_housing:
          type: string
          description: Open vocabulary — validated against the "switch_material" lookup at request time.
        bottom_housing:
          type: string
          description: Open vocabulary — validated against the "switch_material" lookup at request time.
        stem:
          type: string
          description: Open vocabulary — validated against the "switch_material" lookup at request time.

    SwitchForce:
      type: object
      additionalProperties: false
      properties:
        actuation:
          type: number
          format: double
          description: Actuation force in grams (nominal value).
        bottom_out:
          type: number
          format: double
          description: Bottom-out force in grams (nominal value).

    SwitchSpring:
      type: object
      additionalProperties: false
      properties:
        material:
          type: string
          description: Open vocabulary — validated against the "switch_spring_material" lookup at request time.
        pre_travel:
          type: number
          format: double
          description: Pre-travel distance in mm.
        total_travel:
          type: number
          format: double
          description: Total travel distance in mm.

    SwitchPurchaseInput:
      type: object
      description: >
        Same purchase-lifecycle tracking as PurchaseInput, plus a quantity
        field since switches are bought in bulk.
      additionalProperties: false
      properties:
        vendor:
          type: string
          description: Open vocabulary — validated against the "vendor" lookup at request time.
        price:
          $ref: "#/components/schemas/Money"
          description: >
            The total paid for quantity switches, not the per-switch price.
        order_date:
          type: string
          format: date
        delivery_date:
          type: string
          format: date
        order_status:
          type: string
          description: Open vocabulary — validated against the "order_status" lookup at request time.
        quantity:
          type: integer
          minimum: 1
          description: >
            How many switches price paid for. Needed for this switch's cost
            to count toward a build's total_cost.

    SwitchPurchase:
      type: object
      description: >
        The read form of SwitchPurchaseInput.
      properties:
        vendor:
          type: string
        price:
          $ref: "#/components/schemas/Money"
          description: >
            The total paid for quantity switches, not the per-switch price.
        currency:
          $ref: "#/components/schemas/Currency"
          description: >
            The owner's display currency, for labelling price.
            Present exactly when price is.
        order_date:
          type: string
          format: date
        delivery_date:
          type: string
          format: date
        order_status:
          type: string
        quantity:
          type: integer
          minimum: 1
          description: >
            How many switches price paid for. Needed for this switch's cost
            to count toward a build's total_cost.

    SwitchInput:
      type: object
      required: [brand, name, type, visibility]
      additionalProperties: false
      properties:
        brand:
          type: string
          minLength: 1
          pattern: "\\S"
        manufacturer:
          type: string
        name:
          type: string
          minLength: 1
          pattern: "\\S"
        type:
          type: string
          description: Open vocabulary — validated against the "switch_type" lookup at request time.
        pins:
          type: integer
          example: 5
          description: PCB mount pin count.
        factory_lubed:
          type: boolean
        material:
          $ref: "#/components/schemas/SwitchMaterial"
        force:
          $ref: "#/components/schemas/SwitchForce"
        spring:
          $ref: "#/components/schemas/SwitchSpring"
        purchase:
          $ref: "#/components/schemas/SwitchPurchaseInput"
        notes:
          type: string
        visibility:
          $ref: "#/components/schemas/Visibility"

    SwitchImage:
      type: object
      description: >
        A switch has at most one image (its vendor render/product shot) —
        see POST/DELETE .../switches/{switchId}/image. Its owner sees it
        whatever its status; anyone else sees it only once approved.
      properties:
        url:
          type: string
          format: uri
          description: >
            A signed URL for the image, valid for 12 to 24 hours and
            unchanged for up to 12. Don't persist it; fetch the item again
            for a new one once it expires. Absent when the image was
            rejected.
        status:
          $ref: "#/components/schemas/ImageStatus"
        rejection_reason:
          type: string
          description: >
            Only on a rejected image, and only for its owner: the moderation
            label that rejected it; `not_webp` when the file isn't a WebP;
            `too_large` when its longest side is over 2560px; or
            `unprocessable` when the file couldn't be checked at all.

    SwitchImageUpload:
      type: object
      required: [upload_url]
      properties:
        upload_url:
          type: string
          format: uri
          description: >
            Presigned S3 PUT URL. Short-lived — upload promptly.

    Switch:
      type: object
      required: [id, brand, name, type]
      properties:
        id:
          type: string
        brand:
          type: string
        manufacturer:
          type: string
        name:
          type: string
        type:
          type: string
        pins:
          type: integer
          example: 5
          description: PCB mount pin count.
        factory_lubed:
          type: boolean
        material:
          $ref: "#/components/schemas/SwitchMaterial"
        force:
          $ref: "#/components/schemas/SwitchForce"
        spring:
          $ref: "#/components/schemas/SwitchSpring"
        purchase:
          $ref: "#/components/schemas/SwitchPurchase"
        notes:
          type: string
        visibility:
          $ref: "#/components/schemas/Visibility"
          description: >
            Who can read this switch. Only ever present for the
            switch's owner - no preference can expose it to another
            caller.
        image:
          $ref: "#/components/schemas/SwitchImage"
          description: >
            Managed via the dedicated image endpoint, not via PUT on
            the switch itself — see POST/DELETE
            .../switches/{switchId}/image.

    SwitchListPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Switch"
        next_cursor:
          type: string
          description: Pass as cursor to fetch the next page. Omitted on the last page.

    ProfileLink:
      type: object
      required: [name, url]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          pattern: "\\S"
          maxLength: 32
          description: Display label for the link, e.g. "Twitch" or "My Discord".
        url:
          type: string
          description: >
            An https URL. http, scheme-relative, and non-http(s) schemes
            are rejected. Enforced by the handler (not a schema pattern) so
            the rejection names the exact links[i].url that failed.

    ProfileImage:
      type: object
      description: >
        The profile's avatar, managed via POST/DELETE
        .../profile/{identifier}/image, not via a body PUT. Its owner sees
        it whatever its status; anyone else sees it only once approved.
      properties:
        url:
          type: string
          format: uri
          description: >
            A signed URL for the avatar, valid for 12 to 24 hours and
            unchanged for up to 12. Don't persist it; fetch the item again
            for a new one once it expires. Absent when the avatar was
            rejected.
        status:
          $ref: "#/components/schemas/ImageStatus"
        rejection_reason:
          type: string
          description: >
            Only on a rejected image, and only for its owner: the moderation
            label that rejected it; `not_webp` when the file isn't a WebP;
            `too_large` when its longest side is over 2560px; or
            `unprocessable` when the file couldn't be checked at all.

    ProfileImageUpload:
      type: object
      required: [upload_url]
      properties:
        upload_url:
          type: string
          format: uri
          description: >
            Presigned S3 PUT URL for the avatar. Short-lived — upload
            promptly.

    ProfilePreferences:
      type: object
      required: [currency, show_price_to_me, show_price_to_others]
      additionalProperties: false
      properties:
        currency:
          type: string
          default: USD
          description: >
            An ISO 4217 currency code (case-insensitive on write, always
            returned uppercase). Display-only: a hint for which currency a
            client should label or convert prices in. kbdb does not store
            a currency alongside any item's price and performs no
            conversion itself.
        show_price_to_me:
          type: boolean
          default: true
          description: >
            Whether the owner is shown price fields on their own items in
            list responses (GET /v1/users/{userId}/{collection} and the
            equivalent MCP list tools). Does not affect single-item GET —
            an owner always sees their own item's price there, since
            editing requires knowing the current value.
        show_price_to_others:
          type: boolean
          default: false
          description: >
            Whether other callers (subject to the item's own visibility
            rules) are shown this owner's item prices, on both single-item
            GET and list responses.

    ProfileInput:
      type: object
      required: [username]
      additionalProperties: false
      properties:
        preferences:
          $ref: "#/components/schemas/ProfilePreferences"
          description: >
            Omitted (not partially specified - a write is a full replace,
            same as every other field here) means every preference reverts
            to its default.
        username:
          type: string
          pattern: "^[a-z0-9][a-z0-9_.-]{1,30}[a-z0-9]$"
          description: >
            Lowercase letters, digits, hyphen, period, underscore; 3–32
            characters; no leading/trailing period, hyphen, or underscore;
            no consecutive periods. A Discord-compatible superset, so any
            Discord @handle (3+ chars) is a valid username. Unique across
            all profiles, case-sensitively (the charset has no uppercase).
            Used as /u/{username} in the frontend and as an identifier on
            GET /v1/profile/{identifier}.
        discoverable:
          type: boolean
          default: false
          description: >
            Whether this profile appears in GET /v1/profiles and is
            resolvable by anyone at GET /v1/profile/{identifier}. When
            false, only the owner can read it. Omitted on a PUT means
            false (full-replace semantics).
        discord_username:
          type: string
          maxLength: 32
          description: >
            Not verified against Discord's directory, but must match the
            shape of a Discord @handle: 2-32 chars, lowercase letters,
            digits, period, or underscore, no leading/trailing period or
            underscore, no consecutive periods.
        bio:
          type: string
          maxLength: 500
        links:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/ProfileLink"

    Profile:
      type: object
      required: [user_id, username, discoverable]
      properties:
        user_id:
          type: string
          description: >
            The profile owner's IdP subject. Use it as the {userId} path
            segment on the collection routes (GET /v1/users/{userId}/keyboards,
            /v1/users/{userId}/builds, etc.). Resolve a profile by username here
            first, then read that user's collections by this id.
        username:
          type: string
          description: >
            Used as /u/{username} in the frontend and as an identifier on
            GET /v1/profile/{identifier}.
        discoverable:
          type: boolean
          description: >
            Whether this profile appears in GET /v1/profiles and is
            resolvable by anyone at GET /v1/profile/{identifier}. When
            false, only the owner can read it.
        discord_username:
          type: string
        bio:
          type: string
        links:
          type: array
          items:
            $ref: "#/components/schemas/ProfileLink"
        preferences:
          $ref: "#/components/schemas/ProfilePreferences"
          description: >
            Only ever present for the profile's owner.
        avatar:
          $ref: "#/components/schemas/ProfileImage"
          description: >
            Managed via the dedicated image endpoints, not via a body
            PUT — see POST/DELETE .../profile/{identifier}/image.

    ProfileListPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Profile"
        next_cursor:
          type: string
          description: Pass as cursor to fetch the next page. Omitted on the last page.

    KeycapKitInput:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          pattern: "\\S"
          description: e.g. "Base", "Extension", "Accents".
        purchase:
          $ref: "#/components/schemas/PurchaseInput"
        primary:
          type: boolean
          description: >
            Omit to leave the set's primary kit designation untouched.
            true makes this kit the set's primary kit, replacing whichever
            kit held that designation before. false clears the
            designation, but only if this kit is the current primary -
            otherwise it's a no-op. Deliberately has no default: a missing
            field must stay distinguishable from an explicit false.

    KeycapKitImage:
      type: object
      description: >
        A kit has at most one image (its vendor render/product shot) — see
        POST/DELETE .../kits/{kitId}/image. Its owner sees it whatever its
        status; anyone else sees it only once approved.
      properties:
        url:
          type: string
          format: uri
          description: >
            A signed URL for the image, valid for 12 to 24 hours and
            unchanged for up to 12. Don't persist it; fetch the item again
            for a new one once it expires. Absent when the image was
            rejected.
        status:
          $ref: "#/components/schemas/ImageStatus"
        rejection_reason:
          type: string
          description: >
            Only on a rejected image, and only for its owner: the moderation
            label that rejected it; `not_webp` when the file isn't a WebP;
            `too_large` when its longest side is over 2560px; or
            `unprocessable` when the file couldn't be checked at all.

    KeycapKitImageUpload:
      type: object
      required: [upload_url]
      properties:
        upload_url:
          type: string
          format: uri
          description: >
            Presigned S3 PUT URL. Short-lived — upload promptly.

    KeycapKit:
      type: object
      required: [kit_id, name]
      properties:
        kit_id:
          type: string
          description: Server-generated identifier for this kit, unique within the keycap set.
        name:
          type: string
        purchase:
          $ref: "#/components/schemas/Purchase"
        image:
          $ref: "#/components/schemas/KeycapKitImage"
          description: >
            Managed via the dedicated image endpoint, not via PUT on
            the kit itself — see POST/DELETE
            .../keycap-sets/{keycapSetId}/kits/{kitId}/image.

    KeycapSetInput:
      type: object
      required: [brand, name, visibility]
      additionalProperties: false
      properties:
        brand:
          type: string
          minLength: 1
          pattern: "\\S"
        name:
          type: string
          minLength: 1
          pattern: "\\S"
        profile:
          type: string
          description: Open vocabulary — validated against the "keycap_profile" lookup at request time.
        material:
          type: string
          description: Open vocabulary — validated against the "keycap_material" lookup at request time.
        notes:
          type: string
        visibility:
          $ref: "#/components/schemas/Visibility"

    KeycapSet:
      type: object
      required: [id, brand, name]
      properties:
        id:
          type: string
        brand:
          type: string
        name:
          type: string
        profile:
          type: string
        material:
          type: string
        notes:
          type: string
        visibility:
          $ref: "#/components/schemas/Visibility"
          description: >
            Who can read this keycap set. Only ever present for the
            set's owner - no preference can expose it to another
            caller.
        kits:
          type: array
          items:
            $ref: "#/components/schemas/KeycapKit"
          description: >
            In the order they were added. Managed via the dedicated kit
            endpoints below, not via PUT on the set itself — see
            POST/PUT/DELETE .../keycap-sets/{keycapSetId}/kits[/{kitId}].
        primary_kit_id:
          type: string
          description: >
            The kit_id, among this set's kits, whose image represents
            the set in a list view. Omitted if never set, or if the kit
            it named no longer exists — match against kits[].kit_id
            to find that kit's image.
        order_status:
          type: string
          description: >
            Derived, read-only summary of every kit's
            purchase.order_status: the least-progressed status among
            them wins (Planned < Ordered < Shipped < Delivered), so the
            set isn't shown as Delivered while a kit is still en
            route. A kit with status Cancelled is excluded from that
            comparison unless every kit is Cancelled, in which case
            this is Cancelled too. Omitted if no kit has an order_status
            set, or the set has no kits.
        total_cost:
          $ref: "#/components/schemas/Money"
          description: >
            Total cost of the set's kits with a known purchase price. Kits
            with no known price are excluded rather than treated as zero,
            so this may undercount.
        currency:
          $ref: "#/components/schemas/Currency"
          description: >
            The owner's display currency, for labelling total_cost.
            Present exactly when total_cost is.

    KeycapSetListPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/KeycapSet"
        next_cursor:
          type: string
          description: Pass as cursor to fetch the next page. Omitted on the last page.

    BuildSwitchEntry:
      type: object
      required: [switch, count]
      additionalProperties: false
      properties:
        switch:
          type: string
          minLength: 1
          pattern: "\\S"
          description: ID of a Switch resource.
        count:
          type: integer
          minimum: 1

    BuildKeycapKitEntry:
      type: object
      required: [keycap_set, kit]
      additionalProperties: false
      properties:
        keycap_set:
          type: string
          minLength: 1
          pattern: "\\S"
          description: ID of a KeycapSet resource.
        kit:
          type: string
          minLength: 1
          pattern: "\\S"
          description: kit_id of one of that keycap set's kits (see KeycapKit.kit_id).

    BuildKeyboardRef:
      type: object
      description: A build's denormalized Keyboard reference.
      required: [id, brand, name]
      properties:
        id:
          type: string
        brand:
          type: string
        name:
          type: string
        size:
          type: string
        layout:
          type: string
        image_url:
          type: string
          format: uri
          description: >
            A signed URL for the referenced keyboard's first image the
            caller may see (any but a rejected one for the owner, approved
            only for anyone else), if it has one. It's valid for 12 to 24
            hours and unchanged for up to 12. Don't persist it; fetch the
            item again for a new one once it expires.

    BuildPlateRef:
      type: object
      description: >
        A build's denormalized plate, one of its keyboard's plates. Omitted
        if the keyboard no longer has the plate.
      required: [id, material]
      properties:
        id:
          type: string
        material:
          type: string
        color:
          type: string
        thickness:
          type: number
          format: double
          description: Thickness in mm.

    BuildPCBRef:
      type: object
      description: >
        A build's denormalized PCB, one of its keyboard's pcbs. Omitted if
        the keyboard no longer has the PCB.
      required: [id]
      properties:
        id:
          type: string
        thickness:
          type: number
          format: double
          description: Thickness in mm.
        firmware:
          type: string
        assembly:
          type: string
        connectivity:
          type: string

    BuildSwitchRef:
      type: object
      description: A build's denormalized Switch reference.
      required: [id, brand, name, type]
      properties:
        id:
          type: string
        brand:
          type: string
        manufacturer:
          type: string
        name:
          type: string
        type:
          type: string
        image_url:
          type: string
          format: uri
          description: >
            A signed URL for the referenced switch's image, if it has one
            the caller may see (see BuildKeyboardRef.image_url). It's valid
            for 12 to 24 hours and unchanged for up to 12. Don't persist it;
            fetch the item again for a new one once it expires.

    BuildSwitchEntryResolved:
      type: object
      required: [switch, count]
      properties:
        switch:
          $ref: "#/components/schemas/BuildSwitchRef"
        count:
          type: integer
          minimum: 1

    BuildKeycapSetRef:
      type: object
      description: >
        A build's denormalized KeycapSet reference, holding the kits of
        that set the build uses.
      required: [id, brand, name, kits]
      properties:
        id:
          type: string
        brand:
          type: string
        name:
          type: string
        profile:
          type: string
        kits:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/BuildKeycapKitRef"

    BuildKeycapKitRef:
      type: object
      description: A build's denormalized KeycapKit reference.
      required: [kit_id, name]
      properties:
        kit_id:
          type: string
          description: kit_id of the referenced kit (see KeycapKit.kit_id).
        name:
          type: string
        image_url:
          type: string
          format: uri
          description: >
            A signed URL for the referenced kit's image, if it has one the
            caller may see (see BuildKeyboardRef.image_url). It's valid for
            12 to 24 hours and unchanged for up to 12. Don't persist it;
            fetch the item again for a new one once it expires.

    BuildStabsInput:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          description: Open vocabulary — validated against the "build_stabilizer" lookup at request time.
        mount_type:
          type: string
          description: Open vocabulary — validated against the "build_stabilizer_mount_type" lookup at request time.
        price:
          $ref: "#/components/schemas/Money"

    BuildStabs:
      type: object
      description: >
        The read form of BuildStabsInput.
      properties:
        name:
          type: string
        mount_type:
          type: string
        price:
          $ref: "#/components/schemas/Money"
        currency:
          $ref: "#/components/schemas/Currency"
          description: >
            The owner's display currency, for labelling price.
            Present exactly when price is.

    BuildCaseMountType:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          description: Open vocabulary — validated against the "build_case_mount_type" lookup at request time.
        durometer:
          type: string
          description: >
            Open vocabulary — validated against the "build_durometer" lookup
            at request time. Allowed only with a type whose
            build_case_mount_type lookup entry has supports_durometer set;
            otherwise the request fails with 400.

    BuildInput:
      type: object
      required: [keyboard, visibility]
      additionalProperties: false
      properties:
        keyboard:
          type: string
          minLength: 1
          pattern: "\\S"
          description: ID of a Keyboard resource.
        plate:
          type: string
          description: >
            The id of the keyboard's plate that's installed. Must be one of
            the keyboard's plates, or the request fails with 400.
        pcb:
          type: string
          description: >
            The id of the keyboard's PCB that's installed. Must be one of
            the keyboard's pcbs, or the request fails with 400.
        case_mount_type:
          $ref: "#/components/schemas/BuildCaseMountType"
        stabs:
          $ref: "#/components/schemas/BuildStabsInput"
        foam:
          type: boolean
        switches:
          type: array
          items:
            $ref: "#/components/schemas/BuildSwitchEntry"
        keycap_kits:
          type: array
          items:
            $ref: "#/components/schemas/BuildKeycapKitEntry"
        build_date:
          type: string
          format: date
        notes:
          type: string
        visibility:
          $ref: "#/components/schemas/Visibility"

    BuildImage:
      type: object
      description: >
        Its owner sees every image with its status; anyone else sees only
        approved images.
      required: [image_id]
      properties:
        image_id:
          type: string
          description: Server-generated identifier for this image, unique within the build.
        url:
          type: string
          format: uri
          description: >
            A signed URL for the image, valid for 12 to 24 hours and
            unchanged for up to 12. Don't persist it; fetch the item again
            for a new one once it expires. Absent when the image was
            rejected.
        status:
          $ref: "#/components/schemas/ImageStatus"
        rejection_reason:
          type: string
          description: >
            Only on a rejected image, and only for its owner: the moderation
            label that rejected it; `not_webp` when the file isn't a WebP;
            `too_large` when its longest side is over 2560px; or
            `unprocessable` when the file couldn't be checked at all.

    BuildImageUpload:
      type: object
      required: [image_id, upload_url]
      properties:
        image_id:
          type: string
          description: Server-generated identifier for the newly-created image.
        upload_url:
          type: string
          format: uri
          description: >
            Presigned S3 PUT URL. Short-lived — upload promptly.

    Build:
      type: object
      description: >
        The read representation of a build. Unlike BuildInput, keyboard
        and switches[].switch are denormalized into resolved reference
        objects rather than bare ids, and BuildInput's keycap_kits are
        grouped by set into keycap_sets, so a client can render a build
        without follow-up requests. The build's
        visibility governs everything shown in it: a caller who can read
        the build sees its referenced parts' details even if they couldn't
        read those parts directly.
      required: [id, keyboard]
      properties:
        id:
          type: string
        keyboard:
          $ref: "#/components/schemas/BuildKeyboardRef"
        plate:
          $ref: "#/components/schemas/BuildPlateRef"
        pcb:
          $ref: "#/components/schemas/BuildPCBRef"
        case_mount_type:
          $ref: "#/components/schemas/BuildCaseMountType"
        stabs:
          $ref: "#/components/schemas/BuildStabs"
        foam:
          type: boolean
        switches:
          type: array
          items:
            $ref: "#/components/schemas/BuildSwitchEntryResolved"
        keycap_sets:
          type: array
          items:
            $ref: "#/components/schemas/BuildKeycapSetRef"
          description: >
            The keycap sets whose kits the build uses, in the order each set
            first appears in the build's keycap_kits.
        build_date:
          type: string
          format: date
        notes:
          type: string
        visibility:
          $ref: "#/components/schemas/Visibility"
          description: >
            Who can read this build. Only ever present for the build's
            owner - no preference can expose it to another caller.
        images:
          type: array
          items:
            $ref: "#/components/schemas/BuildImage"
          description: >
            Managed via the dedicated image endpoints below, not via
            PUT on the build itself — see POST/DELETE
            .../builds/{buildId}/images[/{imageId}].
        total_cost:
          $ref: "#/components/schemas/Money"
          description: >
            Total cost of the build's priced components (the keyboard's
            base price, its plate and PCB, switches, keycap kits, stabs).
            Components with no known price are excluded rather than
            treated as zero, so this may undercount.
        currency:
          $ref: "#/components/schemas/Currency"
          description: >
            The owner's display currency, for labelling total_cost.
            Present exactly when total_cost is.

    BuildListPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Build"
        next_cursor:
          type: string
          description: Pass as cursor to fetch the next page. Omitted on the last page.

    Lookup:
      type: object
      description: >
        A lookup category's approved values. "values" is plain strings
        except for "keyboard_layout" and "build_case_mount_type", whose
        entries are objects - see the examples below.
      required: [category, values]
      properties:
        category:
          type: string
          example: vendor
        values:
          type: array
          items: {}
          examples:
            - ["Amazon", "CannonKeys"]
            - [{ name: "WK", sizes: ["60%", "65%"] }]
            - [{ name: "Gasket Mount", supports_durometer: true }]
