openapi: 3.1.0
info:
  title: kbdb API
  description: >
    API for tracking a personal mechanical keyboard collection: keyboards,
    switches, keycap sets, and the builds that combine them. Routes are
    nested under /v1/users/{userId}/... for both the caller's own
    collection and other users' items the caller can read under each
    item's visibility — see the userId path parameter's description for
    the exact rules.
  version: "1.0.0"
  contact:
    url: https://mykeebs.info
  license:
    name: MIT
    url: https://github.com/roguekeyboards/mykeebs-api/blob/main/LICENSE
servers:
  - url: https://api.mykeebs.info
security:
  - BearerAuth: []

tags:
  - name: keyboards
    description: Keyboards in a user's collection.
  - name: switches
    description: Switches in a user's collection.
  - name: keycap-sets
    description: Keycap sets (and their individual kits) in a user's collection.
  - name: builds
    description: Builds combining a keyboard, switches, and keycap kits, in a user's collection.
  - name: lookups
    description: Approved value lists for enum-like fields (vendors, materials, profiles, etc.) — non-sensitive global reference data, not owned by any user. Reads require no authentication at all; there are no write routes.
  - name: profiles
    description: A user's public identity — username, avatar, bio, Discord handle, links — and the discoverable directory of other users' profiles.

paths:
  /v1/users/{userId}/keyboards:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [keyboards]
      summary: List keyboards
      operationId: listKeyboards
      security:
        - {}
        - BearerAuth: []
      description: >
        Lists the keyboards in userId's collection that the caller can read: all of them for the owner, public and authenticated ones for any other signed-in caller, and only public ones for an anonymous caller (possibly empty).
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of keyboards.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyboardListPage"
        "400":
          $ref: "#/components/responses/ProblemResponse"
        default:
          $ref: "#/components/responses/ProblemResponse"
    post:
      tags: [keyboards]
      summary: Create a keyboard
      operationId: createKeyboard
      description: >
        userId must be the caller's own subject; creating in another user's collection always returns 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeyboardInput"
      responses:
        "201":
          description: The created keyboard.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Keyboard"
        "400":
          $ref: "#/components/responses/ProblemResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /v1/users/{userId}/keyboards/{keyboardId}:
    parameters:
      - $ref: "#/components/parameters/UserId"
      - $ref: "#/components/parameters/KeyboardId"
    get:
      tags: [keyboards]
      summary: Get a keyboard
      operationId: getKeyboard
      security:
        - {}
        - BearerAuth: []
      description: >
        Returns the keyboard if the caller can read it under its visibility. Returns 404 (not 403) if it doesn't exist or the caller can't read it, so an unreadable keyboard's existence isn't revealed.
      responses:
        "200":
          description: The requested keyboard.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Keyboard"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        default:
          $ref: "#/components/responses/ProblemResponse"
    put:
      tags: [keyboards]
      summary: Update a keyboard
      operationId: updateKeyboard
      description: >
        userId must be the caller's own subject; updating another user's keyboard always returns 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeyboardInput"
      responses:
        "200":
          description: The updated keyboard.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Keyboard"
        "400":
          $ref: "#/components/responses/ProblemResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        default:
          $ref: "#/components/responses/ProblemResponse"
    delete:
      tags: [keyboards]
      summary: Delete a keyboard
      operationId: deleteKeyboard
      description: >
        userId must be the caller's own subject; deleting another user's keyboard always returns 404.
        on_delete controls what happens if the keyboard is still referenced by a build: "block" (the
        default) fails with 409 and lists the blocking build ids; "cascade" deletes the keyboard and
        every build that references it, returning their ids.
      parameters:
        - name: on_delete
          in: query
          schema:
            type: string
            enum: [block, cascade]
            default: block
          description: How to handle a keyboard still referenced by one or more builds.
      responses:
        "200":
          description: Deleted via cascade; lists the builds that were also deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CascadeDeleteResult"
        "204":
          description: Deleted (no builds referenced it).
        "400":
          $ref: "#/components/responses/ProblemResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "409":
          description: Blocked by one or more referencing builds (on_delete=block, the default).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /v1/users/{userId}/keyboards/{keyboardId}/plates:
    parameters:
      - $ref: "#/components/parameters/UserId"
      - $ref: "#/components/parameters/KeyboardId"
    post:
      tags: [keyboards]
      summary: Add a plate to a keyboard
      operationId: createKeyboardPlate
      description: >
        userId must be the caller's own subject; adding a plate to another
        user's keyboard always returns 404. The plate goes after the
        keyboard's existing plates.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeyboardPlateInput"
      responses:
        "201":
          description: The created plate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyboardPlate"
        "400":
          $ref: "#/components/responses/ProblemResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /v1/users/{userId}/keyboards/{keyboardId}/plates/{plateId}:
    parameters:
      - $ref: "#/components/parameters/UserId"
      - $ref: "#/components/parameters/KeyboardId"
      - name: plateId
        in: path
        required: true
        schema:
          type: string
        description: The id returned when the plate was added.
    put:
      tags: [keyboards]
      summary: Update a plate
      operationId: updateKeyboardPlate
      description: >
        userId must be the caller's own subject; updating a plate on another
        user's keyboard always returns 404. The plate keeps its id and its
        place in the keyboard's plates.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeyboardPlateInput"
      responses:
        "200":
          description: The updated plate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyboardPlate"
        "400":
          $ref: "#/components/responses/ProblemResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        default:
          $ref: "#/components/responses/ProblemResponse"
    delete:
      tags: [keyboards]
      summary: Delete a plate
      operationId: deleteKeyboardPlate
      description: >
        userId must be the caller's own subject; deleting a plate from
        another user's keyboard, or from a keyboard that doesn't exist,
        both return 404. Idempotent — deleting a plateId not present on the
        keyboard is not an error. on_delete controls what happens if a
        build uses the plate: "block" (the default) fails with 409 and
        lists the blocking build ids; "cascade" deletes the plate and every
        build that uses it, returning their ids.
      parameters:
        - name: on_delete
          in: query
          schema:
            type: string
            enum: [block, cascade]
            default: block
          description: How to handle a plate one or more builds use.
      responses:
        "200":
          description: Deleted via cascade; lists the builds that were also deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CascadeDeleteResult"
        "204":
          description: Deleted (no builds used it).
        "400":
          $ref: "#/components/responses/ProblemResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "409":
          description: Blocked by one or more builds using it (on_delete=block, the default).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /v1/users/{userId}/keyboards/{keyboardId}/pcbs:
    parameters:
      - $ref: "#/components/parameters/UserId"
      - $ref: "#/components/parameters/KeyboardId"
    post:
      tags: [keyboards]
      summary: Add a PCB to a keyboard
      operationId: createKeyboardPCB
      description: >
        userId must be the caller's own subject; adding a PCB to another
        user's keyboard always returns 404. The PCB goes after the
        keyboard's existing pcbs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeyboardPCBInput"
      responses:
        "201":
          description: The created PCB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyboardPCB"
        "400":
          $ref: "#/components/responses/ProblemResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /v1/users/{userId}/keyboards/{keyboardId}/pcbs/{pcbId}:
    parameters:
      - $ref: "#/components/parameters/UserId"
      - $ref: "#/components/parameters/KeyboardId"
      - name: pcbId
        in: path
        required: true
        schema:
          type: string
        description: The id returned when the PCB was added.
    put:
      tags: [keyboards]
      summary: Update a PCB
      operationId: updateKeyboardPCB
      description: >
        userId must be the caller's own subject; updating a PCB on another
        user's keyboard always returns 404. The PCB keeps its id and its
        place in the keyboard's pcbs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeyboardPCBInput"
      responses:
        "200":
          description: The updated PCB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyboardPCB"
        "400":
          $ref: "#/components/responses/ProblemResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        default:
          $ref: "#/components/responses/ProblemResponse"
    delete:
      tags: [keyboards]
      summary: Delete a PCB
      operationId: deleteKeyboardPCB
      description: >
        userId must be the caller's own subject; deleting a PCB from
        another user's keyboard, or from a keyboard that doesn't exist,
        both return 404. Idempotent — deleting a pcbId not present on the
        keyboard is not an error. on_delete controls what happens if a
        build uses the PCB: "block" (the default) fails with 409 and
        lists the blocking build ids; "cascade" deletes the PCB and every
        build that uses it, returning their ids.
      parameters:
        - name: on_delete
          in: query
          schema:
            type: string
            enum: [block, cascade]
            default: block
          description: How to handle a PCB one or more builds use.
      responses:
        "200":
          description: Deleted via cascade; lists the builds that were also deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CascadeDeleteResult"
        "204":
          description: Deleted (no builds used it).
        "400":
          $ref: "#/components/responses/ProblemResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "409":
          description: Blocked by one or more builds using it (on_delete=block, the default).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /v1/users/{userId}/keyboards/{keyboardId}/images:
    parameters:
      - $ref: "#/components/parameters/UserId"
      - $ref: "#/components/parameters/KeyboardId"
    post:
      tags: [keyboards]
      summary: Add an image to a keyboard
      operationId: createKeyboardImage
      description: >
        userId must be the caller's own subject; adding an image to
        another user's keyboard always returns 404. Images are not
        settable via POST/PUT on the keyboard itself (see KeyboardInput)
        — this is the only way to attach one. Does not upload the image
        itself: the response is a presigned S3 PUT URL the client
        uploads the actual image bytes to directly. The presigned URL
        requires the exact content_type given here on the upload — this
        lets the API reject an unsupported content_type up front, before
        ever issuing a presigned URL, and lets S3 reject an upload that
        doesn't match what was requested. A keyboard holds at most 10
        images.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageUploadRequest"
      responses:
        "201":
          description: >
            An image slot has been allocated; upload the image bytes to
            upload_url (HTTP PUT, with a Content-Type header matching the
            content_type, an If-None-Match: * header, and a body of exactly
            size_bytes given in the request) to complete it. upload_url is
            for one upload: another PUT to it fails with 412 Precondition
            Failed while that image is stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyboardImageUpload"
        "400":
          $ref: "#/components/responses/ProblemResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "409":
          description: The keyboard already has 10 images, the maximum; delete one first.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/UploadsUnavailableResponse"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /v1/users/{userId}/keyboards/{keyboardId}/images/{imageId}:
    parameters:
      - $ref: "#/components/parameters/UserId"
      - $ref: "#/components/parameters/KeyboardId"
      - name: imageId
        in: path
        required: true
        schema:
          type: string
        description: The image_id returned when the image was added.
    delete:
      tags: [keyboards]
      summary: Remove an image from a keyboard
      operationId: deleteKeyboardImage
      description: >
        userId must be the caller's own subject; removing an image from
        another user's keyboard always returns 404.
      responses:
        "204":
          description: Deleted.
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /v1/users/{userId}/switches:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [switches]
      summary: List switches
      operationId: listSwitches
      security:
        - {}
        - BearerAuth: []
      description: >
        Lists the switches in userId's collection that the caller can read: all of them for the owner, public and authenticated ones for any other signed-in caller, and only public ones for an anonymous caller (possibly empty).
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of switches.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SwitchListPage"
        "400":
          $ref: "#/components/responses/ProblemResponse"
        default:
          $ref: "#/components/responses/ProblemResponse"
    post:
      tags: [switches]
      summary: Create a switch
      operationId: createSwitch
      description: >
        userId must be the caller's own subject; creating in another user's collection always returns 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SwitchInput"
      responses:
        "201":
          description: The created switch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Switch"
        "400":
          $ref: "#/components/responses/ProblemResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /v1/users/{userId}/switches/{switchId}:
    parameters:
      - $ref: "#/components/parameters/UserId"
      - $ref: "#/components/parameters/SwitchId"
    get:
      tags: [switches]
      summary: Get a switch
      operationId: getSwitch
      security:
        - {}
        - BearerAuth: []
      description: >
        Returns the switch if the caller can read it under its visibility. Returns 404 (not 403) if it doesn't exist or the caller can't read it, so an unreadable switch's existence isn't revealed.
      responses:
        "200":
          description: The requested switch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Switch"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        default:
          $ref: "#/components/responses/ProblemResponse"
    put:
      tags: [switches]
      summary: Update a switch
      operationId: updateSwitch
      description: >
        userId must be the caller's own subject; updating another user's switch always returns 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SwitchInput"
      responses:
        "200":
          description: The updated switch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Switch"
        "400":
          $ref: "#/components/responses/ProblemResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        default:
          $ref: "#/components/responses/ProblemResponse"
    delete:
      tags: [switches]
      summary: Delete a switch
      operationId: deleteSwitch
      description: >
        userId must be the caller's own subject; deleting another user's switch always returns 404.
        on_delete controls what happens if the switch is still referenced by a build: "block" (the
        default) fails with 409 and lists the blocking build ids; "cascade" deletes the switch and
        every build that references it, returning their ids.
      parameters:
        - name: on_delete
          in: query
          schema:
            type: string
            enum: [block, cascade]
            default: block
          description: How to handle a switch still referenced by one or more builds.
      responses:
        "200":
          description: Deleted via cascade; lists the builds that were also deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CascadeDeleteResult"
        "204":
          description: Deleted (no builds referenced it).
        "400":
          $ref: "#/components/responses/ProblemResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "409":
          description: Blocked by one or more referencing builds (on_delete=block, the default).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /v1/users/{userId}/switches/{switchId}/image:
    parameters:
      - $ref: "#/components/parameters/UserId"
      - $ref: "#/components/parameters/SwitchId"
    post:
      tags: [switches]
      summary: Set (or replace) a switch's image
      operationId: setSwitchImage
      description: >
        userId must be the caller's own subject; setting a switch's image on
        another user's switch always returns 404. A switch has at most one
        image — calling this again replaces it, no need to delete first.
        Does not upload the image itself: the response is a presigned S3
        PUT URL the client uploads the actual image bytes to directly. The
        presigned URL requires the exact content_type given here on the
        upload — this lets the API reject an unsupported content_type up
        front, before ever issuing a presigned URL, and lets S3 reject an
        upload that doesn't match what was requested.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageUploadRequest"
      responses:
        "201":
          description: >
            An image slot has been allocated; upload the image bytes to
            upload_url (HTTP PUT, with a Content-Type header matching the
            content_type, an If-None-Match: * header, and a body of exactly
            size_bytes given in the request) to complete it. upload_url is
            for one upload: another PUT to it fails with 412 Precondition
            Failed while that image is stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SwitchImageUpload"
        "400":
          $ref: "#/components/responses/ProblemResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "429":
          $ref: "#/components/responses/UploadsUnavailableResponse"
        default:
          $ref: "#/components/responses/ProblemResponse"
    delete:
      tags: [switches]
      summary: Remove a switch's image
      operationId: deleteSwitchImage
      description: >
        userId must be the caller's own subject; removing a switch's image
        on another user's switch always returns 404.
      responses:
        "204":
          description: Deleted.
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /v1/profile/{identifier}:
    parameters:
      - $ref: "#/components/parameters/ProfileIdentifier"
    post:
      tags: [profiles]
      summary: Create a profile
      operationId: createProfile
      description: >
        Creates the caller's profile. For this operation identifier must be
        the caller's own IdP subject (not a username) — creating a profile
        for anyone else always returns 404. A user has exactly one profile:
        a second create returns 409 (type .../errors/conflict). If the
        requested username is already claimed by a different user, the
        response is 409 with type .../errors/username-unavailable so the
        frontend can surface it against the username field.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "201":
          description: The created profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/ProblemResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "409":
          description: >
            Either the caller already has a profile (type
            https://mykeebs.info/errors/conflict) or the requested username
            is taken by another user (type
            https://mykeebs.info/errors/username-unavailable). The two are
            distinguished by the Problem `type`, not the schema.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/ProblemResponse"
    get:
      tags: [profiles]
      summary: Get a profile
      operationId: getProfile
      security:
        - {}
        - BearerAuth: []
      description: >
        Returns the profile identified by identifier, which may be either
        the owner's IdP subject or their username. A non-discoverable
        profile is returned only to its owner (authenticated caller whose
        subject matches); to anyone else — and for an identifier that
        matches no profile at all — the response is 404, not 403, so a
        non-discoverable profile's existence isn't revealed.
      responses:
        "200":
          description: The requested profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        default:
          $ref: "#/components/responses/ProblemResponse"
    put:
      tags: [profiles]
      summary: Update a profile
      operationId: updateProfile
      description: >
        Replaces the caller's profile. identifier must be the caller's own
        IdP subject (not a username) — updating a profile for anyone else
        always returns 404, as does updating when the caller has no profile.
        This is a full replace: a body-settable field that is omitted is
        cleared (e.g. omitting bio or links empties them). The avatar is not
        a body-settable field and is left untouched — manage it via
        POST/DELETE .../profile/{identifier}/image. If the requested username is
        already claimed by a different user, the response is 409 with type
        .../errors/username-unavailable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "200":
          description: The updated profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/ProblemResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "409":
          description: >
            Either the requested username is already claimed by a different
            user (type https://mykeebs.info/errors/username-unavailable) or
            the profile was being modified concurrently and the write could
            not be applied (type https://mykeebs.info/errors/conflict) —
            retry. The two are distinguished by the Problem `type`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/ProblemResponse"
    delete:
      tags: [profiles]
      summary: Delete a profile and the whole account
      operationId: deleteProfile
      description: >
        Deletes the caller's whole account: the profile, its avatar and
        username, and every build, keyboard, switch and keycap set the
        caller owns, with all their images. This can't be undone.
        identifier must be the caller's own IdP subject (not a username) —
        deleting for anyone else always returns 404. Safe to retry: a call
        that fails partway leaves the rest for the next call, and when
        there's nothing left it still returns 204.
      responses:
        "204":
          description: Everything was deleted, or there was nothing to delete.
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "409":
          description: >
            The profile was being modified concurrently and the delete
            could not be applied (type https://mykeebs.info/errors/conflict).
            Retry.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /v1/profiles:
    get:
      tags: [profiles]
      summary: List discoverable profiles
      operationId: listProfiles
      security:
        - {}
        - BearerAuth: []
      description: >
        The public directory. Returns only profiles with discoverable set to
        true. Anonymous callers are allowed. Rows are ordered by username,
        except that a discord_username filter orders by the lowercased
        Discord handle.
        username and discord_username are optional begins-with prefix
        filters and are mutually exclusive — supplying both returns 400. A
        next_cursor is bound to the filter it was returned under; reusing
        it with a different filter returns 400.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: username
          in: query
          schema:
            type: string
          description: >
            Case-sensitive begins-with filter on username. Mutually
            exclusive with discord_username.
        - name: discord_username
          in: query
          schema:
            type: string
          description: >
            Case-insensitive begins-with filter on discord_username.
            Mutually exclusive with username.
      responses:
        "200":
          description: A page of discoverable profiles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileListPage"
        "400":
          $ref: "#/components/responses/ProblemResponse"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /v1/profile/{identifier}/image:
    parameters:
      - $ref: "#/components/parameters/ProfileIdentifier"
    post:
      tags: [profiles]
      summary: Set (or replace) the caller's avatar
      operationId: setProfileImage
      description: >
        identifier must be the caller's own IdP subject (not a username) —
        setting an avatar for anyone else, or when the caller has no
        profile, always returns 404. A profile has at most one avatar —
        calling this again replaces it, no need to delete first. Does not
        upload the image itself: the response is a presigned S3 PUT URL the
        client uploads the actual image bytes to directly. The presigned URL
        requires the exact content_type given here on the upload — this lets
        the API reject an unsupported content_type up front, before ever
        issuing a presigned URL, and lets S3 reject an upload that doesn't
        match what was requested.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageUploadRequest"
      responses:
        "201":
          description: >
            An avatar slot has been allocated; upload the image bytes to
            upload_url (HTTP PUT, with a Content-Type header matching the
            content_type, an If-None-Match: * header, and a body of exactly
            size_bytes given in the request) to complete it. upload_url is
            for one upload: another PUT to it fails with 412 Precondition
            Failed while that image is stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileImageUpload"
        "400":
          $ref: "#/components/responses/ProblemResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "429":
          $ref: "#/components/responses/UploadsUnavailableResponse"
        default:
          $ref: "#/components/responses/ProblemResponse"
    delete:
      tags: [profiles]
      summary: Remove the caller's avatar
      operationId: deleteProfileImage
      description: >
        identifier must be the caller's own IdP subject (not a username) —
        removing an avatar for anyone else, or when the caller has no
        profile, always returns 404. Idempotent: a profile with no avatar
        set still returns 204.
      responses:
        "204":
          description: Deleted, or the profile had no avatar.
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /v1/users/{userId}/keycap-sets:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [keycap-sets]
      summary: List keycap sets
      operationId: listKeycapSets
      security:
        - {}
        - BearerAuth: []
      description: >
        Lists the keycap sets in userId's collection that the caller can read: all of them for the owner, public and authenticated ones for any other signed-in caller, and only public ones for an anonymous caller (possibly empty).
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of keycap sets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeycapSetListPage"
        "400":
          $ref: "#/components/responses/ProblemResponse"
        default:
          $ref: "#/components/responses/ProblemResponse"
    post:
      tags: [keycap-sets]
      summary: Create a keycap set
      operationId: createKeycapSet
      description: >
        userId must be the caller's own subject; creating in another user's collection always returns 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeycapSetInput"
      responses:
        "201":
          description: The created keycap set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeycapSet"
        "400":
          $ref: "#/components/responses/ProblemResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /v1/users/{userId}/keycap-sets/{keycapSetId}:
    parameters:
      - $ref: "#/components/parameters/UserId"
      - $ref: "#/components/parameters/KeycapSetId"
    get:
      tags: [keycap-sets]
      summary: Get a keycap set
      operationId: getKeycapSet
      security:
        - {}
        - BearerAuth: []
      description: >
        Returns the keycap set if the caller can read it under its visibility. Returns 404 (not 403) if it doesn't exist or the caller can't read it, so an unreadable keycap set's existence isn't revealed.
      responses:
        "200":
          description: The requested keycap set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeycapSet"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        default:
          $ref: "#/components/responses/ProblemResponse"
    put:
      tags: [keycap-sets]
      summary: Update a keycap set
      operationId: updateKeycapSet
      description: >
        userId must be the caller's own subject; updating another user's keycap set always returns 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeycapSetInput"
      responses:
        "200":
          description: The updated keycap set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeycapSet"
        "400":
          $ref: "#/components/responses/ProblemResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        default:
          $ref: "#/components/responses/ProblemResponse"
    delete:
      tags: [keycap-sets]
      summary: Delete a keycap set
      operationId: deleteKeycapSet
      description: >
        userId must be the caller's own subject; deleting another user's
        keycap set always returns 404. on_delete controls what happens if
        any kit in the set is still referenced by a build: "block" (the
        default) fails with 409 and lists the blocking build ids;
        "cascade" deletes the set and every build that references any kit
        in it, returning their ids.
      parameters:
        - name: on_delete
          in: query
          schema:
            type: string
            enum: [block, cascade]
            default: block
          description: How to handle a set still referenced by one or more builds.
      responses:
        "200":
          description: Deleted via cascade; lists the builds that were also deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CascadeDeleteResult"
        "204":
          description: Deleted (no builds referenced it).
        "400":
          $ref: "#/components/responses/ProblemResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "409":
          description: >
            Blocked by one or more referencing builds (on_delete=block, the
            default — the Problem body has blocking_build_ids).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /v1/users/{userId}/keycap-sets/{keycapSetId}/kits:
    parameters:
      - $ref: "#/components/parameters/UserId"
      - $ref: "#/components/parameters/KeycapSetId"
    post:
      tags: [keycap-sets]
      summary: Add a kit to a keycap set
      operationId: createKeycapKit
      description: >
        userId must be the caller's own subject; adding a kit to another
        user's keycap set always returns 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeycapKitInput"
      responses:
        "201":
          description: The created kit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeycapKit"
        "400":
          $ref: "#/components/responses/ProblemResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /v1/users/{userId}/keycap-sets/{keycapSetId}/kits/{kitId}:
    parameters:
      - $ref: "#/components/parameters/UserId"
      - $ref: "#/components/parameters/KeycapSetId"
      - name: kitId
        in: path
        required: true
        schema:
          type: string
        description: The kit_id returned when the kit was created.
    put:
      tags: [keycap-sets]
      summary: Update a kit
      operationId: updateKeycapKit
      description: >
        userId must be the caller's own subject; updating a kit on another
        user's keycap set always returns 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeycapKitInput"
      responses:
        "200":
          description: The updated kit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeycapKit"
        "400":
          $ref: "#/components/responses/ProblemResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        default:
          $ref: "#/components/responses/ProblemResponse"
    delete:
      tags: [keycap-sets]
      summary: Delete a kit
      operationId: deleteKeycapKit
      description: >
        userId must be the caller's own subject; deleting a kit from
        another user's keycap set, or from a keycap set that doesn't exist,
        both return 404. Idempotent — deleting a kitId not present in the
        set is not an error. on_delete controls what happens if the kit is
        still referenced by a build: "block" (the default) fails with 409
        and lists the blocking build ids; "cascade" deletes the kit and
        every build that references it, returning their ids.
      parameters:
        - name: on_delete
          in: query
          schema:
            type: string
            enum: [block, cascade]
            default: block
          description: How to handle a kit still referenced by one or more builds.
      responses:
        "200":
          description: Deleted via cascade; lists the builds that were also deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CascadeDeleteResult"
        "204":
          description: Deleted (no builds referenced it).
        "400":
          $ref: "#/components/responses/ProblemResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "409":
          description: Blocked by one or more referencing builds (on_delete=block, the default).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/ProblemResponse"

  /v1/users/{userId}/keycap-sets/{keycapSetId}/kits/{kitId}/image:
    parameters:
      - $ref: "#/components/parameters/UserId"
