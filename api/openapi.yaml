  /v1/lookups:
    get:
      tags: [lookups]
      summary: List all lookup category names
      operationId: listLookups
      security: []
      description: >
        Returns category names only, not their values - fetch
        GET /v1/lookups/{category} for a specific category's approved values.
      responses:
        "200":
          description: All lookup category names.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
