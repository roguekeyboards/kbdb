[tools]
go = "1.27.2"
aws-cli = "2"
aws-sam-cli = "1.168.0"
mockery = "3.8.1"
golangci-lint = "2.14.0"
actionlint = "1.7.12"
shellcheck = "0.11.0"
yq = "4.54.1"

[hooks]
postinstall = "go install golang.org/x/tools/gopls@latest"

[tasks.lint]
alias = "l"
description = "Lint Go code and GitHub Actions workflows"
file = "scripts/lint.sh"

[tasks.gen]
alias = "g"
description = "Regenerate mocks, OpenAPI types, and go.mod/go.sum"
file = "scripts/gen.sh"

[tasks.check-generated]
alias = "cg"
description = "Run gen and fail if it changed anything"
file = "scripts/check-generated.sh"

[tasks.test]
alias = "t"
description = "Run unit tests (excludes test/functional)"
file = "scripts/test.sh"

[tasks.build]
alias = "b"
description = "sam build"
file = "scripts/build.sh"

[tasks.setup]
description = "One-time setup of an environment's ECR repo + stack: mise run setup [env], env defaults to dev-$(whoami) (requires an authenticated AWS profile)"
file = "scripts/setup.sh"

[tasks.deploy]
description = "Deploy the current code to an environment: mise run deploy [env], env defaults to dev-$(whoami) (run setup first)"
file = "scripts/deploy.sh"

[tasks.teardown]
description = "Delete an environment's stack and ECR repo: mise run teardown [env], env defaults to dev-$(whoami); refuses prod"
file = "scripts/teardown.sh"

[tasks.func-setup]
alias = "fs"
description = "Deploy template.yaml to floci + generate local OIDC signing material for functional testing"
file = "scripts/func-setup.sh"

[tasks.func-teardown]
alias = "ft"
description = "Tear down whatever func-setup started"
file = "scripts/func-teardown.sh"

[tasks.func-test]
alias = "fx"
description = "Run functional tests (Ginkgo) against whatever func-setup brought up"
file = "scripts/func-test.sh"

[tasks.client-gen]
alias = "cx"
description = "Generate a TypeScript client from api/openapi.yaml into ts-client/ (dev-only scratch dir, requires Docker)"
file = "scripts/client-gen.sh"

[tasks.migrate-build]
alias = "mb"
description = "Build the kbdb-migrate dump/restore CLI into bin/ (not covered by sam build)"
file = "scripts/migrate-build.sh"
