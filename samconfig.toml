#:tombi schema.strict = false
version = 0.1

# One section per environment, deployed with mise run setup|deploy|teardown
# <env> (see CONTRIBUTING.md). Every parameter an environment needs lives in
# its section: passing --parameter-overrides on the command line would
# replace parameter_overrides here wholesale, not merge with it.

[default.global.parameters]
region = "us-east-2"

[dev-jay.deploy.parameters]
stack_name = "kbdb-dev-jay"
s3_bucket = "kbdb-sam-artifacts-992234857260"
# Both functions push to the one repo; SAM tags each image with its
# function's name, so they don't collide.
image_repositories = [
  "ApiFunction=992234857260.dkr.ecr.us-east-2.amazonaws.com/kbdb-api-kbdb-dev-jay",
  "ModerateFunction=992234857260.dkr.ecr.us-east-2.amazonaws.com/kbdb-api-kbdb-dev-jay",
]
region = "us-east-2"
capabilities = "CAPABILITY_IAM"
confirm_changeset = false
fail_on_empty_changeset = false
parameter_overrides = """\
  OidcIssuerBaseUrl=https://auth.jay.mykeebs.dev \
  OidcAudience=project-test-e811f2fd-9992-4bc8-ba6a-ed578b7f5411 \
  IdpConsentPublicToken=public-token-test-ecb1c2b7-2170-4a87-947c-b6dcc6ae3047 \
  CorsAllowOrigins=http://localhost:5173,https://jay.mykeebs.dev \
  LogoutReturnOrigins=http://localhost:5173,https://jay.mykeebs.dev \
  CustomDomainName=api.jay.mykeebs.dev \
  CustomDomainCertificateArn=arn:aws:acm:us-east-2:992234857260:certificate/1831f13e-7a40-4c83-91e7-c93c254e2807\
  """

[prod.deploy.parameters]
stack_name = "kbdb-prod"
s3_bucket = "kbdb-sam-artifacts-416860882648"
image_repositories = [
  "ApiFunction=416860882648.dkr.ecr.us-east-2.amazonaws.com/kbdb-api-kbdb-prod",
  "ModerateFunction=416860882648.dkr.ecr.us-east-2.amazonaws.com/kbdb-api-kbdb-prod",
]
region = "us-east-2"
capabilities = "CAPABILITY_IAM"
confirm_changeset = false
fail_on_empty_changeset = false
parameter_overrides = """\
  OidcIssuerBaseUrl=https://auth.mykeebs.info \
  OidcAudience=project-live-35306870-482a-497d-b0b8-3a884a3071e1 \
  IdpConsentPublicToken=public-token-live-a617925c-c858-4b41-bc96-d4c869e3e3f8 \
  CorsAllowOrigins=https://mykeebs.info \
  LogoutReturnOrigins=https://mykeebs.info \
  CustomDomainName=api.mykeebs.info \
  CustomDomainCertificateArn=arn:aws:acm:us-east-2:416860882648:certificate/f5ba7297-6386-4221-b101-4687ef89f0d0 \
  ProtectData=true \
  ThrottleRateLimit=5 \
  ThrottleBurstLimit=50 \
  ApiReservedConcurrency=15 \
  AlarmEmail=kbdb-alerts-prd@mykeebs.com \
  BudgetEmail=kbdb-budget-prd@mykeebs.com\
  """

# CI deploys per-PR stacks into the separate kbdb-ci account (475976462467),
# selected via `sam build/deploy --config-env ci`. stack_name,
# image_repositories and parameter_overrides are deliberately NOT set here -
# all are supplied per-run on the command line (--stack-name kbdb-pr-<N>,
# computed by .github/actions/kbdb-pr-stack).
[ci.deploy.parameters]
s3_bucket = "kbdb-sam-artifacts-475976462467"
region = "us-east-2"
capabilities = "CAPABILITY_IAM"
confirm_changeset = false
