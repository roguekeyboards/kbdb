version: "2"

linters:
  default: standard
  settings:
    revive:
      # Listing any rule here replaces revive's defaults rather than adding
      # to them, so the whole default set is spelled out - otherwise
      # configuring dot-imports alone silently disables the rest.
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
          arguments:
            - allowedPackages:
                - github.com/onsi/ginkgo/v2
                - github.com/onsi/gomega
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
        - name: var-declaration
        - name: var-naming
  enable:
    - bodyclose
    - contextcheck
    - copyloopvar
    - errorlint
    - ginkgolinter
    - gocritic
    - gosec
    - misspell
    - nilerr
    - nilnil
    - noctx
    - predeclared
    - revive
    - sloglint
    - testifylint
    - unconvert
    - unparam
  exclusions:
    rules:
      # MCP tool handlers return propagated Go errors from ToolHandlerFor;
      # modelcontextprotocol/go-sdk automatically converts non-nil error
      # into CallToolResult{IsError: true} (in-band, not JSON-RPC failure).
      - path: internal/mcp/
        linters:
          - nilerr
      # Test stubs implementing a fixed signature (http.Handler, and the
      # like) often ignore a parameter; the names still document the
      # signature, so blanking them out reads worse than leaving them.
      # Scoped to the one rule so tests keep the rest of revive.
      - path: _test\.go
        linters:
          - revive
        text: unused-parameter

formatters:
  enable:
    - gofmt
