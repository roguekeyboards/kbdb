AWSTemplateFormatVersion: '2010-09-09'
Description: Bootstrap (every account) - the permissions boundary on every role template.yaml creates

Resources:
  StackBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: mykeebs-api-stack-boundary
      Description: Maximum permissions for the roles template.yaml creates
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: FunctionLogs
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource:
              - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/mykeebs-api-*
              - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/mykeebs-api-*:*
          - Sid: Tables
            Effect: Allow
            Action:
              - dynamodb:Query
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
              - dynamodb:TransactWriteItems
              - dynamodb:BatchWriteItem
            Resource:
              - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/mykeebs-api-*
              - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/mykeebs-api-*/index/*
          - Sid: Images
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
              - s3:PutObjectTagging
            Resource: !Sub arn:aws:s3:::mykeebs-images-${AWS::AccountId}-*/*
          - Sid: AccountDeleteNotices
            Effect: Allow
            Action: sns:Publish
            Resource: !Sub arn:aws:sns:${AWS::Region}:${AWS::AccountId}:mykeebs-api-*
          - Sid: ImagesList
            Effect: Allow
            Action: s3:ListBucket
            Resource: !Sub arn:aws:s3:::mykeebs-images-${AWS::AccountId}-*
          - Sid: Moderation
            Effect: Allow
            Action: rekognition:DetectModerationLabels
            Resource: '*'
          - Sid: ModerationDlq
            Effect: Allow
            Action: sqs:SendMessage
            Resource: !Sub arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:mykeebs-api-*
          - Sid: ImageSigningKey
            Effect: Allow
            Action: ssm:GetParameters
            Resource:
              - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/mykeebs-api/image-delivery/private-key
              - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/mykeebs-api/image-delivery/public-key-id
          - Sid: ImagesInvalidation
            Effect: Allow
            Action: cloudfront:CreateInvalidation
            Resource: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/*

Outputs:
  StackBoundaryArn:
    Value: !Ref StackBoundary
