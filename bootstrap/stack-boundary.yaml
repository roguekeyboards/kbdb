AWSTemplateFormatVersion: '2010-09-09'
Description: Bootstrap (every account) - the permissions boundary on every role template.yaml creates

Resources:
  StackBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: kbdb-stack-boundary
      Description: Maximum permissions for the roles template.yaml creates
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: FunctionLogs
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource:
              - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/kbdb-*
              - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/kbdb-*:*
          - Sid: Tables
            Effect: Allow
            Action:
              - dynamodb:Query
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
              - dynamodb:TransactWriteItems
              - dynamodb:BatchWriteItem
            Resource:
              - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/kbdb-*
              - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/kbdb-*/index/*
          - Sid: Images
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
              - s3:PutObjectTagging
            Resource: !Sub arn:aws:s3:::kbdb-images-${AWS::AccountId}-*/*
          - Sid: AccountDeleteNotices
            Effect: Allow
            Action: sns:Publish
            Resource: !Sub arn:aws:sns:${AWS::Region}:${AWS::AccountId}:kbdb-*
          - Sid: ImagesList
            Effect: Allow
            Action: s3:ListBucket
            Resource: !Sub arn:aws:s3:::kbdb-images-${AWS::AccountId}-*
          - Sid: Moderation
            Effect: Allow
            Action: rekognition:DetectModerationLabels
            Resource: '*'
          - Sid: ModerationDlq
            Effect: Allow
            Action: sqs:SendMessage
            Resource: !Sub arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:kbdb-*
          - Sid: AssumePresignSigningRole
            Effect: Allow
            Action: sts:AssumeRole
            Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/kbdb-*-PresignSigningRole-*

Outputs:
  StackBoundaryArn:
    Value: !Ref StackBoundary
