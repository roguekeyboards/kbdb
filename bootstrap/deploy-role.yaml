AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Bootstrap (CI and prod accounts) - GitHub Actions OIDC provider and the role
  its workflows deploy with. CI's PR stacks and prod deploy with the same
  permissions, scoped to their own stack names; only what CI's functional
  tests and teardown need on top is CI-only.

Parameters:
  Environment:
    Type: String
    AllowedValues: [ci, prod]

Mappings:
  Env:
    ci:
      # Stack is a stack name pattern; Items prefixes the resources a
      # stack names after itself.
      Stack: mykeebs-api-pr-*
      Items: mykeebs-api-pr-*
      Repo: mykeebs-api
    prod:
      Stack: mykeebs-api-prod
      Items: mykeebs-api-prod-*
      Repo: mykeebs-api-prod

Conditions:
  IsCI: !Equals [!Ref Environment, ci]
  IsProd: !Equals [!Ref Environment, prod]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com

  GitHubActionsDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: mykeebs-api-github-actions-deploy
      Description: !If
        - IsCI
        - Assumed by GitHub Actions (roguekeyboards/mykeebs-api pull_request workflows) via OIDC federation, no long-lived keys
        - Assumed by GitHub Actions (roguekeyboards/mykeebs-api deploy-prod.yml, v* tags only) via OIDC federation, no long-lived keys
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            # The roguekeyboards org's tokens use GitHub's immutable subject
            # format, which names the owner and repo by name@id.
            Condition: !If
              - IsCI
              - StringEquals:
                  token.actions.githubusercontent.com:aud: sts.amazonaws.com
                  token.actions.githubusercontent.com:sub: repo:roguekeyboards@350380721/mykeebs-api@1288529592:pull_request
              - StringEquals:
                  token.actions.githubusercontent.com:aud: sts.amazonaws.com
                StringLike:
                  token.actions.githubusercontent.com:sub: repo:roguekeyboards@350380721/mykeebs-api@1288529592:ref:refs/tags/v*
                  token.actions.githubusercontent.com:job_workflow_ref: roguekeyboards/mykeebs-api/.github/workflows/deploy-prod.yml@refs/tags/v*
      Policies:
        - PolicyName: mykeebs-api-deploy-permissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CloudFormationDeploy
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResource
                  - cloudformation:DescribeStackResources
                  - cloudformation:ListStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                Resource: !Sub
                  - arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${Stack}/*
                  - Stack: !FindInMap [Env, !Ref Environment, Stack]
              # Read-only for bootstrap-check. Never grant writes to these stacks.
              - Sid: BootstrapTemplates
                Effect: Allow
                Action: cloudformation:GetTemplate
                Resource:
                  - !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/mykeebs-api-bootstrap/*
                  - !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/mykeebs-api-bootstrap-jwks/*
                  - !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/mykeebs-api-stack-boundary/*
                  - !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/mykeebs-image-delivery/*
                  - !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/mykeebs-api-cost-budget/*
                  - !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/mykeebs-api-ecr-bootstrap/*
                  - !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/mykeebs-api-ci-oidc/*
                  - !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/mykeebs-api-prod-oidc/*
              - Sid: CloudFormationServerlessTransform
                Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource:
                  - !Sub arn:aws:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31
                  - !Sub arn:aws:cloudformation:${AWS::Region}:aws:transform/Include
              - Sid: ArtifactBucket
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - !Sub arn:aws:s3:::mykeebs-sam-artifacts-${AWS::AccountId}
                  - !Sub arn:aws:s3:::mykeebs-sam-artifacts-${AWS::AccountId}/*
              - Sid: EcrAuth
                Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                  - ecr-public:GetAuthorizationToken
                  - sts:GetServiceBearerToken
                Resource: '*'
              - Sid: EcrRepo
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:PutImage
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:DescribeRepositories
                  - ecr:DescribeImages
                  - ecr:ListImages
                  - ecr:GetRepositoryPolicy
                  - ecr:SetRepositoryPolicy
                Resource: !Sub
                  - arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${Repo}
                  - Repo: !FindInMap [Env, !Ref Environment, Repo]
              - Sid: Lambda
                Effect: Allow
                Action: lambda:*
                Resource:
                  - !Sub
                    - arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${Stack}
                    - Stack: !FindInMap [Env, !Ref Environment, Stack]
                  - !Sub
                    - arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${Stack}:*
                    - Stack: !FindInMap [Env, !Ref Environment, Stack]
                  - !Sub
                    - arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${Stack}-moderate
                    - Stack: !FindInMap [Env, !Ref Environment, Stack]
                  - !Sub
                    - arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${Stack}-moderate:*
                    - Stack: !FindInMap [Env, !Ref Environment, Stack]
              - Sid: ApiGateway
                Effect: Allow
                Action: apigateway:*
                Resource:
                  - !Sub arn:aws:apigateway:${AWS::Region}::/apis
                  - !Sub arn:aws:apigateway:${AWS::Region}::/apis/*
                  - !Sub arn:aws:apigateway:${AWS::Region}::/tags/*
                  - !If [IsProd, !Sub 'arn:aws:apigateway:${AWS::Region}::/domainnames/api.mykeebs.info', !Ref AWS::NoValue]
                  - !If [IsProd, !Sub 'arn:aws:apigateway:${AWS::Region}::/domainnames/api.mykeebs.info/*', !Ref AWS::NoValue]
              - Sid: StackRoles
                Effect: Allow
                Action:
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:UpdateRole
                  - iam:UpdateRoleDescription
                  - iam:UpdateAssumeRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                Resource: !Sub
                  - arn:aws:iam::${AWS::AccountId}:role/${Items}
                  - Items: !FindInMap [Env, !Ref Environment, Items]
              - Sid: StackRolesWithBoundary
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:PutRolePermissionsBoundary
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:DetachRolePolicy
                Resource: !Sub
                  - arn:aws:iam::${AWS::AccountId}:role/${Items}
                  - Items: !FindInMap [Env, !Ref Environment, Items]
                Condition:
                  StringEquals:
                    iam:PermissionsBoundary: !Sub arn:aws:iam::${AWS::AccountId}:policy/mykeebs-api-stack-boundary
              - Sid: AttachBasicExecutionRole
                Effect: Allow
                Action: iam:AttachRolePolicy
                Resource: !Sub
                  - arn:aws:iam::${AWS::AccountId}:role/${Items}
                  - Items: !FindInMap [Env, !Ref Environment, Items]
                Condition:
                  StringEquals:
                    iam:PermissionsBoundary: !Sub arn:aws:iam::${AWS::AccountId}:policy/mykeebs-api-stack-boundary
                  ArnEquals:
                    iam:PolicyARN: arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
              - Sid: PassStackRolesToLambda
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub
                  - arn:aws:iam::${AWS::AccountId}:role/${Items}
                  - Items: !FindInMap [Env, !Ref Environment, Items]
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com
              # Distribution IDs are generated, so these can't be scoped to a stack.
              - Sid: CloudFrontCreate
                Effect: Allow
                Action:
                  - cloudfront:CreateDistribution
                  - cloudfront:CreateDistributionWithTags
                  - cloudfront:CreateOriginAccessControl
                Resource: '*'
              - Sid: CloudFrontDistributions
                Effect: Allow
                Action:
                  - cloudfront:GetDistribution
                  - cloudfront:GetDistributionConfig
                  - cloudfront:UpdateDistribution
                  - cloudfront:DeleteDistribution
                  - cloudfront:TagResource
                  - cloudfront:UntagResource
                  - cloudfront:ListTagsForResource
                Resource: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/*
              - Sid: CloudFrontOriginAccessControls
                Effect: Allow
                Action:
                  - cloudfront:GetOriginAccessControl
                  - cloudfront:UpdateOriginAccessControl
                  - cloudfront:DeleteOriginAccessControl
                Resource: !Sub arn:aws:cloudfront::${AWS::AccountId}:origin-access-control/*
              # Attaching ImagesDomainCertificateArn to the distribution.
              - Sid: ImagesCertificate
                Effect: Allow
                Action:
                  - acm:DescribeCertificate
                  - acm:ListCertificates
                Resource: '*'
              # Resolving template.yaml's AWS::SSM::Parameter::Value parameters.
              - Sid: ImageDeliveryParameters
                Effect: Allow
                Action: ssm:GetParameters
                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/mykeebs-api/image-delivery/key-group-id
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/mykeebs-api/image-delivery/public-key-id
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/mykeebs-api/image-delivery/response-headers-policy-id
              - Sid: AccountReads
                Effect: Allow
                Action:
                  - iam:GetAccountSummary
                  - lambda:GetAccountSettings
                Resource: '*'

  # A role's inline policies are capped at 10,240 characters in all, so the
  # stack's data, logging and CI-only permissions are a managed policy.
  GitHubActionsDeployStackPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Roles:
        - !Ref GitHubActionsDeployRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DynamoDb
            Effect: Allow
            Action:
              - dynamodb:CreateTable
              - dynamodb:DescribeTable
              - dynamodb:UpdateTable
              - dynamodb:DescribeContinuousBackups
              - dynamodb:UpdateContinuousBackups
              - dynamodb:DescribeTimeToLive
              - dynamodb:UpdateTimeToLive
              - dynamodb:DescribeContributorInsights
              - dynamodb:DescribeKinesisStreamingDestination
              - dynamodb:GetResourcePolicy
              - dynamodb:ListTagsOfResource
              - dynamodb:TagResource
              - dynamodb:UntagResource
            Resource:
              - !Sub
                - arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${Items}
                - Items: !FindInMap [Env, !Ref Environment, Items]
              - !Sub
                - arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${Items}/index/*
                - Items: !FindInMap [Env, !Ref Environment, Items]
          - Sid: ImagesBucket
            Effect: Allow
            Action:
              - s3:CreateBucket
              - s3:ListBucket
              - s3:GetBucket*
              - s3:GetAccelerateConfiguration
              - s3:GetAnalyticsConfiguration
              - s3:GetEncryptionConfiguration
              - s3:GetIntelligentTieringConfiguration
              - s3:GetInventoryConfiguration
              - s3:GetLifecycleConfiguration
              - s3:GetMetricsConfiguration
              - s3:GetReplicationConfiguration
              - s3:ListTagsForResource
              - s3:PutBucketPublicAccessBlock
              - s3:PutEncryptionConfiguration
              - s3:PutBucketCORS
              - s3:PutBucketNotification
              - s3:PutLifecycleConfiguration
              - s3:PutBucketTagging
              - s3:DeleteBucketCors
              - s3:DeleteBucketEncryption
              - s3:DeleteBucketLifecycle
              - s3:TagResource
              - s3:UntagResource
              - s3:GetBucketPolicy
              - s3:PutBucketPolicy
              - s3:DeleteBucketPolicy
            Resource: !Sub
              - arn:aws:s3:::mykeebs-images-${AWS::AccountId}-${Stack}
              - Stack: !FindInMap [Env, !Ref Environment, Stack]
          - Sid: LogGroups
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:DeleteLogGroup
              - logs:PutRetentionPolicy
              - logs:DeleteRetentionPolicy
              - logs:GetDataProtectionPolicy
              - logs:ListTagsForResource
              - logs:TagResource
              - logs:UntagResource
              - logs:PutMetricFilter
              - logs:DeleteMetricFilter
              - logs:DescribeMetricFilters
            Resource:
              - !Sub
                - arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${Stack}
                - Stack: !FindInMap [Env, !Ref Environment, Stack]
              - !Sub
                - arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${Stack}:*
                - Stack: !FindInMap [Env, !Ref Environment, Stack]
              - !Sub
                - arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${Stack}-moderate
                - Stack: !FindInMap [Env, !Ref Environment, Stack]
              - !Sub
                - arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${Stack}-moderate:*
                - Stack: !FindInMap [Env, !Ref Environment, Stack]
              - !Sub
                - arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/apigateway/${Stack}
                - Stack: !FindInMap [Env, !Ref Environment, Stack]
              - !Sub
                - arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/apigateway/${Stack}:*
                - Stack: !FindInMap [Env, !Ref Environment, Stack]
          - Sid: LogsUnscoped
            Effect: Allow
            Action:
              - logs:DescribeLogGroups
              - logs:DescribeIndexPolicies
              - logs:DescribeResourcePolicies
              - logs:PutResourcePolicy
              - logs:GetLogDelivery
              - logs:ListLogDeliveries
              - logs:CreateLogDelivery
              - logs:UpdateLogDelivery
              - logs:DeleteLogDelivery
            Resource: '*'
          - Sid: ModerationDlq
            Effect: Allow
            Action:
              - sqs:CreateQueue
              - sqs:DeleteQueue
              - sqs:GetQueueAttributes
              - sqs:GetQueueUrl
              - sqs:SetQueueAttributes
              - sqs:ListQueueTags
              - sqs:TagQueue
              - sqs:UntagQueue
            Resource: !Sub
              - arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:${Items}
              - Items: !FindInMap [Env, !Ref Environment, Items]
          - Sid: AlarmTopic
            Effect: Allow
            Action:
              - sns:CreateTopic
              - sns:DeleteTopic
              - sns:GetTopicAttributes
              - sns:SetTopicAttributes
              - sns:Subscribe
              - sns:Unsubscribe
              - sns:ListSubscriptionsByTopic
              - sns:GetDataProtectionPolicy
              - sns:ListTagsForResource
              - sns:TagResource
              - sns:UntagResource
            Resource: !Sub
              - arn:aws:sns:${AWS::Region}:${AWS::AccountId}:${Items}
              - Items: !FindInMap [Env, !Ref Environment, Items]
          - Sid: Alarms
            Effect: Allow
            Action:
              - cloudwatch:PutMetricAlarm
              - cloudwatch:DescribeAlarms
              - cloudwatch:DeleteAlarms
              - cloudwatch:ListTagsForResource
              - cloudwatch:TagResource
              - cloudwatch:UntagResource
            Resource: !Sub
              - arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${Items}
              - Items: !FindInMap [Env, !Ref Environment, Items]
          # CI only: PR stacks are torn down after each run, and the
          # functional tests read and write the stack's data directly.
          - !If
            - IsCI
            - Sid: PrStackTeardown
              Effect: Allow
              Action:
                - cloudformation:CreateStack
                - cloudformation:UpdateStack
                - cloudformation:DeleteStack
                - dynamodb:DeleteTable
                - s3:DeleteBucket
                - ecr:BatchDeleteImage
              Resource:
                - !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/mykeebs-api-pr-*/*
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/mykeebs-api-pr-*
                - !Sub arn:aws:s3:::mykeebs-images-${AWS::AccountId}-mykeebs-api-pr-*
                - !Sub arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/mykeebs-api
            - !Ref AWS::NoValue
          - !If
            - IsCI
            - Sid: FunctionalTestData
              Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - s3:GetObject
                - s3:PutObject
                - s3:DeleteObject
                - s3:GetObjectTagging
                - s3:PutObjectTagging
                - sqs:ReceiveMessage
                - sqs:DeleteMessage
                - logs:CreateLogStream
                - logs:PutLogEvents
                - cloudfront:CreateInvalidation
                - cloudfront:ListInvalidations
                - cloudfront:GetInvalidation
              Resource:
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/mykeebs-api-pr-*
                - !Sub arn:aws:s3:::mykeebs-images-${AWS::AccountId}-mykeebs-api-pr-*/*
                - !Sub arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:mykeebs-api-pr-*
                - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/mykeebs-api-moderate-mykeebs-api-pr-*:*
                - !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/*
            - !Ref AWS::NoValue
          - !If
            - IsCI
            - Sid: JwksBucket
              Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
                - s3:DeleteObject
                - s3:ListBucket
              Resource:
                - !Sub arn:aws:s3:::mykeebs-jwks-${AWS::AccountId}
                - !Sub arn:aws:s3:::mykeebs-jwks-${AWS::AccountId}/*
            - !Ref AWS::NoValue

Outputs:
  GitHubActionsDeployRoleArn:
    Description: CI's is in .github/actions/mykeebs-api-pr-stack/action.yml; prod's is the PROD_DEPLOY_ROLE_ARN repo variable
    Value: !GetAtt GitHubActionsDeployRole.Arn
