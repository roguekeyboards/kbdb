AWSTemplateFormatVersion: '2010-09-09'
Description: >
  One-time-per-account bootstrap: a managed IAM policy granting exactly the
  permissions mise run setup/deploy/teardown need for a kbdb-dev-* stack, scoped to
  kbdb-dev-* stacks/resources - not AdministratorAccess. Deployed once by
  an account admin (see AWS_SETUP.md), then attached to whichever IAM
  identity (user, group, or role) each developer authenticates as. Mirrors
  bootstrap/ci-oidc-role.yaml's permissions policy - same resource surface,
  since deploy and CI's functional-test job both deploy the same
  template.yaml - but scoped to kbdb-dev-* instead of kbdb-pr-*, and with
  the extra actions setup/teardown need that CI's job never does
  (CI's ECR repo is a permanent, admin-managed bootstrap resource shared
  across every PR; each developer creates and destroys their own).

Resources:
  DevPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: kbdb-dev-deploy
      Description: "Everything mise run setup/deploy/teardown need, scoped to kbdb-dev-* stacks and their owned resources."
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CloudFormationDeploy
            Effect: Allow
            Action:
              - cloudformation:CreateStack
              - cloudformation:UpdateStack
              - cloudformation:DeleteStack
              - cloudformation:DescribeStacks
              - cloudformation:DescribeStackEvents
              - cloudformation:DescribeStackResources
              - cloudformation:CreateChangeSet
              - cloudformation:DescribeChangeSet
              - cloudformation:ExecuteChangeSet
              - cloudformation:DeleteChangeSet
              - cloudformation:ListStackResources
              - cloudformation:GetTemplate
              - cloudformation:GetTemplateSummary
            Resource:
              # The dev's own app stack (kbdb-dev-<name>) ...
              - !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/kbdb-dev-*/*
              # ... and its ECR repo stack (kbdb-ecr-bootstrap-kbdb-dev-<name>,
              # from bootstrap/ecr-repo.yaml).
              - !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/kbdb-ecr-bootstrap-kbdb-dev-*/*
          - Sid: CloudFormationServerlessTransform
            Effect: Allow
            Action: cloudformation:CreateChangeSet
            # template.yaml's Transform: AWS::Serverless-2016-10-31 requires
            # this separate, account-owned (not stack-scoped) ARN.
            Resource: !Sub arn:aws:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31
          - Sid: BudgetsScoped
            Effect: Allow
            Action:
              - budgets:ViewBudget
              - budgets:ModifyBudget
              - budgets:TagResource
              - budgets:DeleteBudget
            # Budgets ARNs have no region segment. CloudFormation names the
            # budget <LogicalResourceId>-<region>-<timestamp>-<random>;
            # CostBudget is template.yaml's logical id for this resource.
            Resource: !Sub arn:aws:budgets::${AWS::AccountId}:budget/CostBudget-*
          - Sid: BudgetsDependentActions
            Effect: Allow
            # Dependent actions AWS documents alongside ModifyBudget/
            # ViewBudget; neither is scopable to a specific budget.
            Action:
              - iam:CreateServiceLinkedRole
              - billing:GetBillingViewData
            Resource: '*'
          - Sid: LambdaScoped
            Effect: Allow
            Action: lambda:*
            Resource:
              - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:kbdb-api-kbdb-dev-*
              - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:kbdb-moderate-kbdb-dev-*
          - Sid: ApiGatewayManagement
            Effect: Allow
            Action: apigateway:*
            # API Gateway v2 IDs are opaque and don't exist until after
            # creation, so there's no kbdb-dev-*-based ARN pattern to use.
            Resource:
              - !Sub arn:aws:apigateway:${AWS::Region}::/apis
              - !Sub arn:aws:apigateway:${AWS::Region}::/apis/*
              - !Sub arn:aws:apigateway:${AWS::Region}::/tags/*
          - Sid: IamPassRoleForSam
            Effect: Allow
            Action:
              - iam:CreateRole
              - iam:DeleteRole
              - iam:GetRole
              - iam:PassRole
              - iam:AttachRolePolicy
              - iam:DetachRolePolicy
              - iam:PutRolePolicy
              - iam:DeleteRolePolicy
              - iam:GetRolePolicy
              - iam:TagRole
              - iam:UntagRole
            # SAM names ApiFunction's execution role
            # <StackName>-ApiFunctionRole-<random> - kbdb-dev-* (a prefix
            # match) covers it without needing the exact suffix.
            Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/kbdb-dev-*
          - Sid: ArtifactBucket
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:ListBucket
            Resource:
              - !Sub arn:aws:s3:::kbdb-sam-artifacts-${AWS::AccountId}
              - !Sub arn:aws:s3:::kbdb-sam-artifacts-${AWS::AccountId}/*
          # template.yaml's ImagesBucket. Unlike CI's per-PR stacks, a dev
          # owns this bucket's full lifecycle: setup creates it, teardown
          # deletes it (S3 refuses DeleteBucket on a non-empty bucket, so
          # teardown also needs object-level delete + list).
          - Sid: ImagesBucketManagement
            Effect: Allow
            Action:
              - s3:CreateBucket
              - s3:DeleteBucket
              - s3:PutBucketPublicAccessBlock
              - s3:GetBucketPublicAccessBlock
              - s3:PutEncryptionConfiguration
              - s3:GetEncryptionConfiguration
              - s3:PutBucketTagging
              - s3:GetBucketTagging
              - s3:PutBucketCORS
              - s3:GetBucketCORS
              - s3:PutBucketNotification
              - s3:GetBucketNotification
              - s3:PutLifecycleConfiguration
              - s3:GetLifecycleConfiguration
              - s3:ListBucket
            Resource: !Sub arn:aws:s3:::kbdb-images-${AWS::AccountId}-kbdb-dev-*
          - Sid: ImagesBucketObjects
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
            Resource: !Sub arn:aws:s3:::kbdb-images-${AWS::AccountId}-kbdb-dev-*/*
          - Sid: DynamoDbScoped
            Effect: Allow
            Action:
              - dynamodb:CreateTable
              - dynamodb:DeleteTable
              - dynamodb:DescribeTable
              - dynamodb:TagResource
              - dynamodb:DescribeTimeToLive
              - dynamodb:UpdateTimeToLive
              - dynamodb:PutItem
              - dynamodb:DeleteItem
            # Every AWS::DynamoDB::Table in template.yaml (SwitchTable,
            # KeyboardTable, KeycapSetTable, BuildTable, ProfileTable,
            # ProfileUsernameTable, UploadCounterTable). Mirrors
            # bootstrap/ci-oidc-role.yaml's equivalent statement; the
            # kbdb-dev-* wildcard covers all of them.
            Resource: !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/kbdb-dev-*
          - Sid: LogsScoped
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:DeleteLogGroup
              - logs:PutRetentionPolicy
              - logs:TagResource
            # template.yaml's ApiFunctionLogGroup and ModerateFunctionLogGroup.
            # Mirrors bootstrap/ci-oidc-role.yaml's equivalent statement.
            Resource:
              - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/kbdb-api-kbdb-dev-*
              - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/kbdb-moderate-kbdb-dev-*
          # template.yaml's ModerationDLQ, named <StackName>-ModerationDLQ-<random>.
          # Mirrors bootstrap/ci-oidc-role.yaml's equivalent statement.
          - Sid: SqsScoped
            Effect: Allow
            Action:
              - sqs:CreateQueue
              - sqs:DeleteQueue
              - sqs:GetQueueAttributes
              - sqs:SetQueueAttributes
              - sqs:TagQueue
              - sqs:UntagQueue
              - sqs:ListQueueTags
            Resource: !Sub arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:kbdb-dev-*
          # template.yaml's AlarmTopic and alarms, created only when the
          # environment sets AlarmEmail. CI never does, so ci-oidc-role.yaml
          # has no equivalent.
          - Sid: AlarmsScoped
            Effect: Allow
            Action:
              - sns:CreateTopic
              - sns:DeleteTopic
              - sns:GetTopicAttributes
              - sns:SetTopicAttributes
              - sns:Subscribe
              - sns:Unsubscribe
              - sns:ListSubscriptionsByTopic
              - sns:TagResource
              - cloudwatch:PutMetricAlarm
              - cloudwatch:DeleteAlarms
              - cloudwatch:DescribeAlarms
              - cloudwatch:TagResource
            Resource:
              - !Sub arn:aws:sns:${AWS::Region}:${AWS::AccountId}:kbdb-dev-*
              - !Sub arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:kbdb-dev-*
          - Sid: EcrAuth
            Effect: Allow
            Action: ecr:GetAuthorizationToken
            # AWS hard requirement - cannot be scoped to a specific repo.
            Resource: '*'
          - Sid: EcrPublicAuth
            Effect: Allow
            Action: ecr-public:GetAuthorizationToken
            # functions/api/Dockerfile pulls base images from public.ecr.aws;
            # authenticating raises the anonymous-pull rate limit a dev can
            # otherwise hit ("toomanyrequests: Rate exceeded"). Separate action
            # namespace from private ECR's ecr:GetAuthorizationToken; also a
            # hard Resource: "*" requirement. Mirrors ci-oidc-role.yaml.
            Resource: '*'
          - Sid: EcrPublicStsToken
            Effect: Allow
            Action: sts:GetServiceBearerToken
            # The sts:GetServiceBearerToken call for ECR Public happens
            # server-side inside ECR Public's backend (aws-actions/amazon-ecr-
            # login never calls STS directly), so there's no verifiable
            # sts:AWSServiceName to condition on. Matches AWS's canonical
            # example policy for this permission (no Condition). Mirrors
            # ci-oidc-role.yaml.
            Resource: '*'
          - Sid: EcrRepoManagement
            Effect: Allow
            Action:
              # Unlike kbdb-ci's one shared, admin-managed repo, each
              # developer's repo (kbdb-api-kbdb-dev-<name>) is created by
              # setup and destroyed by teardown - so, unlike
              # bootstrap/ci-oidc-role.yaml's equivalent statement, this
              # needs to fully manage the repo's lifecycle, not just push/
              # pull images to an already-existing one.
              - ecr:CreateRepository
              - ecr:DeleteRepository
              - ecr:PutLifecyclePolicy
              - ecr:BatchCheckLayerAvailability
              - ecr:PutImage
              - ecr:InitiateLayerUpload
              - ecr:UploadLayerPart
              - ecr:CompleteLayerUpload
              - ecr:BatchGetImage
              - ecr:GetDownloadUrlForLayer
              - ecr:DescribeRepositories
              - ecr:ListImages
              - ecr:BatchDeleteImage
              # Per AWS's Lambda-container-image docs: for a same-account
              # function+repo, Lambda auto-configures the repository policy
              # granting itself pull access as part of CreateFunction - but
              # only if the principal calling CreateFunction also has these.
              - ecr:GetRepositoryPolicy
              - ecr:SetRepositoryPolicy
              # Both confirmed via real AccessDenied errors (UPDATE_FAILED
              # on ApiRepository, one per action) when the repo was
              # imported into a stack: DeleteRepositoryPolicy clears a
              # repository policy the template doesn't set; TagResource
              # applies the owning stack's tags to the repo.
              - ecr:DeleteRepositoryPolicy
              - ecr:TagResource
            Resource: !Sub arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/kbdb-api-kbdb-dev-*

Outputs:
  DevPolicyArn:
    Description: >
      Attach to a developer's IAM user/group/role, e.g.:
      aws iam attach-user-policy --user-name <dev> --policy-arn <value>
    Value: !Ref DevPolicy
