AWSTemplateFormatVersion: '2010-09-09'
Description: Bootstrap (kbdb-ci) - GitHub Actions OIDC provider and CI deploy role

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com

  GitHubActionsDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: kbdb-github-actions-deploy
      Description: >
        Assumed by GitHub Actions (rogueserenity/kbdb pull_request
        workflows) via OIDC federation, no long-lived keys
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: repo:rogueserenity/kbdb:pull_request
      Policies:
        - PolicyName: kbdb-ci-deploy-permissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CloudFormationDeploy
                Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DeleteStack
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:ListStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                Resource: !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/kbdb-pr-*/*
              - Sid: BudgetsScoped
                Effect: Allow
                Action:
                  - budgets:ViewBudget
                  - budgets:ModifyBudget
                  - budgets:TagResource
                  - budgets:DeleteBudget
                Resource: !Sub arn:aws:budgets::${AWS::AccountId}:budget/CostBudget-*
              - Sid: BudgetsDependentActions
                Effect: Allow
                Action:
                  - iam:CreateServiceLinkedRole
                  - billing:GetBillingViewData
                Resource: '*'
              # Read-only for bootstrap-check. Never grant writes to these stacks.
              - Sid: BootstrapTemplates
                Effect: Allow
                Action: cloudformation:GetTemplate
                Resource:
                  - !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/kbdb-stack-boundary/*
                  - !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/kbdb-ci-oidc/*
                  - !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/kbdb-image-delivery/*
              - Sid: CloudFormationServerlessTransform
                Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource:
                  - !Sub arn:aws:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31
                  - !Sub arn:aws:cloudformation:${AWS::Region}:aws:transform/Include
              - Sid: LambdaScoped
                Effect: Allow
                Action: lambda:*
                Resource:
                  - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:kbdb-api-kbdb-pr-*
                  - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:kbdb-moderate-kbdb-pr-*
              - Sid: ApiGatewayManagement
                Effect: Allow
                Action: apigateway:*
                Resource:
                  - !Sub arn:aws:apigateway:${AWS::Region}::/apis
                  - !Sub arn:aws:apigateway:${AWS::Region}::/apis/*
                  - !Sub arn:aws:apigateway:${AWS::Region}::/tags/*
              - Sid: IamPassRoleForSam
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:PassRole
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:PutRolePermissionsBoundary
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/kbdb-pr-*
              - Sid: ArtifactBucket
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - !Sub arn:aws:s3:::kbdb-sam-artifacts-${AWS::AccountId}
                  - !Sub arn:aws:s3:::kbdb-sam-artifacts-${AWS::AccountId}/*
              - Sid: JwksBucket
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !Sub arn:aws:s3:::kbdb-jwks-${AWS::AccountId}
                  - !Sub arn:aws:s3:::kbdb-jwks-${AWS::AccountId}/*
              - Sid: ImagesBucketManagement
                Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:DeleteBucket
                  - s3:PutBucketPublicAccessBlock
                  - s3:GetBucketPublicAccessBlock
                  - s3:PutEncryptionConfiguration
                  - s3:GetEncryptionConfiguration
                  - s3:PutBucketTagging
                  - s3:GetBucketTagging
                  - s3:PutBucketCORS
                  - s3:GetBucketCORS
                  - s3:PutBucketNotification
                  - s3:GetBucketNotification
                  - s3:PutLifecycleConfiguration
                  - s3:GetLifecycleConfiguration
                  - s3:ListBucket
                Resource: !Sub arn:aws:s3:::kbdb-images-${AWS::AccountId}-kbdb-pr-*
              - Sid: ImagesBucketObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:GetObjectTagging
                Resource: !Sub arn:aws:s3:::kbdb-images-${AWS::AccountId}-kbdb-pr-*/*
              # Distribution IDs are generated, so these can't be scoped to a stack.
              - Sid: CloudFrontCreate
                Effect: Allow
                Action:
                  - cloudfront:CreateDistribution
                  - cloudfront:CreateDistributionWithTags
                  - cloudfront:CreateOriginAccessControl
                Resource: '*'
              - Sid: CloudFrontDistributions
                Effect: Allow
                Action:
                  - cloudfront:GetDistribution
                  - cloudfront:GetDistributionConfig
                  - cloudfront:UpdateDistribution
                  - cloudfront:DeleteDistribution
                  - cloudfront:TagResource
                  - cloudfront:UntagResource
                  - cloudfront:ListTagsForResource
                Resource: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/*
              - Sid: CloudFrontOriginAccessControls
                Effect: Allow
                Action:
                  - cloudfront:GetOriginAccessControl
                  - cloudfront:UpdateOriginAccessControl
                  - cloudfront:DeleteOriginAccessControl
                Resource: !Sub arn:aws:cloudfront::${AWS::AccountId}:origin-access-control/*
              - Sid: ImagesBucketPolicy
                Effect: Allow
                Action:
                  - s3:GetBucketPolicy
                  - s3:PutBucketPolicy
                  - s3:DeleteBucketPolicy
                Resource: !Sub arn:aws:s3:::kbdb-images-${AWS::AccountId}-kbdb-pr-*
              # Resolving template.yaml's AWS::SSM::Parameter::Value parameters.
              - Sid: ImageDeliveryParameters
                Effect: Allow
                Action: ssm:GetParameters
                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/kbdb/image-delivery/key-group-id
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/kbdb/image-delivery/public-key-id
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/kbdb/image-delivery/response-headers-policy-id
              - Sid: EcrAuth
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Sid: EcrPublicAuth
                Effect: Allow
                Action: ecr-public:GetAuthorizationToken
                Resource: '*'
              - Sid: EcrPublicStsToken
                Effect: Allow
                Action: sts:GetServiceBearerToken
                Resource: '*'
              - Sid: DynamoDbScoped
                Effect: Allow
                Action:
                  - dynamodb:CreateTable
                  - dynamodb:DeleteTable
                  - dynamodb:DescribeTable
                  - dynamodb:TagResource
                  - dynamodb:DescribeTimeToLive
                  - dynamodb:UpdateTimeToLive
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:DeleteItem
                Resource: !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/kbdb-pr-*
              - Sid: LogsScoped
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:PutRetentionPolicy
                  - logs:TagResource
                  - logs:PutMetricFilter
                  - logs:DeleteMetricFilter
                  - logs:DescribeMetricFilters
                Resource:
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/kbdb-api-kbdb-pr-*
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/kbdb-moderate-kbdb-pr-*
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/apigateway/kbdb-api-kbdb-pr-*
              - Sid: SqsScoped
                Effect: Allow
                Action:
                  - sqs:CreateQueue
                  - sqs:DeleteQueue
                  - sqs:GetQueueAttributes
                  - sqs:SetQueueAttributes
                  - sqs:TagQueue
                  - sqs:UntagQueue
                  - sqs:ListQueueTags
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                Resource: !Sub arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:kbdb-pr-*
              - Sid: AlarmTopic
                Effect: Allow
                Action:
                  - sns:CreateTopic
                  - sns:DeleteTopic
                  - sns:GetTopicAttributes
                  - sns:SetTopicAttributes
                  - sns:Subscribe
                  - sns:Unsubscribe
                  - sns:ListSubscriptionsByTopic
                  - sns:GetDataProtectionPolicy
                  - sns:ListTagsForResource
                  - sns:TagResource
                  - sns:UntagResource
                Resource: !Sub arn:aws:sns:${AWS::Region}:${AWS::AccountId}:kbdb-pr-*
              - Sid: Alarms
                Effect: Allow
                Action:
                  - cloudwatch:PutMetricAlarm
                  - cloudwatch:DescribeAlarms
                  - cloudwatch:DeleteAlarms
                  - cloudwatch:ListTagsForResource
                  - cloudwatch:TagResource
                  - cloudwatch:UntagResource
                Resource: !Sub arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:kbdb-pr-*
              - Sid: LogsDelivery
                Effect: Allow
                Action:
                  - logs:DescribeLogGroups
                  - logs:DescribeResourcePolicies
                  - logs:GetLogDelivery
                  - logs:ListLogDeliveries
                  - logs:CreateLogDelivery
                  - logs:UpdateLogDelivery
                  - logs:DeleteLogDelivery
                  - logs:PutResourcePolicy
                Resource: '*'
              - Sid: EcrRepoAccess
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:PutImage
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:DescribeRepositories
                  - ecr:ListImages
                  - ecr:BatchDeleteImage
                  - ecr:GetRepositoryPolicy
                  - ecr:SetRepositoryPolicy
                Resource: !Sub arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/kbdb-api

Outputs:
  GitHubActionsDeployRoleArn:
    Description: Referenced by .github/actions/kbdb-pr-stack/action.yml's role-to-assume
    Value: !GetAtt GitHubActionsDeployRole.Arn
