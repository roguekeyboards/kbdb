AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Bootstrap (every account) - the CloudFront signing key and response headers
  policy shared by every stack's images distribution. Deployed by
  mise run bootstrap, through scripts/image-delivery-setup.sh.

# Per account rather than per stack: an account holds at most 10 key groups,
# 10 public keys and 20 response headers policies, and mykeebs-api-ci runs many PR
# stacks at once.

Parameters:
  PublicKeyPem:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /mykeebs-api/image-delivery/public-key
    Description: >-
      The public half of the account's ECDSA P-256 image signing key pair, which
      scripts/image-delivery-setup.sh generates. The private half is the
      SecureString /mykeebs-api/image-delivery/private-key.

Resources:
  # CloudFront can't change a public key's EncodedKey, so a new key type
  # needs a new resource and name.
  SigningPublicKeyP256:
    Type: AWS::CloudFront::PublicKey
    Properties:
      PublicKeyConfig:
        CallerReference: mykeebs-image-signing-p256
        Name: mykeebs-image-signing-p256
        EncodedKey: !Ref PublicKeyPem

  SigningKeyGroup:
    Type: AWS::CloudFront::KeyGroup
    Properties:
      KeyGroupConfig:
        Name: mykeebs-image-signing
        Items:
          - !Ref SigningPublicKeyP256

  # Every image key's bytes are immutable (#495), so browsers may keep them
  # for good.
  ImmutableResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: mykeebs-images-immutable
        CustomHeadersConfig:
          Items:
            - Header: Cache-Control
              Value: public, max-age=31536000, immutable
              Override: true

  # Read by template.yaml's AWS::SSM::Parameter::Value parameters.
  PublicKeyIdParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /mykeebs-api/image-delivery/public-key-id
      Type: String
      Value: !Ref SigningPublicKeyP256

  KeyGroupIdParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /mykeebs-api/image-delivery/key-group-id
      Type: String
      Value: !Ref SigningKeyGroup

  ResponseHeadersPolicyIdParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /mykeebs-api/image-delivery/response-headers-policy-id
      Type: String
      Value: !Ref ImmutableResponseHeadersPolicy
