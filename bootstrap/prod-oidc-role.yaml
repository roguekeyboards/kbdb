AWSTemplateFormatVersion: '2010-09-09'
Description: >
  One-time bootstrap (kbdb-prod only): the GitHub Actions OIDC identity
  provider and the role deploy-prod.yml assumes to deploy a release tag to
  the kbdb-prod stack. Deployed by hand with the kbdb-prod-admin profile,
  like the other bootstrap/*.yaml templates.

  Unlike ci-oidc-role.yaml's role, which creates and deletes short-lived
  kbdb-pr-* stacks, this one updates one long-lived stack. Its actions come
  from the CloudFormation resource schemas' handler permissions (aws
  cloudformation describe-type) for each resource type template.yaml
  creates, scoped to kbdb-prod's resources. It can't delete the stack, the
  tables or the images bucket: a deploy that would replace one of them
  fails instead.

  Every role it creates or changes must carry kbdb-stack-boundary
  (bootstrap/stack-boundary.yaml), which caps what template.yaml can grant
  them.

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com

  GitHubActionsProdDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: kbdb-github-actions-prod-deploy
      Description: >
        Assumed by GitHub Actions (rogueserenity/kbdb deploy-prod.yml, v*
        tags only) via OIDC federation, no long-lived keys
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              # deploy-prod.yml running on a release's tag. Only the release
              # App can create v* tags (tag ruleset), and no other workflow
              # that runs on a tag can assume this role.
              StringLike:
                token.actions.githubusercontent.com:sub: repo:rogueserenity/kbdb:ref:refs/tags/v*
                token.actions.githubusercontent.com:job_workflow_ref: rogueserenity/kbdb/.github/workflows/deploy-prod.yml@refs/tags/v*
      Policies:
        - PolicyName: kbdb-prod-deploy-permissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # sam deploy goes through change sets, so no Create/Update/
              # DeleteStack.
              - Sid: CloudFormationDeploy
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResource
                  - cloudformation:DescribeStackResources
                  - cloudformation:ListStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                Resource: !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/kbdb-prod/*
              - Sid: CloudFormationServerlessTransform
                Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource:
                  - !Sub arn:aws:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31
                  - !Sub arn:aws:cloudformation:${AWS::Region}:aws:transform/Include
              - Sid: ArtifactBucket
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - !Sub arn:aws:s3:::kbdb-sam-artifacts-${AWS::AccountId}
                  - !Sub arn:aws:s3:::kbdb-sam-artifacts-${AWS::AccountId}/*
              # GetAuthorizationToken can't be scoped to a repo. The public
              # registry login raises the anonymous pull rate limit for
              # functions/*/Dockerfile's public.ecr.aws base images.
              - Sid: EcrAuth
                Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                  - ecr-public:GetAuthorizationToken
                  - sts:GetServiceBearerToken
                Resource: '*'
              # Get/SetRepositoryPolicy: Lambda grants itself pull access on
              # the repo when the caller deploying the function can.
              - Sid: EcrRepo
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:PutImage
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:DescribeRepositories
                  - ecr:DescribeImages
                  - ecr:ListImages
                  - ecr:GetRepositoryPolicy
                  - ecr:SetRepositoryPolicy
                Resource: !Sub arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/kbdb-api-kbdb-prod
              - Sid: Lambda
                Effect: Allow
                Action: lambda:*
                Resource:
                  - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:kbdb-api-kbdb-prod
                  - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:kbdb-api-kbdb-prod:*
                  - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:kbdb-moderate-kbdb-prod
                  - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:kbdb-moderate-kbdb-prod:*
              # API IDs are random, so /apis/* can't be narrowed further;
              # kbdb-prod's is the account's only API.
              - Sid: ApiGateway
                Effect: Allow
                Action: apigateway:*
                Resource:
                  - !Sub arn:aws:apigateway:${AWS::Region}::/apis
                  - !Sub arn:aws:apigateway:${AWS::Region}::/apis/*
                  - !Sub arn:aws:apigateway:${AWS::Region}::/tags/*
                  - !Sub arn:aws:apigateway:${AWS::Region}::/domainnames/api.mykeebs.info
                  - !Sub arn:aws:apigateway:${AWS::Region}::/domainnames/api.mykeebs.info/*
              - Sid: StackRoles
                Effect: Allow
                Action:
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:UpdateRole
                  - iam:UpdateRoleDescription
                  - iam:UpdateAssumeRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/kbdb-prod-*
              # Whatever a template grants a stack role, kbdb-stack-boundary
              # (bootstrap/stack-boundary.yaml) caps it: these only apply to
              # roles that carry it, and nothing here can remove it.
              - Sid: StackRolesWithBoundary
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:PutRolePermissionsBoundary
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:DetachRolePolicy
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/kbdb-prod-*
                Condition:
                  StringEquals:
                    iam:PermissionsBoundary: !Sub arn:aws:iam::${AWS::AccountId}:policy/kbdb-stack-boundary
              # The one managed policy SAM attaches to function roles.
              - Sid: AttachBasicExecutionRole
                Effect: Allow
                Action: iam:AttachRolePolicy
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/kbdb-prod-*
                Condition:
                  StringEquals:
                    iam:PermissionsBoundary: !Sub arn:aws:iam::${AWS::AccountId}:policy/kbdb-stack-boundary
                  ArnEquals:
                    iam:PolicyARN: arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
              - Sid: PassStackRolesToLambda
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/kbdb-prod-*
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com
              # No DeleteTable or item access.
              - Sid: DynamoDb
                Effect: Allow
                Action:
                  - dynamodb:CreateTable
                  - dynamodb:DescribeTable
                  - dynamodb:UpdateTable
                  - dynamodb:DescribeContinuousBackups
                  - dynamodb:UpdateContinuousBackups
                  - dynamodb:DescribeTimeToLive
                  - dynamodb:UpdateTimeToLive
                  - dynamodb:DescribeContributorInsights
                  - dynamodb:DescribeKinesisStreamingDestination
                  - dynamodb:GetResourcePolicy
                  - dynamodb:ListTagsOfResource
                  - dynamodb:TagResource
                  - dynamodb:UntagResource
                Resource:
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/kbdb-prod-*
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/kbdb-prod-*/index/*
              # No DeleteBucket or object access.
              - Sid: ImagesBucket
                Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:ListBucket
                  - s3:GetBucket*
                  - s3:GetAccelerateConfiguration
                  - s3:GetAnalyticsConfiguration
                  - s3:GetEncryptionConfiguration
                  - s3:GetIntelligentTieringConfiguration
                  - s3:GetInventoryConfiguration
                  - s3:GetLifecycleConfiguration
                  - s3:GetMetricsConfiguration
                  - s3:GetReplicationConfiguration
                  - s3:ListTagsForResource
                  - s3:PutBucketPublicAccessBlock
                  - s3:PutEncryptionConfiguration
                  - s3:PutBucketCORS
                  - s3:PutBucketNotification
                  - s3:PutLifecycleConfiguration
                  - s3:PutBucketTagging
                  - s3:DeleteBucketCors
                  - s3:DeleteBucketEncryption
                  - s3:DeleteBucketLifecycle
                  - s3:TagResource
                  - s3:UntagResource
                Resource: !Sub arn:aws:s3:::kbdb-images-${AWS::AccountId}-kbdb-prod
              - Sid: LogGroups
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:PutRetentionPolicy
                  - logs:DeleteRetentionPolicy
                  - logs:GetDataProtectionPolicy
                  - logs:ListTagsForResource
                  - logs:TagResource
                  - logs:UntagResource
                  # template.yaml's AccountDeleteNoticeFailedFilter.
                  - logs:PutMetricFilter
                  - logs:DeleteMetricFilter
                  - logs:DescribeMetricFilters
                Resource:
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/kbdb-api-kbdb-prod
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/kbdb-api-kbdb-prod:*
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/kbdb-moderate-kbdb-prod
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/kbdb-moderate-kbdb-prod:*
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/apigateway/kbdb-api-kbdb-prod
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/apigateway/kbdb-api-kbdb-prod:*
              # HTTP API access logging goes through vended log delivery,
              # whose actions don't take a log group resource. The policy
              # simulator doesn't allow DescribeIndexPolicies on a log group
              # ARN either.
              - Sid: LogsUnscoped
                Effect: Allow
                Action:
                  - logs:DescribeLogGroups
                  - logs:DescribeIndexPolicies
                  - logs:DescribeResourcePolicies
                  - logs:PutResourcePolicy
                  - logs:GetLogDelivery
                  - logs:ListLogDeliveries
                  - logs:CreateLogDelivery
                  - logs:UpdateLogDelivery
                  - logs:DeleteLogDelivery
                Resource: '*'
              - Sid: ModerationDlq
                Effect: Allow
                Action:
                  - sqs:CreateQueue
                  - sqs:DeleteQueue
                  - sqs:GetQueueAttributes
                  - sqs:GetQueueUrl
                  - sqs:SetQueueAttributes
                  - sqs:ListQueueTags
                  - sqs:TagQueue
                  - sqs:UntagQueue
                Resource: !Sub arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:kbdb-prod-*
              - Sid: AlarmTopic
                Effect: Allow
                Action:
                  - sns:CreateTopic
                  - sns:DeleteTopic
                  - sns:GetTopicAttributes
                  - sns:SetTopicAttributes
                  - sns:Subscribe
                  - sns:Unsubscribe
                  - sns:ListSubscriptionsByTopic
                  - sns:GetDataProtectionPolicy
                  - sns:ListTagsForResource
                  - sns:TagResource
                  - sns:UntagResource
                Resource: !Sub arn:aws:sns:${AWS::Region}:${AWS::AccountId}:kbdb-prod-*
              - Sid: Alarms
                Effect: Allow
                Action:
                  - cloudwatch:PutMetricAlarm
                  - cloudwatch:DescribeAlarms
                  - cloudwatch:DeleteAlarms
                  - cloudwatch:ListTagsForResource
                  - cloudwatch:TagResource
                  - cloudwatch:UntagResource
                Resource: !Sub arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:kbdb-prod-*
              # Budgets ARNs have no region. CloudFormation names the budget
              # CostBudget-<region>-<timestamp>-<random>.
              - Sid: Budget
                Effect: Allow
                Action:
                  - budgets:ViewBudget
                  - budgets:ModifyBudget
                  - budgets:DeleteBudget
                  - budgets:ListTagsForResource
                  - budgets:TagResource
                  - budgets:UntagResource
                Resource: !Sub arn:aws:budgets::${AWS::AccountId}:budget/CostBudget-*
              # Dependent actions of ModifyBudget and ViewBudget; neither
              # takes a resource.
              - Sid: BudgetDependencies
                Effect: Allow
                Action:
                  - iam:CreateServiceLinkedRole
                  - billing:GetBillingViewData
                Resource: '*'
              # Budgets delivers email through User Notifications, and
              # registers a budget's subscriber addresses there with the
              # deploying caller's permissions.
              - Sid: BudgetEmailContacts
                Effect: Allow
                Action:
                  - notifications-contacts:ListEmailContacts
                  - notifications-contacts:GetEmailContact
                  - notifications-contacts:CreateEmailContact
                  - notifications-contacts:SendActivationCode
                Resource: '*'
              # Account-level reads CloudFormation makes before creating
              # roles and functions (seen in CloudTrail on the first
              # deploy).
              - Sid: AccountReads
                Effect: Allow
                Action:
                  - iam:GetAccountSummary
                  - lambda:GetAccountSettings
                Resource: '*'

Outputs:
  GitHubActionsProdDeployRoleArn:
    Description: Set as the PROD_DEPLOY_ROLE_ARN repo variable
    Value: !GetAtt GitHubActionsProdDeployRole.Arn
