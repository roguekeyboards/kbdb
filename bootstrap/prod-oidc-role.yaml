AWSTemplateFormatVersion: '2010-09-09'
Description: Bootstrap (kbdb-prod) - GitHub Actions OIDC provider and prod deploy role

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com

  GitHubActionsProdDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: kbdb-github-actions-prod-deploy
      Description: >
        Assumed by GitHub Actions (rogueserenity/kbdb deploy-prod.yml, v*
        tags only) via OIDC federation, no long-lived keys
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: repo:rogueserenity/kbdb:ref:refs/tags/v*
                token.actions.githubusercontent.com:job_workflow_ref: rogueserenity/kbdb/.github/workflows/deploy-prod.yml@refs/tags/v*
      Policies:
        - PolicyName: kbdb-prod-deploy-permissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CloudFormationDeploy
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResource
                  - cloudformation:DescribeStackResources
                  - cloudformation:ListStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                Resource: !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/kbdb-prod/*
              # Read-only for bootstrap-check. Never grant writes to these stacks.
              - Sid: BootstrapTemplates
                Effect: Allow
                Action: cloudformation:GetTemplate
                Resource:
                  - !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/kbdb-stack-boundary/*
                  - !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/kbdb-prod-oidc/*
                  - !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/kbdb-image-delivery/*
              - Sid: CloudFormationServerlessTransform
                Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource:
                  - !Sub arn:aws:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31
                  - !Sub arn:aws:cloudformation:${AWS::Region}:aws:transform/Include
              - Sid: ArtifactBucket
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - !Sub arn:aws:s3:::kbdb-sam-artifacts-${AWS::AccountId}
                  - !Sub arn:aws:s3:::kbdb-sam-artifacts-${AWS::AccountId}/*
              - Sid: EcrAuth
                Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                  - ecr-public:GetAuthorizationToken
                  - sts:GetServiceBearerToken
                Resource: '*'
              - Sid: EcrRepo
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:PutImage
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:DescribeRepositories
                  - ecr:DescribeImages
                  - ecr:ListImages
                  - ecr:GetRepositoryPolicy
                  - ecr:SetRepositoryPolicy
                Resource: !Sub arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/kbdb-api-kbdb-prod
              - Sid: Lambda
                Effect: Allow
                Action: lambda:*
                Resource:
                  - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:kbdb-api-kbdb-prod
                  - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:kbdb-api-kbdb-prod:*
                  - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:kbdb-moderate-kbdb-prod
                  - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:kbdb-moderate-kbdb-prod:*
              - Sid: ApiGateway
                Effect: Allow
                Action: apigateway:*
                Resource:
                  - !Sub arn:aws:apigateway:${AWS::Region}::/apis
                  - !Sub arn:aws:apigateway:${AWS::Region}::/apis/*
                  - !Sub arn:aws:apigateway:${AWS::Region}::/tags/*
                  - !Sub arn:aws:apigateway:${AWS::Region}::/domainnames/api.mykeebs.info
                  - !Sub arn:aws:apigateway:${AWS::Region}::/domainnames/api.mykeebs.info/*
              - Sid: StackRoles
                Effect: Allow
                Action:
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:UpdateRole
                  - iam:UpdateRoleDescription
                  - iam:UpdateAssumeRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/kbdb-prod-*
              - Sid: StackRolesWithBoundary
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:PutRolePermissionsBoundary
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:DetachRolePolicy
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/kbdb-prod-*
                Condition:
                  StringEquals:
                    iam:PermissionsBoundary: !Sub arn:aws:iam::${AWS::AccountId}:policy/kbdb-stack-boundary
              - Sid: AttachBasicExecutionRole
                Effect: Allow
                Action: iam:AttachRolePolicy
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/kbdb-prod-*
                Condition:
                  StringEquals:
                    iam:PermissionsBoundary: !Sub arn:aws:iam::${AWS::AccountId}:policy/kbdb-stack-boundary
                  ArnEquals:
                    iam:PolicyARN: arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
              - Sid: PassStackRolesToLambda
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/kbdb-prod-*
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com
              - Sid: DynamoDb
                Effect: Allow
                Action:
                  - dynamodb:CreateTable
                  - dynamodb:DescribeTable
                  - dynamodb:UpdateTable
                  - dynamodb:DescribeContinuousBackups
                  - dynamodb:UpdateContinuousBackups
                  - dynamodb:DescribeTimeToLive
                  - dynamodb:UpdateTimeToLive
                  - dynamodb:DescribeContributorInsights
                  - dynamodb:DescribeKinesisStreamingDestination
                  - dynamodb:GetResourcePolicy
                  - dynamodb:ListTagsOfResource
                  - dynamodb:TagResource
                  - dynamodb:UntagResource
                Resource:
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/kbdb-prod-*
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/kbdb-prod-*/index/*
              - Sid: ImagesBucket
                Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:ListBucket
                  - s3:GetBucket*
                  - s3:GetAccelerateConfiguration
                  - s3:GetAnalyticsConfiguration
                  - s3:GetEncryptionConfiguration
                  - s3:GetIntelligentTieringConfiguration
                  - s3:GetInventoryConfiguration
                  - s3:GetLifecycleConfiguration
                  - s3:GetMetricsConfiguration
                  - s3:GetReplicationConfiguration
                  - s3:ListTagsForResource
                  - s3:PutBucketPublicAccessBlock
                  - s3:PutEncryptionConfiguration
                  - s3:PutBucketCORS
                  - s3:PutBucketNotification
                  - s3:PutLifecycleConfiguration
                  - s3:PutBucketTagging
                  - s3:DeleteBucketCors
                  - s3:DeleteBucketEncryption
                  - s3:DeleteBucketLifecycle
                  - s3:TagResource
                  - s3:UntagResource
                Resource: !Sub arn:aws:s3:::kbdb-images-${AWS::AccountId}-kbdb-prod
              # Distribution IDs are generated, so these can't be scoped to a stack.
              - Sid: CloudFrontCreate
                Effect: Allow
                Action:
                  - cloudfront:CreateDistribution
                  - cloudfront:CreateDistributionWithTags
                  - cloudfront:CreateOriginAccessControl
                Resource: '*'
              - Sid: CloudFrontDistributions
                Effect: Allow
                Action:
                  - cloudfront:GetDistribution
                  - cloudfront:GetDistributionConfig
                  - cloudfront:UpdateDistribution
                  - cloudfront:DeleteDistribution
                  - cloudfront:TagResource
                  - cloudfront:UntagResource
                  - cloudfront:ListTagsForResource
                Resource: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/*
              - Sid: CloudFrontOriginAccessControls
                Effect: Allow
                Action:
                  - cloudfront:GetOriginAccessControl
                  - cloudfront:UpdateOriginAccessControl
                  - cloudfront:DeleteOriginAccessControl
                Resource: !Sub arn:aws:cloudfront::${AWS::AccountId}:origin-access-control/*
              # Attaching ImagesDomainCertificateArn to the distribution.
              - Sid: ImagesCertificate
                Effect: Allow
                Action:
                  - acm:DescribeCertificate
                  - acm:ListCertificates
                Resource: '*'
              - Sid: ImagesBucketPolicy
                Effect: Allow
                Action:
                  - s3:GetBucketPolicy
                  - s3:PutBucketPolicy
                  - s3:DeleteBucketPolicy
                Resource: !Sub arn:aws:s3:::kbdb-images-${AWS::AccountId}-kbdb-prod
              # Resolving template.yaml's AWS::SSM::Parameter::Value parameters.
              - Sid: ImageDeliveryParameters
                Effect: Allow
                Action: ssm:GetParameters
                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/kbdb/image-delivery/key-group-id
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/kbdb/image-delivery/public-key-id
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/kbdb/image-delivery/response-headers-policy-id
              - Sid: LogGroups
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:PutRetentionPolicy
                  - logs:DeleteRetentionPolicy
                  - logs:GetDataProtectionPolicy
                  - logs:ListTagsForResource
                  - logs:TagResource
                  - logs:UntagResource
                  - logs:PutMetricFilter
                  - logs:DeleteMetricFilter
                  - logs:DescribeMetricFilters
                Resource:
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/kbdb-api-kbdb-prod
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/kbdb-api-kbdb-prod:*
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/kbdb-moderate-kbdb-prod
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/kbdb-moderate-kbdb-prod:*
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/apigateway/kbdb-api-kbdb-prod
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/apigateway/kbdb-api-kbdb-prod:*
              - Sid: LogsUnscoped
                Effect: Allow
                Action:
                  - logs:DescribeLogGroups
                  - logs:DescribeIndexPolicies
                  - logs:DescribeResourcePolicies
                  - logs:PutResourcePolicy
                  - logs:GetLogDelivery
                  - logs:ListLogDeliveries
                  - logs:CreateLogDelivery
                  - logs:UpdateLogDelivery
                  - logs:DeleteLogDelivery
                Resource: '*'
              - Sid: ModerationDlq
                Effect: Allow
                Action:
                  - sqs:CreateQueue
                  - sqs:DeleteQueue
                  - sqs:GetQueueAttributes
                  - sqs:GetQueueUrl
                  - sqs:SetQueueAttributes
                  - sqs:ListQueueTags
                  - sqs:TagQueue
                  - sqs:UntagQueue
                Resource: !Sub arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:kbdb-prod-*
              - Sid: AlarmTopic
                Effect: Allow
                Action:
                  - sns:CreateTopic
                  - sns:DeleteTopic
                  - sns:GetTopicAttributes
                  - sns:SetTopicAttributes
                  - sns:Subscribe
                  - sns:Unsubscribe
                  - sns:ListSubscriptionsByTopic
                  - sns:GetDataProtectionPolicy
                  - sns:ListTagsForResource
                  - sns:TagResource
                  - sns:UntagResource
                Resource: !Sub arn:aws:sns:${AWS::Region}:${AWS::AccountId}:kbdb-prod-*
              - Sid: Alarms
                Effect: Allow
                Action:
                  - cloudwatch:PutMetricAlarm
                  - cloudwatch:DescribeAlarms
                  - cloudwatch:DeleteAlarms
                  - cloudwatch:ListTagsForResource
                  - cloudwatch:TagResource
                  - cloudwatch:UntagResource
                Resource: !Sub arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:kbdb-prod-*
              - Sid: Budget
                Effect: Allow
                Action:
                  - budgets:ViewBudget
                  - budgets:ModifyBudget
                  - budgets:DeleteBudget
                  - budgets:ListTagsForResource
                  - budgets:TagResource
                  - budgets:UntagResource
                Resource: !Sub arn:aws:budgets::${AWS::AccountId}:budget/CostBudget-*
              - Sid: BudgetDependencies
                Effect: Allow
                Action:
                  - iam:CreateServiceLinkedRole
                  - billing:GetBillingViewData
                Resource: '*'
              - Sid: BudgetEmailContacts
                Effect: Allow
                Action:
                  - notifications-contacts:ListEmailContacts
                  - notifications-contacts:GetEmailContact
                  - notifications-contacts:CreateEmailContact
                  - notifications-contacts:SendActivationCode
                Resource: '*'
              - Sid: AccountReads
                Effect: Allow
                Action:
                  - iam:GetAccountSummary
                  - lambda:GetAccountSettings
                Resource: '*'

Outputs:
  GitHubActionsProdDeployRoleArn:
    Description: Set as the PROD_DEPLOY_ROLE_ARN repo variable
    Value: !GetAtt GitHubActionsProdDeployRole.Arn
