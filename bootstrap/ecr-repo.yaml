AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Per-environment bootstrap: the ECR repo ApiFunction's image is pushed to.
  It lives in its own permanent stack rather than template.yaml because sam
  deploy pushes the image before creating/updating the app stack, so the
  repo has to exist first. mykeebs-api-ci's shared per-PR repo is deployed by hand
  (CONTRIBUTING.md); every other environment's is deployed by mise run setup.

  DeletionPolicy: Retain keeps the repo if this stack is deleted. mise run
  teardown deletes the repo itself afterwards; importing an existing repo
  into this stack also requires an explicit DeletionPolicy.

Parameters:
  RepositoryName:
    Type: String
    Default: mykeebs-api
    Description: >
      mykeebs-api for mykeebs-api-ci's shared repo; mise run setup passes
      <stack name>.
  ExpireBy:
    Type: String
    Default: age
    AllowedValues: [age, count]
    Description: >
      age expires every image 2 days after push - for mykeebs-api-ci, which only
      holds transient per-PR images. count keeps the 5 newest - for any
      environment with a live image a Lambda function is running.

Conditions:
  ExpireByAge: !Equals [!Ref ExpireBy, age]

Resources:
  # Age-based expiry matches on tagStatus "any", not a tag prefix: sam
  # build/deploy tags images apifunction-<content-hash>-latest, so a
  # tagPrefixList of "pr-" (an earlier version) never matched anything.
  #
  # Count-based expiry exists because age alone has no floor - it would
  # expire a live environment's deployed image out from under its Lambda
  # function if deploys went quiet for longer than the threshold.
  #
  # (ECR's own "description" field has a 255-char limit, hence the
  # reasoning living here.)
  #
  # RepositoryPolicyText declares the pull grant Lambda would otherwise add
  # itself at CreateFunction. Left undeclared, CloudFormation deletes that
  # grant on any update to this resource, and the function fails with
  # ImageAccessDenied the next time it is reactivated from Inactive. Function
  # names are <stack name>: exactly RepositoryName for a per-env
  # repo, mykeebs-api-pr-<N> for mykeebs-api-ci's shared one.
  ApiRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    Properties:
      RepositoryName: !Ref RepositoryName
      RepositoryPolicyText:
        Version: '2012-10-17'
        Statement:
          - Sid: LambdaECRImageRetrievalPolicy
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - ecr:BatchGetImage
              - ecr:GetDownloadUrlForLayer
            Condition:
              StringLike:
                aws:sourceArn: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${RepositoryName}*
      LifecyclePolicy:
        LifecyclePolicyText: !If
          - ExpireByAge
          - |
            {
              "rules": [
                {
                  "rulePriority": 1,
                  "description": "Expire any image 2 days after push",
                  "selection": {
                    "tagStatus": "any",
                    "countType": "sinceImagePushed",
                    "countUnit": "days",
                    "countNumber": 2
                  },
                  "action": { "type": "expire" }
                }
              ]
            }
          - |
            {
              "rules": [
                {
                  "rulePriority": 1,
                  "description": "Keep the 5 most recent images, expire the rest",
                  "selection": {
                    "tagStatus": "any",
                    "countType": "imageCountMoreThan",
                    "countNumber": 5
                  },
                  "action": { "type": "expire" }
                }
              ]
            }

Outputs:
  ApiRepositoryUri:
    Description: Pass this to sam build/deploy via --image-repositories ApiFunction=<value>
    Value: !GetAtt ApiRepository.RepositoryUri
